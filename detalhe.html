<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>White Sand Apartments | Detalhe</title>
  <style>
    :root {
      --bg: #f0f7ff;
      --panel: #ffffff;
      --text: #1f2a37;
      --muted: #5f6c7b;
      --main: #15b8cc;
      --main-dark: #0b87a2;
      --line: #d8e6f2;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
      background-color: #e5d7bb;
      background-image:
        linear-gradient(rgba(244, 248, 255, 0.05), rgba(244, 248, 255, 0.08)),
        url("./fundo-praia.png");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat, repeat-y;
      background-attachment: scroll;
    }
    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 16px;
    }
    .hero {
      background: linear-gradient(140deg, rgba(236, 228, 210, 0.92), rgba(231, 221, 200, 0.9));
      color: #1f2a37;
      border-radius: 16px;
      padding: 14px;
      border: 1px solid rgba(168, 151, 120, 0.35);
    }
    .top-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }
    .back {
      text-decoration: none;
      color: #1f2a37;
      border: 1px solid rgba(31, 42, 55, 0.25);
      background: rgba(255, 255, 255, 0.65);
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: 700;
    }
    h1 {
      margin: 12px 0 6px;
      font-size: clamp(1.2rem, 2.5vw, 1.8rem);
    }
    .subtitle { margin: 0; opacity: .94; }
    .card {
      margin-top: 12px;
      background: #e5d7bb;
      border: 1px solid #b79f72;
      border-radius: 14px;
      padding: 14px;
    }
    .list { margin: 0; padding-left: 18px; }
    .list li { margin-bottom: 7px; }
    .line { margin: 6px 0; }
    .amenities-intro {
      margin: 0 0 10px;
      font-size: 1.95rem;
      font-weight: 800;
      line-height: 1.15;
    }
    .amenities-list li {
      font-size: 1.14rem;
      font-weight: 400;
      line-height: 1.25;
      margin-bottom: 8px;
    }
    .wifi-note {
      margin: 0 0 10px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #b79f72;
      background: rgba(255, 255, 255, 0.35);
      font-weight: 600;
    }
    .wifi-list {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .wifi-item {
      background: #efe3cf;
      border: 1px solid #b79f72;
      border-radius: 12px;
      padding: 10px 12px;
    }
    .wifi-apt {
      margin: 0 0 6px;
      font-weight: 800;
      font-size: 1.02rem;
    }
    .wifi-meta {
      margin: 2px 0;
      font-size: 0.98rem;
    }
    .wifi-lock {
      display: inline-block;
      margin-top: 7px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #5f6c7b;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(31, 42, 55, 0.2);
      border-radius: 999px;
      padding: 2px 8px;
    }
    .wifi-btn {
      display: inline-block;
      margin-top: 8px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 700;
      color: #1f2a37;
      background: #f7f5f2;
      border: 1px solid #b79f72;
      border-radius: 999px;
      padding: 6px 10px;
    }
    .wifi-btn:hover {
      background: #fff;
    }
    .link {
      color: #0f7f9d;
      text-decoration: none;
      font-weight: 600;
    }
    .link:hover { text-decoration: underline; }
    .lang-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .lang-btn {
      border: 1px solid rgba(31, 42, 55, 0.35);
      background: rgba(255, 255, 255, 0.9);
      color: #1f2a37;
      border-radius: 999px;
      padding: 4px 10px 6px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 64px;
      min-height: 48px;
      gap: 2px;
    }
    .lang-btn.active {
      background: #1f2a37;
      color: #fff;
      border-color: #1f2a37;
    }
    .lang-flag {
      font-size: 1.15rem;
      line-height: 1;
      display: block;
    }
    .lang-code {
      line-height: 1;
      font-size: 0.82rem;
    }
    .welcome-layout {
      display: grid;
      gap: 14px;
      grid-template-columns: 1.4fr 1fr;
      align-items: stretch;
    }
    .welcome-block {
      background: #e5d7bb;
      border: 1px solid #b79f72;
      border-radius: 10px;
      padding: 16px 18px;
      line-height: 1.6;
      margin: 0;
      min-height: 210px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      text-align: center;
      font-size: clamp(1.03rem, 1.4vw, 1.15rem);
      padding-bottom: 42px;
    }
    .welcome-image-slot {
      background: rgba(255, 255, 255, 0.72);
      border: 2px dashed rgba(31, 42, 55, 0.25);
      border-radius: 12px;
      min-height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #4b5563;
      font-weight: 600;
      padding: 0;
      overflow: hidden;
    }
    .welcome-image-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .checkin-gallery {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .checkin-gallery img {
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--line);
      display: block;
      background: #fff;
    }
    .extra-location {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 12px;
      align-items: stretch;
    }
    .extra-location-text {
      margin: 0;
      padding: 14px;
      line-height: 1.55;
      font-weight: 700;
      background: #e5d7bb;
      border: 1px solid #b79f72;
      border-radius: 12px;
    }
    .extra-location-images {
      display: grid;
      gap: 10px;
    }
    .extra-location-images img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--line);
      display: block;
      background: #fff;
    }
    .info-sections {
      display: grid;
      gap: 12px;
    }
    .info-item {
      background: #e5d7bb;
      border: 1px solid #b79f72;
      border-radius: 12px;
      padding: 12px 14px;
    }
    .info-item-title {
      margin: 0 0 6px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .info-item-title .icon {
      font-size: 1.1rem;
      line-height: 1;
    }
    .info-item-text {
      margin: 0;
      line-height: 1.5;
    }
    .rules-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .rule-card {
      background: #efe3cf;
      border: 1px solid rgba(31, 42, 55, 0.08);
      border-radius: 24px;
      padding: 14px 12px 16px;
      min-height: 222px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    .rule-num {
      margin: 0;
      font-family: "Bodoni Moda", "Didot", "Times New Roman", Georgia, serif;
      font-size: clamp(3rem, 4vw, 3.35rem);
      line-height: .88;
      font-weight: 500;
      letter-spacing: 1px;
    }
    .rule-title {
      margin: 8px 0 8px;
      text-transform: uppercase;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 1.1px;
      font-size: 1.95rem;
      font-weight: 700;
      line-height: .92;
    }
    .rule-text {
      margin: 0;
      line-height: 1.1;
      font-size: 1.07rem;
      max-width: 95%;
    }
    .rule-card.last {
      grid-column: 1 / -1;
      max-width: 300px;
      margin: 0 auto;
    }
    .safety-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .safety-card {
      background: #efe3cf;
      border: 1px solid rgba(31, 42, 55, 0.08);
      border-radius: 24px;
      padding: 14px 16px 16px;
      min-height: auto;
      text-align: left;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
    }
    .safety-bullet {
      display: block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #1f2a37;
      margin: 0 0 10px;
      flex-shrink: 0;
    }
    .safety-title {
      margin: 0 0 6px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: 0.02em;
    }
    .safety-detail {
      margin: 0;
      line-height: 1.35;
      font-size: clamp(1rem, 2.2vw, 1.12rem);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .safety-note {
      margin: 10px 0 0;
      line-height: 1.45;
      font-size: clamp(0.85rem, 2vw, 0.95rem);
      font-weight: 500;
      color: #4a5563;
    }
    .transport-wrap {
      text-align: left;
    }
    .transport-wrap .safety-grid {
      margin-top: 0;
    }
    .transport-tabs {
      text-align: left;
    }
    .transport-tabs .safety-grid {
      grid-template-columns: 1fr;
    }
    .transport-tablist {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .transport-tab {
      border: 1px solid #b79f72;
      background: rgba(255, 255, 255, 0.65);
      color: #1f2a37;
      border-radius: 999px;
      padding: 8px 16px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      font-family: inherit;
    }
    .transport-tab--active {
      background: #1f2a37;
      color: #fff;
      border-color: #1f2a37;
    }
    .transport-panel {
      display: none;
    }
    .transport-panel--active {
      display: block;
    }
    .transport-app-downloads {
      margin-top: 10px;
      line-height: 1.55;
    }
    .transport-app-downloads a {
      display: inline-block;
      margin-top: 4px;
    }
    .bus-line {
      display: inline-block;
      margin-top: 5px;
      font-weight: 700;
    }
    .bus-line--verde {
      color: #166534;
    }
    .bus-line--azul {
      color: #1d4ed8;
    }
    .transport-bus-photo {
      margin: 8px 0 10px;
      max-width: 140px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(31, 42, 55, 0.12);
    }
    .transport-bus-photo img {
      width: 100%;
      max-width: 140px;
      height: auto;
      display: block;
      vertical-align: middle;
    }
    @media (max-width: 760px) {
      .top-row {
        justify-content: flex-start;
      }
      .welcome-layout {
        grid-template-columns: 1fr;
      }
      .welcome-image-slot {
        min-height: 150px;
      }
      .checkin-gallery {
        grid-template-columns: 1fr;
      }
      .extra-location {
        grid-template-columns: 1fr;
      }
      .rules-grid,
      .safety-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .transport-tabs .safety-grid {
        grid-template-columns: 1fr;
      }
      .rule-card.last {
        max-width: none;
      }
      .rule-card {
        min-height: 208px;
        border-radius: 22px;
      }
      .rule-title {
        font-size: clamp(1.18rem, 3.6vw, 1.45rem);
      }
      .rule-text {
        font-size: clamp(0.90rem, 2.8vw, 1rem);
      }
      .amenities-intro {
        font-size: clamp(1.2rem, 4.8vw, 1.5rem);
      }
      .amenities-list li {
        font-size: clamp(1rem, 3.3vw, 1.08rem);
      }
      .wifi-list {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 420px) {
      .rules-grid,
      .safety-grid { grid-template-columns: 1fr; }
    }
    .rest-list { display: grid; gap: 14px; }
    .rest-card { background: #efe3cf; border: 1px solid #b79f72; border-radius: 14px; padding: 14px 16px; }
    .rest-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .rest-name { font-size: 1.08rem; font-weight: 800; line-height: 1.2; text-decoration: none; color: #0f7f9d; }
    .rest-name:hover { text-decoration: underline; }
    .rest-price { font-weight: 800; font-size: 0.95rem; border-radius: 999px; padding: 2px 11px; flex-shrink: 0; }
    .rest-price.eco { background: #d4edda; color: #2a6a3a; border: 1px solid #8fca99; }
    .rest-price.mid { background: #fff3cd; color: #7a5c00; border: 1px solid #e6c462; }
    .rest-price.hi { background: #fce4d6; color: #8b2500; border: 1px solid #e8a07a; }
    .rest-cuisine { display: inline-block; font-size: 0.87rem; font-weight: 700; background: rgba(255,255,255,0.58); border: 1px solid rgba(31,42,55,0.18); border-radius: 999px; padding: 2px 10px; margin-bottom: 8px; }
    .rest-addr { margin: 0 0 10px; font-size: 0.91rem; color: #5f6c7b; }
    .rest-menu-label { margin: 0 0 6px; font-weight: 800; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.07em; color: #1f2a37; }
    .rest-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .rest-tags span { background: rgba(255,255,255,0.68); border: 1px solid rgba(31,42,55,0.15); border-radius: 999px; padding: 2px 9px; font-size: 0.82rem; font-weight: 600; }
    .place-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .place-card { background: #efe3cf; border: 1px solid #b79f72; border-radius: 14px; overflow: hidden; }
    .place-thumb { width: 100%; aspect-ratio: 1/1; background: #b8a690 center/cover no-repeat; }
    .place-body { padding: 10px 12px 12px; }
    .place-name { font-size: 0.93rem; font-weight: 800; color: #1a3040; margin: 0 0 5px; }
    .place-desc { font-size: 0.79rem; color: #5f6c7b; margin: 0 0 8px; line-height: 1.45; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="top-row">
        <a class="back" href="./" data-i18n="back">← Voltar</a>
        <div class="lang-row">
          <button class="lang-btn active" data-lang="pt"><span class="lang-flag">🇵🇹</span><span class="lang-code">PT</span></button>
          <button class="lang-btn" data-lang="en"><span class="lang-flag">🇬🇧</span><span class="lang-code">EN</span></button>
          <button class="lang-btn" data-lang="fr"><span class="lang-flag">🇫🇷</span><span class="lang-code">FR</span></button>
          <button class="lang-btn" data-lang="es"><span class="lang-flag">🇪🇸</span><span class="lang-code">ES</span></button>
          <button class="lang-btn" data-lang="de"><span class="lang-flag">🇩🇪</span><span class="lang-code">DE</span></button>
        </div>
      </div>
      <h1 id="title">Detalhe</h1>
      <p class="subtitle" id="subtitle">Informação do tópico selecionado.</p>
    </section>

    <section class="card" id="content"></section>
  </main>

  <script>
    const text = {
      pt: {
        back: "← Voltar",
        fallbackTitle: "Informação",
        fallbackSubtitle: "Tópico não encontrado.",
        sections: {
          welcome: {
            title: "Bem-vindo",
            subtitle: "Resumo do alojamento White Sand Apartments.",
            html: "<div class='welcome-layout'><p class='welcome-block'>White Sand Apartamentos, totalmente remodelados, com uma decoração moderna, de tipologia T1, T2 e T0, localiza-se numa das zonas mais privilegiadas de Albufeira, perto de todos os serviços e apenas a 300 m da praia! Com todas as comodidades que estes oferecem queremos lhe proporcionar uma ótima experiência para tornar a sua estadia o mais cômoda possível e acima de tudo que descanse e desfrute de umas belas férias!</p><div class='welcome-image-slot'><img src='./welcome-all.png' alt='Apartamento White Sand'></div></div>"
          },
          check: {
            title: "Check-in",
            subtitle: "Horários e processo de entrada.",
            html: "<p class='line'><strong>Check-in:</strong> a partir das 16:00</p><p class='line'>As chaves serão colocadas num pequeno cofre à entrada do prédio. Receberá o código de acesso no dia da sua chegada.</p><div class='checkin-gallery'><img src='./checkin-2.jpg' alt='Entrada do prédio'><img src='./checkin-3.jpg' alt='Entrada e localização'><img src='./checkin-1.jpg' alt='Cofre de chaves'></div>"
          },
          location: {
            title: "Localização",
            subtitle: "Morada e mapa do apartamento.",
            html: "<p class='line'><strong>Morada:</strong> Rua do MFA, n.15 Apto (Letra do seu Apartamento), 8200-157 Albufeira</p><p class='line'><strong>Coordenadas:</strong> 37.0891053, -8.2507170</p><p class='line'><a class='link' target='_blank' rel='noreferrer' href='https://goo.gl/maps/sj565hq985biABaD6'>Abrir no Google Maps</a></p><div class='extra-location'><p class='extra-location-text'>Os apartamentos estão situados no centro histórico de Albufeira, a poucos minutos a pé da Praia dos Pescadores e de outras praias. A localização é excelente, com restaurantes, bares, supermercados e lojas mesmo ao redor, permitindo fazer tudo a pé. A poucos metros encontra também a Praça da Cidade Velha, ruas típicas algarvias, miradouros com vistas incríveis sobre o mar. Ideal para quem quer aproveitar o melhor da cidade, entre praia, animação e sem necessidade de carro.</p><div class='extra-location-images'><img src='./localizacao-1.jpg' alt='Praia em Albufeira'><img src='./localizacao-2.jpg' alt='Centro histórico de Albufeira'></div></div>"
          },
          info: {
            title: "Informação",
            subtitle: "Dados importantes para a estadia.",
            html: "<div class='info-sections'><div class='info-item'><p class='info-item-title'><span class='icon'>🅿️</span>Parque</p><p class='info-item-text'>Na mesma rua onde estamos e nas redondezas poderá estacionar gratuitamente (estacionamento de rua). Tem também um parque pago a 130 metros. Localização parque: <a class='link' target='_blank' rel='noreferrer' href='https://maps.app.goo.gl/gmK6iXghkyXu6mPLA'>Abrir localização</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🧹</span>Serviço de limpeza</p><p class='info-item-text'>Fornecemos roupa de cama e toalhas de banho para a sua estadia. Para estadias mais longas, ao 8º dia fornecemos gratuitamente troca de roupa e uma breve limpeza.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🗑️</span>O lixo - contentores</p><p class='info-item-text'>Existem numa rua mais abaixo contentores específicos para deixar o seu lixo. Localização: <a class='link' target='_blank' rel='noreferrer' href='https://maps.app.goo.gl/SYxqfTYpkznRy9Ky6'>Abrir localização</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🧾</span>TMT</p><p class='info-item-text'>Taxa turística municipal de Albufeira (2€ por pessoa/noite até máximo de 7 noites), conforme regulamento local. Se o valor do imposto não estiver incluído no valor total da sua reserva, terá de ser feito pagamento, mediante a informação que lhe for enviada.</p></div></div>"
          },
          rules: {
            title: "Regras da casa",
            subtitle: "Regras principais para uma estadia tranquila.",
            html: "<div class='rules-grid'><div class='rule-card'><p class='rule-num'>01</p><p class='rule-title'>Proibido fumar</p><p class='rule-text'>Por favor, não fume dentro do Apartamento. Utiliza o espaço exterior.</p></div><div class='rule-card'><p class='rule-num'>02</p><p class='rule-title'>Sem visitas</p><p class='rule-text'>Sem visitantes não registados. Informe o anfitrião se desejar adicionar convidados ao contrato de aluguer.</p></div><div class='rule-card'><p class='rule-num'>03</p><p class='rule-title'>Sem pets</p><p class='rule-text'>Não permitimos a presença de animais de estimação na propriedade em nenhum momento.</p></div><div class='rule-card'><p class='rule-num'>04</p><p class='rule-title'>Sem festas</p><p class='rule-text'>Não são permitidas festas ou eventos.</p></div><div class='rule-card'><p class='rule-num'>05</p><p class='rule-title'>Danos</p><p class='rule-text'>Por favor, informe imediatamente o anfitrião sobre qualquer dano ou mau funcionamento para que possamos reparar ou substituir o item danificado.</p></div><div class='rule-card'><p class='rule-num'>06</p><p class='rule-title'>Horas de silêncio</p><p class='rule-text'>Para o conforto e usufruto tanto de hóspedes como dos vizinhos, solicitamos que os níveis de ruído sejam reduzidos ao mínimo durante as horas de silêncio.</p></div></div>"

          visit: {
            title: "Locais a visitar",
            subtitle: "11 pontos turísticos imperdíveis em Albufeira.",
            html: "<div class='place-grid'><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/6/6a/15-09-2017_Praia_dos_Pescadores%2C_Albufeira_%283%29.JPG)'></div><div class='place-body'><p class='place-name'>🏖️ Praia dos Pescadores</p><p class='place-desc'>A praia mais icónica de Albufeira, a 5 min a pé. Águas calmas sob as falésias do centro histórico.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Praia+dos+Pescadores+Albufeira' target='_blank' rel='noreferrer'>Ver no mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/4/4b/Jardim_P%C3%BAblico_Albufeira_25_March_2015_%281%29.JPG)'></div><div class='place-body'><p class='place-name'>🏘️ Centro Histórico</p><p class='place-desc'>Ruas de calçada, casas caiadas e praças animadas. Imperdível ao pôr do sol com vistas para o mar.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Centro+Historico+Albufeira' target='_blank' rel='noreferrer'>Ver no mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/a/a3/Marina_de_Albufeira_-_Portugal_%2853496631781%29.jpg)'></div><div class='place-body'><p class='place-name'>⛵ Marina de Albufeira</p><p class='place-desc'>Zona moderna com restaurantes, bares e ponto de partida das excursões de barco. A cerca de 3 km.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Marina+de+Albufeira' target='_blank' rel='noreferrer'>Ver no mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Falesia_Beach_seen_from_sea.JPG/330px-Falesia_Beach_seen_from_sea.JPG)'></div><div class='place-body'><p class='place-name'>🌅 Praia da Falésia</p><p class='place-desc'>Falésias cor-de-laranja deslumbrantes com 5 km de extensão. Uma das praias mais espetaculares do Algarve, a 10 km.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Praia+da+Falesia+Albufeira' target='_blank' rel='noreferrer'>Ver no mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/a/ac/A_Catedral_de_Benagil.JPG)'></div><div class='place-body'><p class='place-name'>🪨 Grutas de Benagil</p><p class='place-desc'>Uma das grutas marinhas mais fotogénicas do mundo, com abertura natural no teto. Acesso de barco pela Marina.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Grutas+de+Benagil+Lagoa' target='_blank' rel='noreferrer'>Ver no mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/Castelo_de_Silves_-_Algarve%2C_Portugal_-_11.03.2023.jpg/330px-Castelo_de_Silves_-_Algarve%2C_Portugal_-_11.03.2023.jpg)'></div><div class='place-body'><p class='place-name'>🏰 Castelo de Silves</p><p class='place-desc'>Castelo árabe majestoso do período islâmico, a 30 km. Uma das vilas históricas mais bonitas do Algarve.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Castelo+de+Silves' target='_blank' rel='noreferrer'>Ver no mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/c/c3/Zoomarine_Algarve_15.JPG)'></div><div class='place-body'><p class='place-name'>🐬 Zoomarine</p><p class='place-desc'>Parque temático com shows de golfinhos, atrações aquáticas e espetáculos para toda a família. A 5 km.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Zoomarine+Albufeira' target='_blank' rel='noreferrer'>Ver no mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/2/29/Slide_%26_Splash_Algarve.jpg)'></div><div class='place-body'><p class='place-name'>🎢 Slide &amp; Splash</p><p class='place-desc'>Um dos melhores parques aquáticos da Europa, com escorregas para todas as idades. A cerca de 25 km.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Slide+Splash+Lagoa+Algarve' target='_blank' rel='noreferrer'>Ver no mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/d/d0/119PT_13_November_2013_Praia_da_Gal%C3%A9.JPG)'></div><div class='place-body'><p class='place-name'>🏄 Praia da Galé</p><p class='place-desc'>Praia tranquila e familiar com águas cristalinas e arriba dourada. Ideal para descansar, a 8 km.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Praia+da+Gale+Albufeira' target='_blank' rel='noreferrer'>Ver no mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Cacela_Velha_Fortress2.jpg/330px-Cacela_Velha_Fortress2.jpg)'></div><div class='place-body'><p class='place-name'>🏰 Cacela Velha</p><p class='place-desc'>Vila medieval preservada com forte e igreja de 1583. Vistas sobre a Ria Formosa e praia quase deserta. A 50 km.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Cacela+Velha+Algarve' target='_blank' rel='noreferrer'>Ver no mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/e/e0/Olhao_Portugal_aerial_view.jpg)'></div><div class='place-body'><p class='place-name'>🏝️ Ilhas da Ria Formosa</p><p class='place-desc'>Parque Natural eleito 7ª Maravilha Natural de Portugal. Ilhas desertas, lagoas e piscinas naturais. Ferry de Faro/Olhão.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Parque+Natural+Ria+Formosa+Olhao' target='_blank' rel='noreferrer'>Ver no mapa</a></div></div></div>"

          activities: {
            title: "Atividades",
            subtitle: "11 experiências imperdíveis para turistas em Albufeira.",
            html: "<div class='place-grid'><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/b/b0/02-05-2017_Algar_de_Benagil_%281%29.JPG)'></div><div class='place-body'><p class='place-name'>🚤 Passeio de Barco às Grutas de Benagil</p><p class='place-desc'>A excursão mais popular do Algarve. Parte da Marina para as grutas marinhas, incluindo a icónica Gruta de Benagil com abertura natural no teto. Reserva com antecedência no verão.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Marina+Albufeira+boat+trips' target='_blank' rel='noreferrer'>Ver no mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/1/13/DuskyDolphin.jpg)'></div><div class='place-body'><p class='place-name'>🐬 Avistamento de Golfinhos</p><p class='place-desc'>Saídas diárias a partir da Marina para observar golfinhos em liberdade no Atlântico. Experiência única e emocionante para toda a família.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Marina+de+Albufeira' target='_blank' rel='noreferrer'>Ver no mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/8/89/Surfing_on_Praia_da_Arrifana.jpg)'></div><div class='place-body'><p class='place-name'>🏄 Surf, Bodyboard &amp; SUP</p><p class='place-desc'>O Algarve tem ótimas condições para surf e bodyboard. Escolas e equipamento nas praias. O Stand-Up Paddle é ideal para águas mais calmas e explorar as falésias.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=escola+surf+Albufeira' target='_blank' rel='noreferrer'>Ver no mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/e/e2/SHADES_OF_BLUE_%283522593783%29.jpg)'></div><div class='place-body'><p class='place-name'>🤿 Mergulho &amp; Snorkeling</p><p class='place-desc'>Descobre o fundo do mar algarvio: grutas submersas, recifes e fauna marinha rica. Centros de mergulho na Marina com aulas para iniciantes e mergulhos guiados.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=centro+mergulho+Albufeira' target='_blank' rel='noreferrer'>Ver no mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/e/ea/Fishing_boat_at_sunrise%2C_Luz_%2851881716321%29.jpg)'></div><div class='place-body'><p class='place-name'>🎣 Pesca Desportiva</p><p class='place-desc'>Saídas de pesca a partir da Marina, com guia e equipamento incluído. Pesca à linha, pesca de fundo e pesca desportiva ao largo da costa algarvia.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=pesca+desportiva+Marina+Albufeira' target='_blank' rel='noreferrer'>Ver no mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/4/4b/Jardim_P%C3%BAblico_Albufeira_25_March_2015_%281%29.JPG)'></div><div class='place-body'><p class='place-name'>🚶 Passeio pelo Centro Histórico</p><p class='place-desc'>Explora as ruas de calçada, miradouros com vistas para o mar e praças típicas da Albufeira histórica. Imperdível ao pôr do sol com a luz dourada a iluminar a cidade.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Centro+Historico+Albufeira' target='_blank' rel='noreferrer'>Ver no mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/3/3f/Jeep_Safari_Algarve_-_panoramio.jpg)'></div><div class='place-body'><p class='place-name'>🚙 Jeep Safari &amp; Buggy Tour</p><p class='place-desc'>Aventura off-road pelo interior algarvio: colinas, laranjais, aldeias tradicionais e paisagens deslumbrantes. Tours de meio-dia e dia completo saem de Albufeira.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Jeep+Safari+Albufeira' target='_blank' rel='noreferrer'>Ver no mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/6/6a/15-09-2017_Praia_dos_Pescadores%2C_Albufeira_%283%29.JPG)'></div><div class='place-body'><p class='place-name'>🏖️ Dias de Praia</p><p class='place-desc'>Com mais de 10 praias a menos de 15 km, há para todos os gostos: animadas (Praia da Oura) ou tranquilas e selvagens (Praia da Galé, Praia da Falésia).</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=praias+Albufeira' target='_blank' rel='noreferrer'>Ver no mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/a/ad/Miradouro_do_Vale_Suspenso_-_viewpoint_of_the_Suspension_Valley_%2852859674883%29.jpg)'></div><div class='place-body'><p class='place-name'>🚴 Ciclismo &amp; Caminhadas</p><p class='place-desc'>Trilhos ao longo da costa e pelo interior. Aluguer de bicicletas na cidade. A pé, o Percurso dos Sete Vales Suspensos (Lagoa) é um dos mais espetaculares do Algarve.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Percurso+Sete+Vales+Suspensos+Lagoa' target='_blank' rel='noreferrer'>Ver no mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/c/c2/Rua_C%C3%A2ndido_dos_Reis%2C_Albufeira.jpg)'></div><div class='place-body'><p class='place-name'>🍹 Zona Noturna — Praia da Oura</p><p class='place-desc'>Conhecida como &quot;The Strip&quot;, é a zona de animação noturna por excelência de Albufeira. Bares, pubs, clubes e restaurantes abertos até de madrugada. A cerca de 3 km.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=The+Strip+Praia+da+Oura+Albufeira' target='_blank' rel='noreferrer'>Ver no mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/a/a3/Marina_de_Albufeira_-_Portugal_%2853496631781%29.jpg)'></div><div class='place-body'><p class='place-name'>🌙 Zona Noturna — Praia dos Pescadores</p><p class='place-desc'>O centro histórico junto à Praia dos Pescadores tem animação noturna autêntica: esplanadas, terraços com vista para o mar e música ao vivo. A 5 minutos a pé.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Praia+dos+Pescadores+Albufeira' target='_blank' rel='noreferrer'>Ver no mapa</a></div></div></div>"

            html: "<div class='info-sections'><div class='info-item'><p class='info-item-title'><span class='icon'>🛒</span>Supermercados</p><p class='info-item-text'><strong>Lidl</strong> · aprox. 1 km · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Lidl+Albufeira+Rua+Baden+Powell' target='_blank' rel='noreferrer'>Ver no mapa</a><br><strong>Aldi</strong> · aprox. 1 km · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Aldi+Albufeira' target='_blank' rel='noreferrer'>Ver no mapa</a><br><strong>Continente</strong> · aprox. 1,1 km · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Continente+Albufeira' target='_blank' rel='noreferrer'>Ver no mapa</a><br><strong>Pingo Doce</strong> · aprox. 1,1 km · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Pingo+Doce+Albufeira' target='_blank' rel='noreferrer'>Ver no mapa</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏪</span>Mini-Mercados</p><p class='info-item-text'>Vários mini-mercados e lojas de conveniência espalhados pelo centro histórico, a 2–5 min a pé. <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=mini+mercado+centro+historico+Albufeira' target='_blank' rel='noreferrer'>Ver no mapa</a><br><strong>Mercado Municipal</strong> · produtos frescos, aberto de manhã · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Mercado+Municipal+Albufeira' target='_blank' rel='noreferrer'>Ver no mapa</a><br>Rede <strong>Amanhecer</strong> — horários alargados, incluindo fins de semana</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🎁</span>Souvenirs &amp; Artesanato</p><p class='info-item-text'><strong>Rua 5 de Outubro</strong> · rua principal de artesanato e souvenirs do Algarve · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Rua+5+de+Outubro+Albufeira' target='_blank' rel='noreferrer'>Ver no mapa</a><br><strong>Artesanato A Mó</strong> · artigos genuinamente portugueses: cortiça, azulejos, bordados · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Artesanato+A+Mo+Albufeira' target='_blank' rel='noreferrer'>Ver no mapa</a><br><strong>Largo Eng. Duarte Pacheco</strong> — praça central com lojas de recordações e artesanato local</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏬</span>Centros Comerciais</p><p class='info-item-text'><strong>Algarve Shopping</strong> · 8 km — Guia · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Algarve+Shopping+Guia+Portugal' target='_blank' rel='noreferrer'>Ver no mapa</a><br><strong>MAR Shopping Algarve</strong> · 31 km — Almancil · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=MAR+Shopping+Algarve+Almancil' target='_blank' rel='noreferrer'>Ver no mapa</a></p></div></div>"

      en: {
        back: "← Back",
        fallbackTitle: "Information",
        fallbackSubtitle: "Topic not found.",
        sections: {
          welcome: { title: "Welcome", subtitle: "White Sand Apartments overview.", html: "<div class='welcome-layout'><p class='welcome-block'>White Sand Apartments, totally refurbished, with a modern decoration, of type T1, T2 and T0, located in one of the most privileged areas of Albufeira, close to all services and just 300 m from the beach! With all the amenities that these offer we want to provide you with a great experience to make your stay as comfortable as possible and above all that you rest and enjoy a beautiful vacation!</p><div class='welcome-image-slot'><img src='./welcome-all.png' alt='White Sand apartment'></div></div>" },
          check: { title: "Check-in", subtitle: "Arrival details.", html: "<p class='line'><strong>Check-in:</strong> from 16:00</p><p class='line'>The keys will be placed in a small lockbox at the building entrance, and you will receive the access code on your arrival day.</p><div class='checkin-gallery'><img src='./checkin-2.jpg' alt='Building entrance'><img src='./checkin-3.jpg' alt='Building location'><img src='./checkin-1.jpg' alt='Key lockbox'></div>" },
          location: { title: "Location", subtitle: "Address and map.", html: "<p class='line'><strong>Address:</strong> Rua do MFA, n.15 Apto (Your Apartment Letter), 8200-157 Albufeira</p><p class='line'><strong>Coordinates:</strong> 37.0891053, -8.2507170</p><p class='line'><a class='link' target='_blank' rel='noreferrer' href='https://goo.gl/maps/sj565hq985biABaD6'>Open in Google Maps</a></p><div class='extra-location'><p class='extra-location-text'>The apartments are located in the historic center of Albufeira, just a few minutes on foot from Praia dos Pescadores and other beaches. The location is excellent, with restaurants, bars, supermarkets, and shops all around, making it easy to do everything on foot. A few meters away you will also find the Old Town Square, typical Algarve streets, and viewpoints with incredible sea views. Ideal for those who want to enjoy the best of the city, combining beach and entertainment without needing a car.</p><div class='extra-location-images'><img src='./localizacao-1.jpg' alt='Beach in Albufeira'><img src='./localizacao-2.jpg' alt='Albufeira historic center'></div></div>" },
          info: { title: "Information", subtitle: "Important stay details.", html: "<div class='info-sections'><div class='info-item'><p class='info-item-title'><span class='icon'>🅿️</span>Parking</p><p class='info-item-text'>On our street and in the nearby area you can park for free (street parking). There is also a paid parking area 130 meters away. Parking location: <a class='link' target='_blank' rel='noreferrer' href='https://maps.app.goo.gl/gmK6iXghkyXu6mPLA'>Open location</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🧹</span>Cleaning service</p><p class='info-item-text'>We provide bed linen and bath towels for your stay. For longer stays, on the 8th day we provide a free linen change and a brief cleaning service.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🗑️</span>Waste bins</p><p class='info-item-text'>There are specific bins in a street below for you to dispose of your waste. Location: <a class='link' target='_blank' rel='noreferrer' href='https://maps.app.goo.gl/SYxqfTYpkznRy9Ky6'>Open location</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🧾</span>TMT</p><p class='info-item-text'>Municipal tourist tax in Albufeira (€2 per person/night up to a maximum of 7 nights), according to local regulations. If this tax is not included in your reservation total, payment will be required according to the information sent to you.</p></div></div>" },
          rules: { title: "House rules", subtitle: "Main rules for a peaceful stay.", html: "<div class='rules-grid'><div class='rule-card'><p class='rule-num'>01</p><p class='rule-title'>No smoking</p><p class='rule-text'>Please do not smoke or vape inside or around the apartment.</p></div><div class='rule-card'><p class='rule-num'>02</p><p class='rule-title'>No visitors</p><p class='rule-text'>No unregistered visitors. Please inform the host if you want to add extra guests to your booking.</p></div><div class='rule-card'><p class='rule-num'>03</p><p class='rule-title'>No pets</p><p class='rule-text'>Pets are not allowed on the property at any time.</p></div><div class='rule-card'><p class='rule-num'>04</p><p class='rule-title'>No parties</p><p class='rule-text'>Parties or events are not allowed.</p></div><div class='rule-card'><p class='rule-num'>05</p><p class='rule-title'>Damages</p><p class='rule-text'>Please report any damage or malfunction to the host immediately so we can repair or replace the affected item.</p></div><div class='rule-card'><p class='rule-num'>06</p><p class='rule-title'>Quiet hours</p><p class='rule-text'>For the comfort and enjoyment of both guests and neighbors, we kindly ask that noise levels be kept to a minimum during quiet hours.</p></div></div>" },
          amenities: { title: "Amenities", subtitle: "Apartment facilities available.", html: "<p class='amenities-intro'>The apartment is equipped with all the amenities you need for a comfortable stay.</p><ul class='list amenities-list'><li>Wi-Fi</li><li>Smart TV</li><li>Coffee Machine</li><li>Hair Dryer</li><li>Bed Linen</li><li>Bath Towels</li><li>Shampoo and Shower Gel</li><li>Tableware and Kitchen Utensils</li><li>Air Conditioning</li><li>Washing Machine</li></ul>" },
          wifi: { title: "Wi-Fi", subtitle: "Internet access details.", html: "<p class='wifi-note'>Network credentials are hidden until apartment-based access is activated.</p><div class='wifi-list'><div class='wifi-item'><p class='wifi-apt'>Apartment B</p><p class='wifi-meta'><strong>Network:</strong> Hidden</p><p class='wifi-meta'><strong>Password:</strong> Hidden</p><span class='wifi-lock'>🔒 Locked</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment C</p><p class='wifi-meta'><strong>Network:</strong> Hidden</p><p class='wifi-meta'><strong>Password:</strong> Hidden</p><span class='wifi-lock'>🔒 Locked</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment D</p><p class='wifi-meta'><strong>Network:</strong> Hidden</p><p class='wifi-meta'><strong>Password:</strong> Hidden</p><span class='wifi-lock'>🔒 Locked</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment E</p><p class='wifi-meta'><strong>Network:</strong> Hidden</p><p class='wifi-meta'><strong>Password:</strong> Hidden</p><span class='wifi-lock'>🔒 Locked</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment F</p><p class='wifi-meta'><strong>Network:</strong> Hidden</p><p class='wifi-meta'><strong>Password:</strong> Hidden</p><span class='wifi-lock'>🔒 Locked</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment G</p><p class='wifi-meta'><strong>Network:</strong> Hidden</p><p class='wifi-meta'><strong>Password:</strong> Hidden</p><span class='wifi-lock'>🔒 Locked</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment H</p><p class='wifi-meta'><strong>Network:</strong> Hidden</p><p class='wifi-meta'><strong>Password:</strong> Hidden</p><span class='wifi-lock'>🔒 Locked</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment I</p><p class='wifi-meta'><strong>Network:</strong> Hidden</p><p class='wifi-meta'><strong>Password:</strong> Hidden</p><span class='wifi-lock'>🔒 Locked</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment J</p><p class='wifi-meta'><strong>Network:</strong> Hidden</p><p class='wifi-meta'><strong>Password:</strong> Hidden</p><span class='wifi-lock'>🔒 Locked</span></div></div>" },
          safety: { title: "Safety", subtitle: "Emergency and useful contacts.", html: "<div class='safety-grid'><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Emergency</p><p class='safety-detail'>112</p><p class='safety-note'>Available 24 hours a day, every day.<br>112 is the single European emergency telephone number, available throughout the European Union.<br>Calls are free.</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Health line</p><p class='safety-detail'>808 24 24 24</p><p class='safety-note'>Available 24 hours a day, every day.<br>112 is the single European emergency telephone number, available throughout the European Union.<br>Calls are free.</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Lusíadas Hospital Albufeira</p><p class='safety-detail'>289 892 040</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Fire brigade</p><p class='safety-detail'>289 586 333</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Police</p><p class='safety-detail'>289 590 790</p></div></div>" },
          transport: { title: "Transport", subtitle: "How to arrive and move around." },
          visit: { title: "Places to Visit", subtitle: "11 must-see attractions in Albufeira.", html: "<div class='place-grid'><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/6/6a/15-09-2017_Praia_dos_Pescadores%2C_Albufeira_%283%29.JPG)'></div><div class='place-body'><p class='place-name'>🏖️ Praia dos Pescadores</p><p class='place-desc'>Albufeira's most iconic beach, just a 5-min walk. Calm waters nestled below the cliffs and the historic centre.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Praia+dos+Pescadores+Albufeira' target='_blank' rel='noreferrer'>View on map</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/4/4b/Jardim_P%C3%BAblico_Albufeira_25_March_2015_%281%29.JPG)'></div><div class='place-body'><p class='place-name'>🏘️ Albufeira Old Town</p><p class='place-desc'>Cobblestone streets, whitewashed houses and lively squares. A must at sunset, with sea views all around.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Centro+Historico+Albufeira' target='_blank' rel='noreferrer'>View on map</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/a/a3/Marina_de_Albufeira_-_Portugal_%2853496631781%29.jpg)'></div><div class='place-body'><p class='place-name'>⛵ Albufeira Marina</p><p class='place-desc'>Modern waterfront with restaurants, bars and the departure point for boat tours. About 3 km away.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Marina+de+Albufeira' target='_blank' rel='noreferrer'>View on map</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Falesia_Beach_seen_from_sea.JPG/330px-Falesia_Beach_seen_from_sea.JPG)'></div><div class='place-body'><p class='place-name'>🌅 Praia da Falésia</p><p class='place-desc'>Stunning orange cliffs stretching over 5 km. One of the Algarve's most spectacular beaches, 10 km away.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Praia+da+Falesia+Albufeira' target='_blank' rel='noreferrer'>View on map</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/a/ac/A_Catedral_de_Benagil.JPG)'></div><div class='place-body'><p class='place-name'>🪨 Benagil Caves</p><p class='place-desc'>One of the world's most photogenic sea caves, with a natural skylight. Accessible by boat from the Marina.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Grutas+de+Benagil+Lagoa' target='_blank' rel='noreferrer'>View on map</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/Castelo_de_Silves_-_Algarve%2C_Portugal_-_11.03.2023.jpg/330px-Castelo_de_Silves_-_Algarve%2C_Portugal_-_11.03.2023.jpg)'></div><div class='place-body'><p class='place-name'>🏰 Silves Castle</p><p class='place-desc'>A majestic Moorish castle from the Islamic era, about 30 km away. One of the Algarve's most beautiful historic towns.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Castelo+de+Silves' target='_blank' rel='noreferrer'>View on map</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/c/c3/Zoomarine_Algarve_15.JPG)'></div><div class='place-body'><p class='place-name'>🐬 Zoomarine</p><p class='place-desc'>Theme park with dolphin shows, water rides and entertainment for the whole family. Just 5 km away.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Zoomarine+Albufeira' target='_blank' rel='noreferrer'>View on map</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/2/29/Slide_%26_Splash_Algarve.jpg)'></div><div class='place-body'><p class='place-name'>🎢 Slide &amp; Splash</p><p class='place-desc'>One of Europe's best water parks, with slides for all ages. About 25 km away — perfect for a family day out.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Slide+Splash+Lagoa+Algarve' target='_blank' rel='noreferrer'>View on map</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/d/d0/119PT_13_November_2013_Praia_da_Gal%C3%A9.JPG)'></div><div class='place-body'><p class='place-name'>🏄 Praia da Galé</p><p class='place-desc'>A quiet, family-friendly beach with crystal-clear waters and golden cliffs. About 8 km, ideal for a relaxed day.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Praia+da+Gale+Albufeira' target='_blank' rel='noreferrer'>View on map</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Cacela_Velha_Fortress2.jpg/330px-Cacela_Velha_Fortress2.jpg)'></div><div class='place-body'><p class='place-name'>🏰 Cacela Velha</p><p class='place-desc'>A preserved medieval village with an 18th-century fort and 1583 church. Stunning views over the Ria Formosa. 50 km away.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Cacela+Velha+Algarve' target='_blank' rel='noreferrer'>View on map</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/e/e0/Olhao_Portugal_aerial_view.jpg)'></div><div class='place-body'><p class='place-name'>🏝️ Ria Formosa Islands</p><p class='place-desc'>Natural Park voted one of Portugal's 7 Natural Wonders. Deserted beaches, lagoons and natural pools. Ferry from Faro/Olhão.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Parque+Natural+Ria+Formosa+Olhao' target='_blank' rel='noreferrer'>View on map</a></div></div></div>" },
          activities: { title: "Activities", subtitle: "11 must-do experiences for tourists in Albufeira.", html: "<div class='place-grid'><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/b/b0/02-05-2017_Algar_de_Benagil_%281%29.JPG)'></div><div class='place-body'><p class='place-name'>🚤 Boat Trip to Benagil Caves</p><p class='place-desc'>The most popular excursion in the Algarve. Departs from Albufeira Marina to the iconic Benagil Cave with its natural skylight. Book in advance in summer.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Marina+Albufeira+boat+trips' target='_blank' rel='noreferrer'>View on map</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/1/13/DuskyDolphin.jpg)'></div><div class='place-body'><p class='place-name'>🐬 Dolphin Watching</p><p class='place-desc'>Daily tours from Albufeira Marina to spot wild dolphins and marine wildlife in the Atlantic. A unique and exciting experience for the whole family.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Marina+de+Albufeira' target='_blank' rel='noreferrer'>View on map</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/8/89/Surfing_on_Praia_da_Arrifana.jpg)'></div><div class='place-body'><p class='place-name'>🏄 Surf, Bodyboard &amp; SUP</p><p class='place-desc'>The Algarve offers great conditions for surfing and bodyboarding. Schools and equipment hire on the beaches. SUP is perfect for calmer waters and cliff exploration.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=surf+school+Albufeira' target='_blank' rel='noreferrer'>View on map</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/e/e2/SHADES_OF_BLUE_%283522593783%29.jpg)'></div><div class='place-body'><p class='place-name'>🤿 Scuba Diving &amp; Snorkeling</p><p class='place-desc'>Discover the Algarve underwater world: sea caves, reefs and rich marine life. Dive centres at the Marina offer beginner lessons and guided dives.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=diving+centre+Albufeira' target='_blank' rel='noreferrer'>View on map</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/e/ea/Fishing_boat_at_sunrise%2C_Luz_%2851881716321%29.jpg)'></div><div class='place-body'><p class='place-name'>🎣 Sport Fishing</p><p class='place-desc'>Fishing trips from Albufeira Marina with guide and equipment included. Line fishing, bottom fishing and deep-sea sport fishing along the Algarve coast.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=sport+fishing+Marina+Albufeira' target='_blank' rel='noreferrer'>View on map</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/4/4b/Jardim_P%C3%BAblico_Albufeira_25_March_2015_%281%29.JPG)'></div><div class='place-body'><p class='place-name'>🚶 Old Town Walk</p><p class='place-desc'>Explore the cobblestone streets, sea-view viewpoints and typical squares of historic Albufeira. A must at sunset when golden light illuminates the whole city.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Old+Town+Albufeira' target='_blank' rel='noreferrer'>View on map</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/3/3f/Jeep_Safari_Algarve_-_panoramio.jpg)'></div><div class='place-body'><p class='place-name'>🚙 Jeep Safari &amp; Buggy Tour</p><p class='place-desc'>Off-road adventure through the Algarve countryside: hills, orange groves, traditional villages and stunning landscapes. Half-day and full-day tours depart from Albufeira.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Jeep+Safari+Albufeira' target='_blank' rel='noreferrer'>View on map</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/6/6a/15-09-2017_Praia_dos_Pescadores%2C_Albufeira_%283%29.JPG)'></div><div class='place-body'><p class='place-name'>🏖️ Beach Days</p><p class='place-desc'>With over 10 beaches within 15 km, there is something for everyone: lively with bars and activities (Praia da Oura) or quiet and wild (Praia da Galé, Praia da Falésia).</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=beaches+Albufeira' target='_blank' rel='noreferrer'>View on map</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/a/ad/Miradouro_do_Vale_Suspenso_-_viewpoint_of_the_Suspension_Valley_%2852859674883%29.jpg)'></div><div class='place-body'><p class='place-name'>🚴 Cycling &amp; Hiking</p><p class='place-desc'>Coastal and inland trails throughout the area. Bike hire available in town. On foot, the Seven Hanging Valleys Trail (Lagoa) is one of the most spectacular walks in the Algarve.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Seven+Hanging+Valleys+Trail+Lagoa' target='_blank' rel='noreferrer'>View on map</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/c/c2/Rua_C%C3%A2ndido_dos_Reis%2C_Albufeira.jpg)'></div><div class='place-body'><p class='place-name'>🍹 Nightlife — Praia da Oura</p><p class='place-desc'>Known as &quot;The Strip&quot;, this is Albufeira's prime nightlife zone. Bars, pubs, clubs and restaurants open until the early hours. About 3 km from the apartment.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=The+Strip+Praia+da+Oura+Albufeira' target='_blank' rel='noreferrer'>View on map</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/a/a3/Marina_de_Albufeira_-_Portugal_%2853496631781%29.jpg)'></div><div class='place-body'><p class='place-name'>🌙 Nightlife — Praia dos Pescadores</p><p class='place-desc'>The historic centre near Praia dos Pescadores offers more authentic nightlife: terrace bars with sea views and live music. A 5-minute walk from the apartment.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Praia+dos+Pescadores+Albufeira' target='_blank' rel='noreferrer'>View on map</a></div></div></div>" },

n>Snails</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://www.google.com/maps/search/?api=1&query=Cepa+Velha+Albufeira' target='_blank' rel='noreferrer'>Cepa Velha</a><span class='rest-price mid'>€€</span></div><span class='rest-cuisine'>🍽️ Traditional Portuguese kitchen</span><p class='rest-addr'>📍 R. Vasco da Gama, Albufeira · <a class='link' href='https://www.google.com/maps/search/?api=1&query=Cepa+Velha+Albufeira' target='_blank' rel='noreferrer'>View on map</a></p><p class='rest-menu-label'>Menu</p><div class='rest-tags'><span>Cataplana</span><span>Bacalhau</span><span>Grilled fish &amp; meat</span><span>Sangria</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://maps.app.goo.gl/uXt8f8Lu8vPBQv7c6' target='_blank' rel='noreferrer'>Clay Oven</a><span class='rest-price mid'>€€</span></div><span class='rest-cuisine'>🍛 Indian cuisine</span><p class='rest-addr'>📍 Albufeira · <a class='link' href='https://maps.app.goo.gl/uXt8f8Lu8vPBQv7c6' target='_blank' rel='noreferrer'>View on map</a></p><p class='rest-menu-label'>Menu</p><div class='rest-tags'><span>Tikka Masala</span><span>Biryani</span><span>Naan</span><span>Curries</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://www.google.com/maps/search/?api=1&query=O+Lusitano+Albufeira' target='_blank' rel='noreferrer'>O Lusitano</a><span class='rest-price hi'>€€€</span></div><span class='rest-cuisine'>🍴 Modern Portuguese kitchen</span><p class='rest-addr'>📍 Urb. Quinta da Correeira, Albufeira · <a class='link' href='https://www.google.com/maps/search/?api=1&query=O+Lusitano+Albufeira' target='_blank' rel='noreferrer'>View on map</a></p><p class='rest-menu-label'>Menu</p><div class='rest-tags'><span>Monkfish cataplana</span><span>Duck magret</span><span>Portuguese steak</span><span>Bacalhau</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://maps.app.goo.gl/5GTwm6RyKvPDEC338' target='_blank' rel='noreferrer'>Taberna do Pescador</a><span class='rest-price hi'>€€€</span></div><span class='rest-cuisine'>🦞 Seafood &amp; Fresh fish</span><p class='rest-addr'>📍 Albufeira Old Town · <a class='link' href='https://maps.app.goo.gl/5GTwm6RyKvPDEC338' target='_blank' rel='noreferrer'>View on map</a></p><p class='rest-menu-label'>Menu</p><div class='rest-tags'><span>Clams</span><span>Goose barnacles</span><span>Cataplana</span><span>Fish of the day</span></div></div></div>" },
          bars: { title: "Bars & Clubs", subtitle: "Nightlife suggestions.", html: "<ul class='list'><li>Explore Oura and Old Town nightlife areas.</li><li>Ask us for updated bars and clubs recommendations.</li></ul>" },
          shopping: { title: "Shopping", subtitle: "Supermarkets and malls.", html: "<div class='info-sections'><div class='info-item'><p class='info-item-title'><span class='icon'>🛒</span>Supermarkets</p><p class='info-item-text'><strong>Lidl</strong> · approx. 1 km · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Lidl+Albufeira+Rua+Baden+Powell' target='_blank' rel='noreferrer'>View on map</a><br><strong>Aldi</strong> · approx. 1 km · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Aldi+Albufeira' target='_blank' rel='noreferrer'>View on map</a><br><strong>Continente</strong> · approx. 1.1 km · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Continente+Albufeira' target='_blank' rel='noreferrer'>View on map</a><br><strong>Pingo Doce</strong> · approx. 1.1 km · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Pingo+Doce+Albufeira' target='_blank' rel='noreferrer'>View on map</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏪</span>Mini-Markets</p><p class='info-item-text'>Several mini-markets and convenience stores throughout the historic centre, 2–5 min walk. <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=mini+mercado+centro+historico+Albufeira' target='_blank' rel='noreferrer'>View on map</a><br><strong>Municipal Market</strong> · fresh produce, open in the mornings · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Mercado+Municipal+Albufeira' target='_blank' rel='noreferrer'>View on map</a><br><strong>Amanhecer</strong> stores — extended opening hours including weekends</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🎁</span>Souvenirs &amp; Crafts</p><p class='info-item-text'><strong>Rua 5 de Outubro</strong> · main street for Algarve crafts and souvenirs · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Rua+5+de+Outubro+Albufeira' target='_blank' rel='noreferrer'>View on map</a><br><strong>Artesanato A Mó</strong> · genuine Portuguese items: cork, tiles, embroidery · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Artesanato+A+Mo+Albufeira' target='_blank' rel='noreferrer'>View on map</a><br><strong>Largo Eng. Duarte Pacheco</strong> — central square lined with souvenir and craft shops</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏬</span>Shopping Centres</p><p class='info-item-text'><strong>Algarve Shopping</strong> · 8 km — Guia · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Algarve+Shopping+Guia+Portugal' target='_blank' rel='noreferrer'>View on map</a><br><strong>MAR Shopping Algarve</strong> · 31 km — Almancil · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=MAR+Shopping+Algarve+Almancil' target='_blank' rel='noreferrer'>View on map</a></p></div></div>" },
