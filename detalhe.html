        sections: {
          welcome: { title: "Bienvenue", subtitle: "Resume de l'hebergement.", html: "<div class='welcome-layout'><p class='welcome-block'>Appartements White Sand, totalement rénovés, avec une décoration moderne, de type T1, T2 et T0, situés dans l'un des quartiers les plus privilégiés d'Albufeira, à proximité de tous les services et à seulement 300 m de la plage! Avec toutes les commodités que celles-ci offrent, nous voulons vous offrir une expérience formidable pour rendre votre séjour aussi confortable que possible et surtout que vous vous reposiez et passiez de belles vacances!</p><div class='welcome-image-slot'><img src='./welcome-all.png' alt='Appartement White Sand'></div></div>" },
          check: { title: "Check-in", subtitle: "Details d'arrivee.", html: "<p class='line'><strong>Check-in:</strong> a partir de 16:00</p><p class='line'>Les cles seront placees dans un petit coffre a l'entree de l'immeuble, et vous recevrez le code d'acces le jour de votre arrivee.</p><div class='checkin-gallery'><img src='./checkin-2.jpg' alt='Entree du batiment'><img src='./checkin-3.jpg' alt='Localisation de l entree'><img src='./checkin-1.jpg' alt='Boite a cles'></div>" },
          location: { title: "Localisation", subtitle: "Adresse et carte.", html: "<p class='line'><strong>Adresse:</strong> Rua do MFA, n.15 Apto (Lettre de votre appartement), 8200-157 Albufeira</p><p class='line'><strong>Coordonnees:</strong> 37.0891053, -8.2507170</p><p class='line'><a class='link' target='_blank' rel='noreferrer' href='https://goo.gl/maps/sj565hq985biABaD6'>Ouvrir sur Google Maps</a></p><div class='extra-location'><p class='extra-location-text'>Les appartements sont situes dans le centre historique d'Albufeira, a quelques minutes a pied de Praia dos Pescadores et d'autres plages. L'emplacement est excellent, avec des restaurants, bars, supermarches et boutiques tout autour, ce qui permet de tout faire a pied. A quelques metres, vous trouverez aussi la place de la vieille ville, des rues typiques de l'Algarve et des points de vue incroyables sur la mer. Ideal pour ceux qui veulent profiter du meilleur de la ville, entre plage et animation, sans avoir besoin de voiture.</p><div class='extra-location-images'><img src='./localizacao-1.jpg' alt='Plage a Albufeira'><img src='./localizacao-2.jpg' alt='Centre historique d Albufeira'></div></div>" },
          info: { title: "Information", subtitle: "Informations importantes du sejour.", html: "<div class='info-sections'><div class='info-item'><p class='info-item-title'><span class='icon'>🅿️</span>Parking</p><p class='info-item-text'>Dans notre rue et aux alentours, vous pouvez vous garer gratuitement (stationnement dans la rue). Il existe aussi un parking payant a 130 metres. Localisation du parking: <a class='link' target='_blank' rel='noreferrer' href='https://maps.app.goo.gl/gmK6iXghkyXu6mPLA'>Ouvrir la localisation</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🧹</span>Service de nettoyage</p><p class='info-item-text'>Nous fournissons les draps et les serviettes de bain pour votre sejour. Pour les sejours plus longs, au 8e jour nous offrons gratuitement un changement de linge et un bref nettoyage.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🗑️</span>Dechets - conteneurs</p><p class='info-item-text'>Dans une rue en dessous, vous trouverez des conteneurs specifiques pour deposer vos dechets. Localisation: <a class='link' target='_blank' rel='noreferrer' href='https://maps.app.goo.gl/SYxqfTYpkznRy9Ky6'>Ouvrir la localisation</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🧾</span>TMT</p><p class='info-item-text'>Taxe touristique municipale d'Albufeira (2€ par personne/nuit jusqu'a un maximum de 7 nuits), conformement au reglement local. Si cette taxe n'est pas incluse dans le montant total de votre reservation, le paiement devra etre effectue selon les informations qui vous seront envoyees.</p></div></div>" },
          rules: { title: "Regles de la maison", subtitle: "Regles principales pour un sejour paisible.", html: "<div class='rules-grid'><div class='rule-card'><p class='rule-num'>01</p><p class='rule-title'>Interdit de fumer</p><p class='rule-text'>Merci de ne pas fumer ni vapoter a l'interieur ou autour de l'appartement.</p></div><div class='rule-card'><p class='rule-num'>02</p><p class='rule-title'>Sans visites</p><p class='rule-text'>Aucun visiteur non enregistre. Informez l'hote si vous souhaitez ajouter des invites a la reservation.</p></div><div class='rule-card'><p class='rule-num'>03</p><p class='rule-title'>Sans animaux</p><p class='rule-text'>Les animaux de compagnie ne sont pas autorises dans la propriete.</p></div><div class='rule-card'><p class='rule-num'>04</p><p class='rule-title'>Sans fetes</p><p class='rule-text'>Les fetes ou evenements ne sont pas autorises.</p></div><div class='rule-card'><p class='rule-num'>05</p><p class='rule-title'>Dommages</p><p class='rule-text'>Veuillez signaler immediatement tout dommage ou dysfonctionnement a l'hote afin que nous puissions reparer ou remplacer l'article endommage.</p></div><div class='rule-card'><p class='rule-num'>06</p><p class='rule-title'>Heures de silence</p><p class='rule-text'>Pour le confort et le bien-etre des hotes et des voisins, nous vous demandons de reduire le bruit au minimum pendant les heures de silence.</p></div></div>" },
          amenities: { title: "Commodites", subtitle: "Equipements disponibles.", html: "<p class='amenities-intro'>L'appartement est equipe de toutes les commodites necessaires pour un sejour confortable.</p><ul class='list amenities-list'><li>Wi-Fi</li><li>Television intelligente (Smart TV)</li><li>Machine a cafe</li><li>Seche-cheveux</li><li>Linge de lit</li><li>Serviettes de bain</li><li>Shampooing et gel douche</li><li>Vaisselle et ustensiles de cuisine</li><li>Climatisation</li><li>Machine a laver</li></ul>" },
          wifi: { title: "Wi-Fi", subtitle: "Acces internet.", html: "<p class='wifi-note'>Les identifiants reseau sont masques jusqu'a l'activation de l'acces par appartement.</p><div class='wifi-list'><div class='wifi-item'><p class='wifi-apt'>Appartement B</p><p class='wifi-meta'><strong>Reseau:</strong> Masque</p><p class='wifi-meta'><strong>Mot de passe:</strong> Masque</p><span class='wifi-lock'>🔒 Verrouille</span></div><div class='wifi-item'><p class='wifi-apt'>Appartement C</p><p class='wifi-meta'><strong>Reseau:</strong> Masque</p><p class='wifi-meta'><strong>Mot de passe:</strong> Masque</p><span class='wifi-lock'>🔒 Verrouille</span></div><div class='wifi-item'><p class='wifi-apt'>Appartement D</p><p class='wifi-meta'><strong>Reseau:</strong> Masque</p><p class='wifi-meta'><strong>Mot de passe:</strong> Masque</p><span class='wifi-lock'>🔒 Verrouille</span></div><div class='wifi-item'><p class='wifi-apt'>Appartement E</p><p class='wifi-meta'><strong>Reseau:</strong> Masque</p><p class='wifi-meta'><strong>Mot de passe:</strong> Masque</p><span class='wifi-lock'>🔒 Verrouille</span></div><div class='wifi-item'><p class='wifi-apt'>Appartement F</p><p class='wifi-meta'><strong>Reseau:</strong> Masque</p><p class='wifi-meta'><strong>Mot de passe:</strong> Masque</p><span class='wifi-lock'>🔒 Verrouille</span></div><div class='wifi-item'><p class='wifi-apt'>Appartement G</p><p class='wifi-meta'><strong>Reseau:</strong> Masque</p><p class='wifi-meta'><strong>Mot de passe:</strong> Masque</p><span class='wifi-lock'>🔒 Verrouille</span></div><div class='wifi-item'><p class='wifi-apt'>Appartement H</p><p class='wifi-meta'><strong>Reseau:</strong> Masque</p><p class='wifi-meta'><strong>Mot de passe:</strong> Masque</p><span class='wifi-lock'>🔒 Verrouille</span></div><div class='wifi-item'><p class='wifi-apt'>Appartement I</p><p class='wifi-meta'><strong>Reseau:</strong> Masque</p><p class='wifi-meta'><strong>Mot de passe:</strong> Masque</p><span class='wifi-lock'>🔒 Verrouille</span></div><div class='wifi-item'><p class='wifi-apt'>Appartement J</p><p class='wifi-meta'><strong>Reseau:</strong> Masque</p><p class='wifi-meta'><strong>Mot de passe:</strong> Masque</p><span class='wifi-lock'>🔒 Verrouille</span></div></div>" },
          safety: { title: "Securite", subtitle: "Urgences et contacts utiles.", html: "<div class='safety-grid'><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Urgence</p><p class='safety-detail'>112</p><p class='safety-note'>Disponible 24h/24, tous les jours.<br>Le 112 est le numéro d'urgence européen unique, disponible dans toute l'Union européenne.<br>Les appels sont gratuits.</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Ligne sante</p><p class='safety-detail'>808 24 24 24</p><p class='safety-note'>Disponible 24h/24, tous les jours.<br>Le 112 est le numéro d'urgence européen unique, disponible dans toute l'Union européenne.<br>Les appels sont gratuits.</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Hopital Lusíadas Albufeira</p><p class='safety-detail'>289 892 040</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Pompiers</p><p class='safety-detail'>289 586 333</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Police</p><p class='safety-detail'>289 590 790</p></div></div>" },
          transport: { title: "Transports", subtitle: "Comment arriver et se deplacer." },
          visit: { title: "Lieux à visiter", subtitle: "11 incontournables a Albufeira.", html: "<div class='place-grid'><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/6/6a/15-09-2017_Praia_dos_Pescadores%2C_Albufeira_%283%29.JPG)'></div><div class='place-body'><p class='place-name'>🏖️ Praia dos Pescadores</p><p class='place-desc'>La plage la plus emblematique d'Albufeira, a 5 min a pied. Eaux calmes sous les falaises et le centre historique.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Praia+dos+Pescadores+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/4/4b/Jardim_P%C3%BAblico_Albufeira_25_March_2015_%281%29.JPG)'></div><div class='place-body'><p class='place-name'>🏘️ Vieille ville d'Albufeira</p><p class='place-desc'>Ruelles pavees, maisons blanches et places animees. A decouvrir au coucher du soleil, avec vue sur la mer.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Centro+Historico+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/a/a3/Marina_de_Albufeira_-_Portugal_%2853496631781%29.jpg)'></div><div class='place-body'><p class='place-name'>⛵ Marina d'Albufeira</p><p class='place-desc'>Zone moderne avec restaurants, bars et point de depart des excursions en bateau. A environ 3 km.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Marina+de+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Falesia_Beach_seen_from_sea.JPG/330px-Falesia_Beach_seen_from_sea.JPG)'></div><div class='place-body'><p class='place-name'>🌅 Praia da Falésia</p><p class='place-desc'>Falaises orangees spectaculaires sur 5 km. L'une des plus belles plages de l'Algarve, a environ 10 km.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Praia+da+Falesia+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/a/ac/A_Catedral_de_Benagil.JPG)'></div><div class='place-body'><p class='place-name'>🪨 Grottes de Benagil</p><p class='place-desc'>L'une des grottes marines les plus photographiees au monde, avec une ouverture naturelle. Acces en bateau depuis la Marina.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Grutas+de+Benagil+Lagoa' target='_blank' rel='noreferrer'>Voir sur la carte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/Castelo_de_Silves_-_Algarve%2C_Portugal_-_11.03.2023.jpg/330px-Castelo_de_Silves_-_Algarve%2C_Portugal_-_11.03.2023.jpg)'></div><div class='place-body'><p class='place-name'>🏰 Chateau de Silves</p><p class='place-desc'>Chateau maure majestueux de l'epoque islamique, a 30 km. L'une des plus belles villes historiques de l'Algarve.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Castelo+de+Silves' target='_blank' rel='noreferrer'>Voir sur la carte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/c/c3/Zoomarine_Algarve_15.JPG)'></div><div class='place-body'><p class='place-name'>🐬 Zoomarine</p><p class='place-desc'>Parc a theme avec spectacles de dauphins et attractions aquatiques pour toute la famille. A seulement 5 km.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Zoomarine+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/2/29/Slide_%26_Splash_Algarve.jpg)'></div><div class='place-body'><p class='place-name'>🎢 Slide &amp; Splash</p><p class='place-desc'>L'un des meilleurs parcs aquatiques d'Europe, avec des toboggans pour tous les ages. A environ 25 km.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Slide+Splash+Lagoa+Algarve' target='_blank' rel='noreferrer'>Voir sur la carte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/d/d0/119PT_13_November_2013_Praia_da_Gal%C3%A9.JPG)'></div><div class='place-body'><p class='place-name'>🏄 Praia da Galé</p><p class='place-desc'>Plage tranquille et familiale avec eaux cristallines et falaises dorees. Ideale pour se ressourcer, a 8 km.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Praia+da+Gale+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Cacela_Velha_Fortress2.jpg/330px-Cacela_Velha_Fortress2.jpg)'></div><div class='place-body'><p class='place-name'>🏰 Cacela Velha</p><p class='place-desc'>Village medieval preserve avec un fort du XVIIIe siecle et une eglise de 1583. Vue imprenable sur la Ria Formosa. A 50 km.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Cacela+Velha+Algarve' target='_blank' rel='noreferrer'>Voir sur la carte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/e/e0/Olhao_Portugal_aerial_view.jpg)'></div><div class='place-body'><p class='place-name'>🏝️ Iles de la Ria Formosa</p><p class='place-desc'>Parc naturel elu 7e merveille naturelle du Portugal. Plages desertes, lagunes et piscines naturelles. Ferry depuis Faro/Olhao.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Parque+Natural+Ria+Formosa+Olhao' target='_blank' rel='noreferrer'>Voir sur la carte</a></div></div></div>" },
          activities: { title: "Activites", subtitle: "11 experiences incontournables a Albufeira.", html: "<div class='place-grid'><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/b/b0/02-05-2017_Algar_de_Benagil_%281%29.JPG)'></div><div class='place-body'><p class='place-name'>🚤 Excursion en Bateau aux Grottes de Benagil</p><p class='place-desc'>L'excursion la plus populaire de l'Algarve. Départ de la Marina vers les célèbres grottes marines, dont l'iconique Grotte de Benagil. Réservez à l'avance en été.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Marina+Albufeira+bateau' target='_blank' rel='noreferrer'>Voir sur la carte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/1/13/DuskyDolphin.jpg)'></div><div class='place-body'><p class='place-name'>🐬 Observation des Dauphins</p><p class='place-desc'>Sorties quotidiennes depuis la Marina pour observer les dauphins en liberté dans l'Atlantique. Une expérience unique et émouvante pour toute la famille.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Marina+de+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/8/89/Surfing_on_Praia_da_Arrifana.jpg)'></div><div class='place-body'><p class='place-name'>🏄 Surf, Bodyboard &amp; SUP</p><p class='place-desc'>L'Algarve offre d'excellentes conditions pour le surf. Écoles et location de matériel sur les plages. Le Stand-Up Paddle est idéal pour les eaux calmes.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=ecole+surf+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/e/e2/SHADES_OF_BLUE_%283522593783%29.jpg)'></div><div class='place-body'><p class='place-name'>🤿 Plongée &amp; Snorkeling</p><p class='place-desc'>Découvrez les fonds marins de l'Algarve: grottes sous-marines, récifs et faune marine. Centres de plongée à la Marina avec cours débutants et plongées guidées.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=centre+plongee+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/e/ea/Fishing_boat_at_sunrise%2C_Luz_%2851881716321%29.jpg)'></div><div class='place-body'><p class='place-name'>🎣 Pêche Sportive</p><p class='place-desc'>Sorties de pêche depuis la Marina avec guide et équipement inclus. Pêche à la ligne et pêche sportive en haute mer le long de la côte de l'Algarve.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=peche+sportive+Marina+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/4/4b/Jardim_P%C3%BAblico_Albufeira_25_March_2015_%281%29.JPG)'></div><div class='place-body'><p class='place-name'>🚶 Promenade dans la Vieille Ville</p><p class='place-desc'>Explorez les ruelles pavées, les belvédères avec vue sur mer et les places typiques d'Albufeira. À ne pas manquer au coucher du soleil.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Vieille+Ville+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/3/3f/Jeep_Safari_Algarve_-_panoramio.jpg)'></div><div class='place-body'><p class='place-name'>🚙 Safari Jeep &amp; Tour en Buggy</p><p class='place-desc'>Aventure tout-terrain dans la campagne de l'Algarve: collines, orangeraies, villages traditionnels et paysages époustouflants. Départs quotidiens d'Albufeira.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Safari+Jeep+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/6/6a/15-09-2017_Praia_dos_Pescadores%2C_Albufeira_%283%29.JPG)'></div><div class='place-body'><p class='place-name'>🏖️ Journées à la Plage</p><p class='place-desc'>Avec plus de 10 plages à moins de 15 km, il y en a pour tous: animées (Praia da Oura) ou sauvages et tranquilles (Praia da Galé, Praia da Falésia).</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=plages+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/a/ad/Miradouro_do_Vale_Suspenso_-_viewpoint_of_the_Suspension_Valley_%2852859674883%29.jpg)'></div><div class='place-body'><p class='place-name'>🚴 Vélo &amp; Randonnée</p><p class='place-desc'>Sentiers côtiers et intérieurs dans toute la région. Location de vélos en ville. À pied, le Percurso dos Sete Vales Suspensos (Lagoa) est l'un des plus spectaculaires.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Sete+Vales+Suspensos+Lagoa' target='_blank' rel='noreferrer'>Voir sur la carte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/c/c2/Rua_C%C3%A2ndido_dos_Reis%2C_Albufeira.jpg)'></div><div class='place-body'><p class='place-name'>🍹 Vie Nocturne — Praia da Oura</p><p class='place-desc'>Connue sous le nom de &quot;The Strip&quot;, c'est la zone de divertissement nocturne par excellence d'Albufeira. Bars, pubs et clubs ouverts jusqu'au petit matin. À 3 km.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=The+Strip+Praia+da+Oura+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/a/a3/Marina_de_Albufeira_-_Portugal_%2853496631781%29.jpg)'></div><div class='place-body'><p class='place-name'>🌙 Vie Nocturne — Praia dos Pescadores</p><p class='place-desc'>Le centre historique près de Praia dos Pescadores propose une vie nocturne plus authentique: terrasses avec vue sur mer et musique live. À 5 minutes à pied.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Praia+dos+Pescadores+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a></div></div></div>" },
          eat: { title: "Manger & Boire", subtitle: "Restaurants triés du moins cher au plus cher.", html: "<div class='rest-list'><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://maps.app.goo.gl/rA4cq7F3agYmyYcy6' target='_blank' rel='noreferrer'>Franguinho de Albufeira</a><span class='rest-price eco'>€</span></div><span class='rest-cuisine'>🍗 Poulet grillé / À emporter</span><p class='rest-addr'>📍 Centre d'Albufeira · <a class='link' href='https://maps.app.goo.gl/rA4cq7F3agYmyYcy6' target='_blank' rel='noreferrer'>Voir sur la carte</a></p><p class='rest-menu-label'>Menu</p><div class='rest-tags'><span>Poulet rôti</span><span>Frites</span><span>Piri-piri</span><span>Salades</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://www.google.com/maps/search/?api=1&query=Copos+Petiscos+Albufeira' target='_blank' rel='noreferrer'>Copos &amp; Petiscos</a><span class='rest-price mid'>€€</span></div><span class='rest-cuisine'>🍷 Bar à vins &amp; petiscos</span><p class='rest-addr'>📍 R. Alexandre Herculano, Albufeira · <a class='link' href='https://www.google.com/maps/search/?api=1&query=Copos+Petiscos+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a></p><p class='rest-menu-label'>Menu</p><div class='rest-tags'><span>Petiscos</span><span>Plateau charcuterie</span><span>Fromages</span><span>Vins sélectionnés</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://maps.app.goo.gl/w9gtzSM2WV5ixY5YA' target='_blank' rel='noreferrer'>Tasca do Viegas</a><span class='rest-price mid'>€€</span></div><span class='rest-cuisine'>🫙 Taverne portugaise traditionnelle</span><p class='rest-addr'>📍 Vieille ville d'Albufeira · <a class='link' href='https://maps.app.goo.gl/w9gtzSM2WV5ixY5YA' target='_blank' rel='noreferrer'>Voir sur la carte</a></p><p class='rest-menu-label'>Menu</p><div class='rest-tags'><span>Petiscos</span><span>Sandwich au steak</span> div class='rest-header'><a class='rest-name' href='https://maps.app.goo.gl/5GTwm6RyKvPDEC338' target='_blank' rel='noreferrer'>Taberna do Pescador</a><span class='rest-price hi'>€€€</span></div><span class='rest-cuisine'>🦞 Fruits de mer &amp; Poisson frais</span><p class='rest-addr'>📍 Vieille ville d'Albufeira · <a class='link' href='https://maps.app.goo.gl/5GTwm6RyKvPDEC338' target='_blank' rel='noreferrer'>Voir sur la carte</a></p><p class='rest-menu-label'>Menu</p><div class='rest-tags'><span>Palourdes</span><span>Pousse-pieds</span><span>Cataplana</span><span>Poisson du jour</span></div></div></div>" },
          bars: { title: "Bars & Clubs", subtitle: "Suggestions de vie nocturne.", html: "<ul class='list'><li>Explorez Oura et la vieille ville la nuit.</li><li>Demandez-nous les meilleures suggestions du moment.</li></ul>" },
          shopping: { title: "Achats", subtitle: "Supermarches et centres commerciaux.", html: "<div class='info-sections'><div class='info-item'><p class='info-item-title'><span class='icon'>🛒</span>Supermarchés</p><p class='info-item-text'><strong>Lidl</strong> · aprox. 1 km · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Lidl+Albufeira+Rua+Baden+Powell' target='_blank' rel='noreferrer'>Voir sur la carte</a><br><strong>Aldi</strong> · aprox. 1 km · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Aldi+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a><br><strong>Continente</strong> · aprox. 1,1 km · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Continente+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a><br><strong>Pingo Doce</strong> · aprox. 1,1 km · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Pingo+Doce+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏪</span>Supérettes</p><p class='info-item-text'>Nombreuses supérettes et épiceries dans le centre historique, à 2–5 min à pied. <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=mini+mercado+centro+historico+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a><br><strong>Marché Municipal</strong> · produits frais, ouvert le matin · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Mercado+Municipal+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a><br><strong>Amanhecer</strong> — horaires étendus, y compris le week-end</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🎁</span>Souvenirs &amp; Artisanat</p><p class='info-item-text'><strong>Rua 5 de Outubro</strong> · rue principale de l'artisanat et des souvenirs de l'Algarve · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Rua+5+de+Outubro+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a><br><strong>Artesanato A Mó</strong> · articles portugais authentiques : liège, azulejos, broderies · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Artesanato+A+Mo+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a><br><strong>Largo Eng. Duarte Pacheco</strong> — place centrale avec boutiques de souvenirs et artisanat local</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏬</span>Centres Commerciaux</p><p class='info-item-text'><strong>Algarve Shopping</strong> · 8 km — Guia · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Algarve+Shopping+Guia+Portugal' target='_blank' rel='noreferrer'>Voir sur la carte</a><br><strong>MAR Shopping Algarve</strong> · 31 km — Almancil · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=MAR+Shopping+Algarve+Almancil' target='_blank' rel='noreferrer'>Voir sur la carte</a></p></div></div>" },
          emergency: { title: "Urgence", subtitle: "Contacts immediats.", html: "<ul class='list'><li><strong>112</strong> (ambulance, police, pompiers).</li><li>Indiquer l'adresse: Rua do MFA n.15 Apto B, Albufeira.</li><li>Apres 112, contacter l'hote.</li></ul>" },

      es: {
        back: "← Volver",
        fallbackTitle: "Informacion",
        fallbackSubtitle: "Tema no encontrado.",
        sections: {
          welcome: { title: "Bienvenido", subtitle: "Resumen del alojamiento White Sand Apartments.", html: "<div class='welcome-layout'><p class='welcome-block'>Apartamentos White Sand, totalmente reformados, con una decoración moderna, de tipo T1, T2 y T0, situados en una de las zonas más privilegiadas de Albufeira, cerca de todos los servicios y a tan solo 300 m de la playa! Con todas las comodidades que estos ofrecen queremos brindarte una gran experiencia para que tu estadía sea lo más cómoda posible y sobre todo que descanses y disfrutes de unas hermosas vacaciones!</p><div class='welcome-image-slot'><img src='./welcome-all.png' alt='Apartamento White Sand'></div></div>" },
          check: { title: "Check-in", subtitle: "Detalles de llegada.", html: "<p class='line'><strong>Check-in:</strong> a partir de las 16:00</p><p class='line'>Las llaves se colocaran en una pequena caja de seguridad en la entrada del edificio, y recibiras el codigo de acceso el dia de tu llegada.</p><div class='checkin-gallery'><img src='./checkin-2.jpg' alt='Entrada del edificio'><img src='./checkin-3.jpg' alt='Ubicacion de entrada'><img src='./checkin-1.jpg' alt='Caja de llaves'></div>" },
          location: { title: "Ubicacion", subtitle: "Direccion y mapa.", html: "<p class='line'><strong>Direccion:</strong> Rua do MFA, n.15 Apto (Letra de su apartamento), 8200-157 Albufeira</p><p class='line'><strong>Coordenadas:</strong> 37.0891053, -8.2507170</p><p class='line'><a class='link' target='_blank' rel='noreferrer' href='https://goo.gl/maps/sj565hq985biABaD6'>Abrir en Google Maps</a></p><div class='extra-location'><p class='extra-location-text'>Los apartamentos estan ubicados en el centro historico de Albufeira, a pocos minutos a pie de Praia dos Pescadores y de otras playas. La ubicacion es excelente, con restaurantes, bares, supermercados y tiendas alrededor, permitiendo hacer todo a pie. A pocos metros tambien encontraras la Plaza del Casco Antiguo, calles tipicas del Algarve y miradores con vistas increibles al mar. Ideal para quien quiere aprovechar lo mejor de la ciudad, entre playa y animacion, sin necesidad de coche.</p><div class='extra-location-images'><img src='./localizacao-1.jpg' alt='Playa en Albufeira'><img src='./localizacao-2.jpg' alt='Centro historico de Albufeira'></div></div>" },
          info: { title: "Informacion", subtitle: "Datos importantes para la estancia.", html: "<div class='info-sections'><div class='info-item'><p class='info-item-title'><span class='icon'>🅿️</span>Aparcamiento</p><p class='info-item-text'>En nuestra calle y en los alrededores podras aparcar gratuitamente (aparcamiento en la calle). Tambien hay un aparcamiento de pago a 130 metros. Ubicacion del aparcamiento: <a class='link' target='_blank' rel='noreferrer' href='https://maps.app.goo.gl/gmK6iXghkyXu6mPLA'>Abrir ubicacion</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🧹</span>Servicio de limpieza</p><p class='info-item-text'>Proporcionamos ropa de cama y toallas de bano para su estancia. Para estancias mas largas, en el 8o dia ofrecemos gratuitamente cambio de ropa y una breve limpieza.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🗑️</span>Basura - contenedores</p><p class='info-item-text'>En una calle mas abajo hay contenedores especificos para dejar su basura. Ubicacion: <a class='link' target='_blank' rel='noreferrer' href='https://maps.app.goo.gl/SYxqfTYpkznRy9Ky6'>Abrir ubicacion</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🧾</span>TMT</p><p class='info-item-text'>Tasa turistica municipal de Albufeira (2€ por persona/noche hasta un maximo de 7 noches), conforme a la normativa local. Si este impuesto no esta incluido en el importe total de su reserva, el pago debera realizarse segun la informacion que se le enviara.</p></div></div>" },
          rules: { title: "Normas de la casa", subtitle: "Normas principales para una estancia tranquila.", html: "<div class='rules-grid'><div class='rule-card'><p class='rule-num'>01</p><p class='rule-title'>Prohibido fumar</p><p class='rule-text'>Por favor, no fume ni vapee dentro o en los alrededores del apartamento.</p></div><div class='rule-card'><p class='rule-num'>02</p><p class='rule-title'>Sin visitas</p><p class='rule-text'>No se permiten visitas no registradas. Informe al anfitrion si desea agregar huespedes a su reserva.</p></div><div class='rule-card'><p class='rule-num'>03</p><p class='rule-title'>Sin mascotas</p><p class='rule-text'>No se permiten mascotas en la propiedad en ningun momento.</p></div><div class='rule-card'><p class='rule-num'>04</p><p class='rule-title'>Sin fiestas</p><p class='rule-text'>No se permiten fiestas ni eventos.</p></div><div class='rule-card'><p class='rule-num'>05</p><p class='rule-title'>Danos</p><p class='rule-text'>Por favor, informe de inmediato al anfitrion sobre cualquier dano o averia para poder reparar o sustituir el elemento afectado.</p></div><div class='rule-card'><p class='rule-num'>06</p><p class='rule-title'>Horas de silencio</p><p class='rule-text'>Para la comodidad y disfrute tanto de los huespedes como de los vecinos, solicitamos que los niveles de ruido se mantengan al minimo durante las horas de silencio.</p></div></div>" },
          amenities: { title: "Comodidades", subtitle: "Equipamiento disponible en el apartamento.", html: "<p class='amenities-intro'>El apartamento está equipado con todas las comodidades que necesita para una estancia cómoda.</p><ul class='list amenities-list'><li>Wi-Fi</li><li>Televisión Inteligente (Smart TV)</li><li>Máquina de Café</li><li>Secador de Pelo</li><li>Ropa de Cama</li><li>Toallas de baño</li><li>Champú y Gel de Ducha</li><li>Utensilios de Mesa y Cocina</li><li>Aire Acondicionado</li><li>Lavadora</li></ul>" },
          wifi: { title: "Wi-Fi", subtitle: "Datos de conexion a internet.", html: "<p class='wifi-note'>Las credenciales de red estan ocultas hasta activar el acceso por apartamento.</p><div class='wifi-list'><div class='wifi-item'><p class='wifi-apt'>Apartamento B</p><p class='wifi-meta'><strong>Red:</strong> Oculta</p><p class='wifi-meta'><strong>Contrasena:</strong> Oculta</p><span class='wifi-lock'>🔒 Bloqueado</span></div><div class='wifi-item'><p class='wifi-apt'>Apartamento C</p><p class='wifi-meta'><strong>Red:</strong> Oculta</p><p class='wifi-meta'><strong>Contrasena:</strong> Oculta</p><span class='wifi-lock'>🔒 Bloqueado</span></div><div class='wifi-item'><p class='wifi-apt'>Apartamento D</p><p class='wifi-meta'><strong>Red:</strong> Oculta</p><p class='wifi-meta'><strong>Contrasena:</strong> Oculta</p><span class='wifi-lock'>🔒 Bloqueado</span></div><div class='wifi-item'><p class='wifi-apt'>Apartamento E</p><p class='wifi-meta'><strong>Red:</strong> Oculta</p><p class='wifi-meta'><strong>Contrasena:</strong> Oculta</p><span class='wifi-lock'>🔒 Bloqueado</span></div><div class='wifi-item'><p class='wifi-apt'>Apartamento F</p><p class='wifi-meta'><strong>Red:</strong> Oculta</p><p class='wifi-meta'><strong>Contrasena:</strong> Oculta</p><span class='wifi-lock'>🔒 Bloqueado</span></div><div class='wifi-item'><p class='wifi-apt'>Apartamento G</p><p class='wifi-meta'><strong>Red:</strong> Oculta</p><p class='wifi-meta'><strong>Contrasena:</strong> Oculta</p><span class='wifi-lock'>🔒 Bloqueado</span></div><div class='wifi-item'><p class='wifi-apt'>Apartamento H</p><p class='wifi-meta'><strong>Red:</strong> Oculta</p><p class='wifi-meta'><strong>Contrasena:</strong> Oculta</p><span class='wifi-lock'>🔒 Bloqueado</span></div><div class='wifi-item'><p class='wifi-apt'>Apartamento I</p><p class='wifi-meta'><strong>Red:</strong> Oculta</p><p class='wifi-meta'><strong>Contrasena:</strong> Oculta</p><span class='wifi-lock'>🔒 Bloqueado</span></div><div class='wifi-item'><p class='wifi-apt'>Apartamento J</p><p class='wifi-meta'><strong>Red:</strong> Oculta</p><p class='wifi-meta'><strong>Contrasena:</strong> Oculta</p><span class='wifi-lock'>🔒 Bloqueado</span></div></div>" },
          safety: { title: "Seguridad", subtitle: "Emergencias y contactos utiles.", html: "<div class='safety-grid'><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Emergencia</p><p class='safety-detail'>112</p><p class='safety-note'>Disponible las 24 horas del día, todos los días.<br>El 112 es el número único europeo de emergencias, disponible en toda la Unión Europea.<br>Las llamadas son gratuitas.</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Linea de salud</p><p class='safety-detail'>808 24 24 24</p><p class='safety-note'>Disponible las 24 horas del día, todos los días.<br>El 112 es el número único europeo de emergencias, disponible en toda la Unión Europea.<br>Las llamadas son gratuitas.</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Hospital Lusíadas Albufeira</p><p class='safety-detail'>289 892 040</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Bomberos</p><p class='safety-detail'>289 586 333</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Policia</p><p class='safety-detail'>289 590 790</p></div></div>" },
          transport: { title: "Transporte", subtitle: "Como llegar y moverse por la zona." },
          visit: { title: "Lugares para visitar", subtitle: "11 lugares imprescindibles en Albufeira.", html: "<div class='place-grid'><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/6/6a/15-09-2017_Praia_dos_Pescadores%2C_Albufeira_%283%29.JPG)'></div><div class='place-body'><p class='place-name'>🏖️ Praia dos Pescadores</p><p class='place-desc'>La playa mas emblematica de Albufeira, a solo 5 min a pie. Aguas tranquilas bajo los acantilados del casco antiguo.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Praia+dos+Pescadores+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/4/4b/Jardim_P%C3%BAblico_Albufeira_25_March_2015_%281%29.JPG)'></div><div class='place-body'><p class='place-name'>🏘️ Casco Antiguo de Albufeira</p><p class='place-desc'>Calles empedradas, casas encaladas y plazas animadas. Imprescindible al atardecer, con vistas al mar.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Centro+Historico+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/a/a3/Marina_de_Albufeira_-_Portugal_%2853496631781%29.jpg)'></div><div class='place-body'><p class='place-name'>⛵ Marina de Albufeira</p><p class='place-desc'>Zona moderna con restaurantes, bares y punto de salida de excursiones en barco. A unos 3 km.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Marina+de+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Falesia_Beach_seen_from_sea.JPG/330px-Falesia_Beach_seen_from_sea.JPG)'></div><div class='place-body'><p class='place-name'>🌅 Praia da Falésia</p><p class='place-desc'>Acantilados naranja espectaculares de mas de 5 km. Una de las playas mas impresionantes del Algarve, a 10 km.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Praia+da+Falesia+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/a/ac/A_Catedral_de_Benagil.JPG)'></div><div class='place-body'><p class='place-name'>🪨 Cuevas de Benagil</p><p class='place-desc'>Una de las cuevas marinas mas fotografiadas del mundo, con apertura natural en el techo. Acceso en barco desde la Marina.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Grutas+de+Benagil+Lagoa' target='_blank' rel='noreferrer'>Ver en el mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/Castelo_de_Silves_-_Algarve%2C_Portugal_-_11.03.2023.jpg/330px-Castelo_de_Silves_-_Algarve%2C_Portugal_-_11.03.2023.jpg)'></div><div class='place-body'><p class='place-name'>🏰 Castillo de Silves</p><p class='place-desc'>Majestuoso castillo moro de la epoca islamica, a unos 30 km. Una de las ciudades historicas mas bonitas del Algarve.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Castelo+de+Silves' target='_blank' rel='noreferrer'>Ver en el mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/c/c3/Zoomarine_Algarve_15.JPG)'></div><div class='place-body'><p class='place-name'>🐬 Zoomarine</p><p class='place-desc'>Parque tematico con espectaculos de delfines, atracciones acuaticas y entretenimiento familiar. A solo 5 km.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Zoomarine+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/2/29/Slide_%26_Splash_Algarve.jpg)'></div><div class='place-body'><p class='place-name'>🎢 Slide &amp; Splash</p><p class='place-desc'>Uno de los mejores parques acuaticos de Europa, con toboganes para todas las edades. A unos 25 km.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Slide+Splash+Lagoa+Algarve' target='_blank' rel='noreferrer'>Ver en el mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/d/d0/119PT_13_November_2013_Praia_da_Gal%C3%A9.JPG)'></div><div class='place-body'><p class='place-name'>🏄 Praia da Galé</p><p class='place-desc'>Playa tranquila y familiar con aguas cristalinas y acantilados dorados. Ideal para el descanso, a 8 km.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Praia+da+Gale+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Cacela_Velha_Fortress2.jpg/330px-Cacela_Velha_Fortress2.jpg)'></div><div class='place-body'><p class='place-name'>🏰 Cacela Velha</p><p class='place-desc'>Pueblo medieval conservado con un fuerte del siglo XVIII e iglesia de 1583. Vistas impresionantes sobre la Ria Formosa. A 50 km.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Cacela+Velha+Algarve' target='_blank' rel='noreferrer'>Ver en el mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/e/e0/Olhao_Portugal_aerial_view.jpg)'></div><div class='place-body'><p class='place-name'>🏝️ Islas de la Ria Formosa</p><p class='place-desc'>Parque Natural elegido 7a Maravilla Natural de Portugal. Islas desiertas, lagunas y piscinas naturales. Ferry desde Faro/Olhao.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Parque+Natural+Ria+Formosa+Olhao' target='_blank' rel='noreferrer'>Ver en el mapa</a></div></div></div>" },
          activities: { title: "Actividades", subtitle: "11 experiencias imprescindibles en Albufeira.", html: "<div class='place-grid'><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/b/b0/02-05-2017_Algar_de_Benagil_%281%29.JPG)'></div><div class='place-body'><p class='place-name'>🚤 Excursión en Barco a las Cuevas de Benagil</p><p class='place-desc'>La excursión más popular del Algarve. Sale de la Marina hacia las famosas cuevas marinas, incluida la icónica Cueva de Benagil. Reserva con antelación en verano.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Marina+Albufeira+excursion+barco' target='_blank' rel='noreferrer'>Ver en el mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/1/13/DuskyDolphin.jpg)'></div><div class='place-body'><p class='place-name'>🐬 Avistamiento de Delfines</p><p class='place-desc'>Salidas diarias desde la Marina para observar delfines en libertad en el Atlántico. Una experiencia única e inolvidable para toda la familia.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Marina+de+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/8/89/Surfing_on_Praia_da_Arrifana.jpg)'></div><div class='place-body'><p class='place-name'>🏄 Surf, Bodyboard &amp; SUP</p><p class='place-desc'>El Algarve ofrece excelentes condiciones para el surf. Escuelas y alquiler de equipos en las playas. El Stand-Up Paddle es ideal para aguas más calmadas.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=escuela+surf+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/e/e2/SHADES_OF_BLUE_%283522593783%29.jpg)'></div><div class='place-body'><p class='place-name'>🤿 Buceo &amp; Snorkel</p><p class='place-desc'>Descubre el fondo marino del Algarve: cuevas submarinas, arrecifes y fauna marina rica. Centros de buceo en la Marina con clases para principiantes y buceos guiados.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=centro+buceo+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/e/ea/Fishing_boat_at_sunrise%2C_Luz_%2851881716321%29.jpg)'></div><div class='place-body'><p class='place-name'>🎣 Pesca Deportiva</p><p class='place-desc'>Salidas de pesca desde la Marina con guía y equipo incluido. Pesca de fondo y pesca deportiva en alta mar a lo largo de la costa del Algarve.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=pesca+deportiva+Marina+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/4/4b/Jardim_P%C3%BAblico_Albufeira_25_March_2015_%281%29.JPG)'></div><div class='place-body'><p class='place-name'>🚶 Paseo por el Centro Histórico</p><p class='place-desc'>Explora las calles adoquinadas, miradores con vistas al mar y plazas típicas de la histórica Albufeira. Imprescindible al atardecer con la luz dorada iluminando la ciudad.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Centro+Historico+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/3/3f/Jeep_Safari_Algarve_-_panoramio.jpg)'></div><div class='place-body'><p class='place-name'>🚙 Safari en Jeep &amp; Buggy Tour</p><p class='place-desc'>Aventura todoterreno por el interior del Algarve: colinas, naranjos, pueblos tradicionales y paisajes espectaculares. Tours de medio día y día completo desde Albufeira.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Safari+Jeep+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/6/6a/15-09-2017_Praia_dos_Pescadores%2C_Albufeira_%283%29.JPG)'></div><div class='place-body'><p class='place-name'>🏖️ Días de Playa</p><p class='place-desc'>Con más de 10 playas a menos de 15 km, hay para todos los gustos: animadas (Praia da Oura) o tranquilas y vírgenes (Praia da Galé, Praia da Falésia).</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=playas+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/a/ad/Miradouro_do_Vale_Suspenso_-_viewpoint_of_the_Suspension_Valley_%2852859674883%29.jpg)'></div><div class='place-body'><p class='place-name'>🚴 Ciclismo &amp; Senderismo</p><p class='place-desc'>Rutas costeras e interiores en toda la zona. Alquiler de bicicletas en la ciudad. A pie, el Percurso dos Sete Vales Suspensos (Lagoa) es uno de los más espectaculares.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Sete+Vales+Suspensos+Lagoa' target='_blank' rel='noreferrer'>Ver en el mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/c/c2/Rua_C%C3%A2ndido_dos_Reis%2C_Albufeira.jpg)'></div><div class='place-body'><p class='place-name'>🍹 Vida Nocturna — Praia da Oura</p><p class='place-desc'>Conocida como &quot;The Strip&quot;, es la zona de animación nocturna por excelencia de Albufeira. Bares, pubs y clubes abiertos hasta el amanecer. A unos 3 km.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=The+Strip+Praia+da+Oura+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/a/a3/Marina_de_Albufeira_-_Portugal_%2853496631781%29.jpg)'></div><div class='place-body'><p class='place-name'>🌙 Vida Nocturna — Praia dos Pescadores</p><p class='place-desc'>El centro histórico junto a Praia dos Pescadores ofrece ambiente nocturno más auténtico: terrazas con vistas al mar y música en vivo. A 5 minutos a pie.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Praia+dos+Pescadores+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a></div></div></div>" },
          eat: { title: "Comer y Beber", subtitle: "Restaurantes ordenados de más barato a más caro.", html: "<div class='rest-list'><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://maps.app.goo.gl/rA4cq7F3agYmyYcy6' target='_blank' rel='noreferrer'>Franguinho de Albufeira</a><span class='rest-price eco'>€</span></div><span class='rest-cuisine'>🍗 Pollo asado / Para llevar</span><p class='rest-addr'>📍 Centro de Albufeira · <a class='link' href='https://maps.app.goo.gl/rA4cq7F3agYmyYcy6' target='_blank' rel='noreferrer'>Ver en el mapa</a></p><p class='rest-menu-label'>Carta</p><div class='rest-tags'><span>Pollo al carbón</span><span>Patatas fritas</span><span>Piri-piri</span><span>Ensaladas</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://www.google.com/maps/search/?api=1&query=Copos+Petiscos+Albufeira' target='_blank' rel='noreferrer'>Copos &amp; Petiscos</a><span class='rest-price mid'>€€</span></div><span class='rest-cuisine'>🍷 Bar de vinos &amp; petiscos</span><p class='rest-addr'>📍 R. Alexandre Herculano, Albufeira · <a class='link' href='https://www.google.com/maps/search/?api=1&query=Copos+Petiscos+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a></p><p class='rest-menu-label'>Carta</p><div class='rest-tags'><span>Petiscos</span><span>Tabla de embutidos</span><span>Quesos</span><span>Vinos seleccionados</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://maps.app.goo.gl/w9gtzSM2WV5ixY5YA' target='_blank' rel='noreferrer'>Tasca do Viegas</a><span class='rest-price mid'>€€</span></div><span class='rest-cuisine'>🫙 Tasca portuguesa tradicional</span><p class='rest-addr'>📍 Casco histórico de Albufeira · <a class='link' href='https://maps.app.goo.gl/w9gtzSM2WV5ixY5YA' target='_blank' rel='noreferrer'>Ver en el mapa</a></p><p class='rest-menu-label'>Carta</p><div class='rest-tags'><span>Petiscos</span><span>Bocadillo de filete</span><span>Bacalao</span><span>Caracoles</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://www.google.com/maps/search/?api=1&query=Cepa+Velha+Albufeira' target='_blank' rel='noreferrer'>Cepa Velha</a><span class='rest-price mid'>€€</span></div><span class='rest-cuisine'>🍽️ Cocina portuguesa tradicional</span><p class='rest-addr'>📍 R. Vasco da Gama, Albufeira · <a class='link' href='https://www.google.com/maps/search/?api=1&query=Cepa+Velha+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a></p><p class='rest-menu-label'>Carta</p><div class='rest-tags'><span>Cataplana</span><span>Bacalao</span><span>Parrillada</span><span>Sangria</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://maps.app.goo.gl/uXt8f8Lu8vPBQv7c6' target='_blank' rel='noreferrer'>Clay Oven</a><span class='rest-price mid'>€€</span></div><span class='rest-cuisine'>🍛 Cocina india</span><p class='rest-addr'>📍 Albufeira · <a class='link' href='https://maps.app.goo.gl/uXt8f8Lu8vPBQv7c6' target='_blank' rel='noreferrer'>Ver en el mapa</a></p><p class='rest-menu-label'>Carta</p><div class='rest-tags'><span>Tikka Masala</span><span>Biryani</span><span>Naan</span><span>Curries</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://www.google.com/maps/search/?api=1&query=O+Lusitano+Albufeira' target='_blank' rel='noreferrer'>O Lusitano</a><span class='rest-price hi'>€€€</span></div><span class='rest-cuisine'>🍴 Cocina portuguesa moderna</span><p class='rest-addr'>📍 Urb. Quinta da Correeira, Albufeira · <a class='link' href='https://www.google.com/maps/search/?api=1&query=O+Lusitano+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a></p><p class='rest-menu-label'>Carta</p><div class='rest-tags'><span>Cataplana de rape</span><span>Magret de pato</span><span>Filete portugués</span><span>Bacalao</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://maps.app.goo.gl/5GTwm6RyKvPDEC338' target='_blank' rel='noreferrer'>Taberna do Pescador</a><span class='rest-price hi'>€€€</span></div><span class='rest-cuisine'>🦞 Mariscos &amp; Pescado fresco</span><p class='rest-addr'>📍 Casco histórico de Albufeira · <a class='link' href='https://maps.app.goo.gl/5GTwm6RyKvPDEC338' target='_blank' rel='noreferrer'>Ver en el mapa</a></p><p class='rest-menu-label'>Carta</p><div class='rest-tags'><span>Almejas</span><span>Percebes</span><span>Cataplana</span><span>Pescado del día</span></div></div></div>" },
          bars: { title: "Bares y Clubes", subtitle: "Sugerencias de vida nocturna.", html: "<ul class='list'><li>Explora la zona de Oura y el casco antiguo por la noche.</li><li>Pidenos recomendaciones actualizadas de bares y clubes.</li></ul>" },
          shopping: { title: "Compras", subtitle: "Supermercados y centros comerciales.", html: "<div class='info-sections'><div class='info-item'><p class='info-item-title'><span class='icon'>🛒</span>Supermercados</p><p class='info-item-text'><strong>Lidl</strong> · aprox. 1 km · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Lidl+Albufeira+Rua+Baden+Powell' target='_blank' rel='noreferrer'>Ver en el mapa</a><br><strong>Aldi</strong> · aprox. 1 km · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Aldi+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a><br><strong>Continente</strong> · aprox. 1,1 km · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Continente+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a><br><strong>Pingo Doce</strong> · aprox. 1,1 km · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Pingo+Doce+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏪</span>Tiendas de Conveniencia</p><p class='info-item-text'>Numerosas tiendas de conveniencia y minisupers en el centro histórico, a 2–5 min a pie. <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=mini+mercado+centro+historico+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a><br><strong>Mercado Municipal</strong> · productos frescos, abierto por las mañanas · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Mercado+Municipal+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a><br><strong>Amanhecer</strong> — horario ampliado, incluidos fines de semana</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🎁</span>Souvenirs &amp; Artesanía</p><p class='info-item-text'><strong>Rua 5 de Outubro</strong> · calle principal de artesanía y souvenirs del Algarve · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Rua+5+de+Outubro+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a><br><strong>Artesanato A Mó</strong> · artículos genuinamente portugueses: corcho, azulejos, bordados · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Artesanato+A+Mo+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a><br><strong>Largo Eng. Duarte Pacheco</strong> — plaza central con tiendas de recuerdos y artesanía local</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏬</span>Centros Comerciales</p><p class='info-item-text'><strong>Algarve Shopping</strong> · 8 km — Guia · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Algarve+Shopping+Guia+Portugal' target='_blank' rel='noreferrer'>Ver en el mapa</a><br><strong>MAR Shopping Algarve</strong> · 31 km — Almancil · <a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=MAR+Shopping+Algarve+Almancil' target='_blank' rel='noreferrer'>Ver en el mapa</a></p></div></div>" },
          emergency: { title: "Emergencia", subtitle: "Contactos inmediatos para casos urgentes.", html: "<ul class='list'><li><strong>112</strong> (ambulancia, policia, bomberos).</li><li>Indica la direccion: Rua do MFA n.15 Apto B, Albufeira.</li><li>Despues del 112, contacta al anfitrion.</li></ul>" },
          checkout: { title: "Check-out", subtitle: "Antes de salir del alojamiento.", html: "<ul class='list'><li>Check-out entre las 08:00 y las 10:00.</li><li>Cerrar ventanas y apagar luces/aire acondicionado.</li><li>Dejar las llaves segun las instrucciones recibidas.</li></ul>" },
          contacts: { title: "Contactos", subtitle: "Canales de contacto rapido.", html: "<ul class='list'><li><a class='link' href='tel:+351910000000'>+351 910 000 000</a></li><li><a class='link' target='_blank' rel='noreferrer' href='https://wa.me/351910000000'>WhatsApp</a></li><li><a class='link' href='mailto:reservas@whitesand.pt'>reservas@whitesand.pt</a></li></ul>" },

      de: {
        back: "← Zurueck",
        fallbackTitle: "Information",
        fallbackSubtitle: "Thema nicht gefunden.",
        sections: {
          welcome: { title: "Willkommen", subtitle: "Ueberblick ueber die Unterkunft.", html: "<div class='welcome-layout'><p class='welcome-block'>White Sand Apartments, komplett renoviert und modern eingerichtet, in den Typen T1, T2 und T0, befinden sich in einer der privilegiertesten Gegenden von Albufeira, nahe aller Dienstleistungen und nur 300 m vom Strand entfernt! Mit allen angebotenen Annehmlichkeiten moechten wir dir ein grossartiges Erlebnis bieten, damit dein Aufenthalt so komfortabel wie moeglich ist und du vor allem ausruhst und einen wunderschoenen Urlaub geniesst!</p><div class='welcome-image-slot'><img src='./welcome-all.png' alt='White Sand Wohnung'></div></div>" },
          check: { title: "Check-in", subtitle: "Anreiseinformationen.", html: "<p class='line'><strong>Check-in:</strong> ab 16:00</p><p class='line'>Die Schluessel werden in einem kleinen Schluesseltresor am Gebaeudeeingang hinterlegt, und du erhaeltst den Zugangscode am Tag deiner Anreise.</p><div class='checkin-gallery'><img src='./checkin-2.jpg' alt='Gebaeudeeingang'><img src='./checkin-3.jpg' alt='Eingangsposition'><img src='./checkin-1.jpg' alt='Schluesseltresor'></div>" },
          location: { title: "Lage", subtitle: "Adresse und Karte.", html: "<p class='line'><strong>Adresse:</strong> Rua do MFA, n.15 Apto (Buchstabe Ihrer Wohnung), 8200-157 Albufeira</p><p class='line'><strong>Koordinaten:</strong> 37.0891053, -8.2507170</p><p class='line'><a class='link' target='_blank' rel='noreferrer' href='https://goo.gl/maps/sj565hq985biABaD6'>In Google Maps oeffnen</a></p><div class='extra-location'><p class='extra-location-text'>Die Apartments liegen im historischen Zentrum von Albufeira, nur wenige Gehminuten von der Praia dos Pescadores und anderen Straenden entfernt. Die Lage ist ausgezeichnet, mit Restaurants, Bars, Supermaerkten und Geschaeften direkt in der Umgebung, sodass man alles zu Fuss erledigen kann. Nur wenige Meter entfernt befinden sich auch der Platz der Altstadt, typische Algarve-Gassen und Aussichtspunkte mit beeindruckendem Meerblick. Ideal fuer alle, die das Beste der Stadt zwischen Strand und Unterhaltung geniessen moechten, ohne ein Auto zu brauchen.</p><div class='extra-location-images'><img src='./localizacao-1.jpg' alt='Strand in Albufeira'><img src='./localizacao-2.jpg' alt='Historisches Zentrum von Albufeira'></div></div>" },
          info: { title: "Information", subtitle: "Wichtige Infos fuer den Aufenthalt.", html: "<div class='info-sections'><div class='info-item'><p class='info-item-title'><span class='icon'>🅿️</span>Parken</p><p class='info-item-text'>In unserer Strasse und in der Umgebung koennen Sie kostenlos parken (Strassenparkplaetze). Es gibt auch einen kostenpflichtigen Parkplatz in 130 Metern Entfernung. Parkplatz-Standort: <a class='link' target='_blank' rel='noreferrer' href='https://maps.app.goo.gl/gmK6iXghkyXu6mPLA'>Standort oeffnen</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🧹</span>Reinigungsservice</p><p class='info-item-text'>Wir stellen Bettwaesche und Badetuecher fuer Ihren Aufenthalt bereit. Bei laengeren Aufenthalten bieten wir am 8. Tag kostenlos einen Waeschewechsel und eine kurze Reinigung an.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🗑️</span>Muell - Container</p><p class='info-item-text'>In einer Strasse weiter unten gibt es spezielle Container zur Entsorgung Ihres Muells. Standort: <a class='link' target='_blank' rel='noreferrer' href='https://maps.app.goo.gl/SYxqfTYpkznRy9Ky6'>Standort oeffnen</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🧾</span>TMT</p><p class='info-item-text'>Kommunale Tourismussteuer von Albufeira (2€ pro Person/Nacht bis maximal 7 Naechte), gemaess den lokalen Bestimmungen. Falls diese Steuer nicht im Gesamtbetrag Ihrer Buchung enthalten ist, muss die Zahlung gemaess den Ihnen zugesendeten Informationen erfolgen.</p></div></div>" },
          rules: { title: "Hausregeln", subtitle: "Wichtige Regeln fuer einen ruhigen Aufenthalt.", html: "<div class='rules-grid'><div class='rule-card'><p class='rule-num'>01</p><p class='rule-title'>Rauchen verboten</p><p class='rule-text'>Bitte nicht in oder rund um die Wohnung rauchen oder vapen.</p></div><div class='rule-card'><p class='rule-num'>02</p><p class='rule-title'>Keine Besucher</p><p class='rule-text'>Keine nicht registrierten Besucher. Informieren Sie den Gastgeber, wenn Sie weitere Gaeste zur Buchung hinzufuegen moechten.</p></div><div class='rule-card'><p class='rule-num'>03</p><p class='rule-title'>Keine Haustiere</p><p class='rule-text'>Haustiere sind auf dem gesamten Grundstueck nicht erlaubt.</p></div><div class='rule-card'><p class='rule-num'>04</p><p class='rule-title'>Keine Partys</p><p class='rule-text'>Partys oder Veranstaltungen sind nicht erlaubt.</p></div><div class='rule-card'><p class='rule-num'>05</p><p class='rule-title'>Schaeden</p><p class='rule-text'>Bitte melden Sie Schaeden oder Stoerungen sofort dem Gastgeber, damit wir den betroffenen Gegenstand reparieren oder ersetzen koennen.</p></div><div class='rule-card'><p class='rule-num'>06</p><p class='rule-title'>Ruhezeiten</p><p class='rule-text'>Fuer den Komfort und das Wohlbefinden von Gaesten und Nachbarn bitten wir darum, den Geraeuschpegel waehrend der Ruhezeiten auf ein Minimum zu reduzieren.</p></div></div>" },
          amenities: { title: "Komfort", subtitle: "Ausstattung der Unterkunft.", html: "<p class='amenities-intro'>Die Wohnung ist mit allen Annehmlichkeiten ausgestattet, die Sie fuer einen komfortablen Aufenthalt benoetigen.</p><ul class='list amenities-list'><li>Wi-Fi</li><li>Smart-TV</li><li>Kaffeemaschine</li><li>Haartrockner</li><li>Bettwaesche</li><li>Badetuecher</li><li>Shampoo und Duschgel</li><li>Tischgeschirr und Kuechenutensilien</li><li>Klimaanlage</li><li>Waschmaschine</li></ul>" },
          wifi: { title: "Wi-Fi", subtitle: "Internetzugang.", html: "<p class='wifi-note'>Die Netzwerkdaten sind ausgeblendet, bis der wohnungsbezogene Zugriff aktiviert ist.</p><div class='wifi-list'><div class='wifi-item'><p class='wifi-apt'>Apartment B</p><p class='wifi-meta'><strong>Netzwerk:</strong> Versteckt</p><p class='wifi-meta'><strong>Passwort:</strong> Versteckt</p><span class='wifi-lock'>🔒 Gesperrt</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment C</p><p class='wifi-meta'><strong>Netzwerk:</strong> Versteckt</p><p class='wifi-meta'><strong>Passwort:</strong> Versteckt</p><span class='wifi-lock'>🔒 Gesperrt</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment D</p><p class='wifi-meta'><strong>Netzwerk:</strong> Versteckt</p><p class='wifi-meta'><strong>Passwort:</strong> Versteckt</p><span class='wifi-lock'>🔒 Gesperrt</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment E</p><p class='wifi-meta'><strong>Netzwerk:</strong> Versteckt</p><p class='wifi-meta'><strong>Passwort:</strong> Versteckt</p><span class='wifi-lock'>🔒 Gesperrt</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment F</p><p class='wifi-meta'><strong>Netzwerk:</strong> Versteckt</p><p class='wifi-meta'><strong>Passwort:</strong> Versteckt</p><span class='wifi-lock'>🔒 Gesperrt</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment G</p><p class='wifi-meta'><strong>Netzwerk:</strong> Versteckt</p><p class='wifi-meta'><strong>Passwort:</strong> Versteckt</p><span class='wifi-lock'>🔒 Gesperrt</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment H</p><p class='wifi-meta'><strong>Netzwerk:</strong> Versteckt</p><p class='wifi-meta'><strong>Passwort:</strong> Versteckt</p><span class='wifi-lock'>🔒 Gesperrt</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment I</p><p class='wifi-meta'><strong>Netzwerk:</strong> Versteckt</p><p class='wifi-meta'><strong>Passwort:</strong> Versteckt</p><span class='wifi-lock'>🔒 Gesperrt</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment J</p><p class='wifi-meta'><strong>Netzwerk:</strong> Versteckt</p><p class='wifi-meta'><strong>Passwort:</strong> Versteckt</p><span class='wifi-lock'>🔒 Gesperrt</span></div></div>" },
          safety: { title: "Sicherheit", subtitle: "Notfall und wichtige Kontakte.", html: "<div class='safety-grid'><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Notfall</p><p class='safety-detail'>112</p><p class='safety-note'>Rund um die Uhr an jedem Tag erreichbar.<br>112 ist die einheitliche europäische Notrufnummer in der gesamten Europäischen Union.<br>Anrufe sind kostenlos.</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Gesundheitslinie</p><p class='safety-detail'>808 24 24 24</p><p class='safety-note'>Rund um die Uhr an jedem Tag erreichbar.<br>112 ist die einheitliche europäische Notrufnummer in der gesamten Europäischen Union.<br>Anrufe sind kostenlos.</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Lusíadas Krankenhaus Albufeira</p><p class='safety-detail'>289 892 040</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Feuerwehr</p><p class='safety-detail'>289 586 333</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Polizei</p><p class='safety-detail'>289 590 790</p></div></div>" },
