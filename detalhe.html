<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>White Sand Apartments | Detalhe</title>
  <style>
    :root {
      --bg: #f0f7ff;
      --panel: #ffffff;
      --text: #1f2a37;
      --muted: #5f6c7b;
      --main: #15b8cc;
      --main-dark: #0b87a2;
      --line: #d8e6f2;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
      background-color: #e5d7bb;
      background-image:
        linear-gradient(rgba(244, 248, 255, 0.05), rgba(244, 248, 255, 0.08)),
        url("./fundo-praia.png");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat, repeat-y;
      background-attachment: scroll;
    }
    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 16px;
    }
    .hero {
      background: linear-gradient(140deg, rgba(236, 228, 210, 0.92), rgba(231, 221, 200, 0.9));
      color: #1f2a37;
      border-radius: 16px;
      padding: 14px;
      border: 1px solid rgba(168, 151, 120, 0.35);
    }
    .top-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }
    .back {
      text-decoration: none;
      color: #1f2a37;
      border: 1px solid rgba(31, 42, 55, 0.25);
      background: rgba(255, 255, 255, 0.65);
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: 700;
    }
    h1 {
      margin: 12px 0 6px;
      font-size: clamp(1.2rem, 2.5vw, 1.8rem);
    }
    .subtitle { margin: 0; opacity: .94; }
    .card {
      margin-top: 12px;
      background: #e5d7bb;
      border: 1px solid #b79f72;
      border-radius: 14px;
      padding: 14px;
    }
    .list { margin: 0; padding-left: 18px; }
    .list li { margin-bottom: 7px; }
    .line { margin: 6px 0; }
    .amenities-intro {
      margin: 0 0 10px;
      font-size: 1.95rem;
      font-weight: 800;
      line-height: 1.15;
    }
    .amenities-list li {
      font-size: 1.14rem;
      font-weight: 400;
      line-height: 1.25;
      margin-bottom: 8px;
    }
    .wifi-note {
      margin: 0 0 10px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #b79f72;
      background: rgba(255, 255, 255, 0.35);
      font-weight: 600;
    }
    .wifi-list {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .wifi-item {
      background: #efe3cf;
      border: 1px solid #b79f72;
      border-radius: 12px;
      padding: 10px 12px;
    }
    .wifi-apt {
      margin: 0 0 6px;
      font-weight: 800;
      font-size: 1.02rem;
    }
    .wifi-meta {
      margin: 2px 0;
      font-size: 0.98rem;
    }
    .wifi-lock {
      display: inline-block;
      margin-top: 7px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #5f6c7b;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(31, 42, 55, 0.2);
      border-radius: 999px;
      padding: 2px 8px;
    }
    .wifi-btn {
      display: inline-block;
      margin-top: 8px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 700;
      color: #1f2a37;
      background: #f7f5f2;
      border: 1px solid #b79f72;
      border-radius: 999px;
      padding: 6px 10px;
    }
    .wifi-btn:hover {
      background: #fff;
    }
    .link {
      color: #0f7f9d;
      text-decoration: none;
      font-weight: 600;
    }
    .link:hover { text-decoration: underline; }
    .lang-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .lang-btn {
      border: 1px solid rgba(31, 42, 55, 0.35);
      background: rgba(255, 255, 255, 0.9);
      color: #1f2a37;
      border-radius: 999px;
      padding: 4px 10px 6px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 64px;
      min-height: 48px;
      gap: 2px;
    }
    .lang-btn.active {
      background: #1f2a37;
      color: #fff;
      border-color: #1f2a37;
    }
    .lang-flag {
      font-size: 1.15rem;
      line-height: 1;
      display: block;
    }
    .lang-code {
      line-height: 1;
      font-size: 0.82rem;
    }
    .welcome-layout {
      display: grid;
      gap: 14px;
      grid-template-columns: 1.4fr 1fr;
      align-items: stretch;
    }
    .welcome-block {
      background: #e5d7bb;
      border: 1px solid #b79f72;
      border-radius: 10px;
      padding: 16px 18px;
      line-height: 1.6;
      margin: 0;
      min-height: 210px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      text-align: center;
      font-size: clamp(1.03rem, 1.4vw, 1.15rem);
      padding-bottom: 42px;
    }
    .welcome-image-slot {
      background: rgba(255, 255, 255, 0.72);
      border: 2px dashed rgba(31, 42, 55, 0.25);
      border-radius: 12px;
      min-height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #4b5563;
      font-weight: 600;
      padding: 0;
      overflow: hidden;
    }
    .welcome-image-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .checkin-gallery {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .checkin-gallery img {
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--line);
      display: block;
      background: #fff;
    }
    .extra-location {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 12px;
      align-items: stretch;
    }
    .extra-location-text {
      margin: 0;
      padding: 14px;
      line-height: 1.55;
      font-weight: 700;
      background: #e5d7bb;
      border: 1px solid #b79f72;
      border-radius: 12px;
    }
    .extra-location-images {
      display: grid;
      gap: 10px;
    }
    .extra-location-images img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--line);
      display: block;
      background: #fff;
    }
    .info-sections {
      display: grid;
      gap: 12px;
    }
    .info-item {
      background: #e5d7bb;
      border: 1px solid #b79f72;
      border-radius: 12px;
      padding: 12px 14px;
    }
    .info-item-title {
      margin: 0 0 6px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .info-item-title .icon {
      font-size: 1.1rem;
      line-height: 1;
    }
    .info-item-text {
      margin: 0;
      line-height: 1.5;
    }
    .rules-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .rule-card {
      background: #efe3cf;
      border: 1px solid rgba(31, 42, 55, 0.08);
      border-radius: 24px;
      padding: 14px 12px 16px;
      min-height: 222px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    .rule-num {
      margin: 0;
      font-family: "Bodoni Moda", "Didot", "Times New Roman", Georgia, serif;
      font-size: clamp(3rem, 4vw, 3.35rem);
      line-height: .88;
      font-weight: 500;
      letter-spacing: 1px;
    }
    .rule-title {
      margin: 8px 0 8px;
      text-transform: uppercase;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 1.1px;
      font-size: 1.95rem;
      font-weight: 700;
      line-height: .92;
    }
    .rule-text {
      margin: 0;
      line-height: 1.1;
      font-size: 1.07rem;
      max-width: 95%;
    }
    .rule-card.last {
      grid-column: 1 / -1;
      max-width: 300px;
      margin: 0 auto;
    }
    .safety-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .safety-card {
      background: #efe3cf;
      border: 1px solid rgba(31, 42, 55, 0.08);
      border-radius: 24px;
      padding: 14px 16px 16px;
      min-height: auto;
      text-align: left;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
    }
    .safety-bullet {
      display: block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #1f2a37;
      margin: 0 0 10px;
      flex-shrink: 0;
    }
    .safety-title {
      margin: 0 0 6px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: 0.02em;
    }
    .safety-detail {
      margin: 0;
      line-height: 1.35;
      font-size: clamp(1rem, 2.2vw, 1.12rem);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .safety-note {
      margin: 10px 0 0;
      line-height: 1.45;
      font-size: clamp(0.85rem, 2vw, 0.95rem);
      font-weight: 500;
      color: #4a5563;
    }
    .transport-wrap {
      text-align: left;
    }
    .transport-wrap .safety-grid {
      margin-top: 0;
    }
    .transport-tabs {
      text-align: left;
    }
    .transport-tabs .safety-grid {
      grid-template-columns: 1fr;
    }
    .transport-tablist {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .transport-tab {
      border: 1px solid #b79f72;
      background: rgba(255, 255, 255, 0.65);
      color: #1f2a37;
      border-radius: 999px;
      padding: 8px 16px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      font-family: inherit;
    }
    .transport-tab--active {
      background: #1f2a37;
      color: #fff;
      border-color: #1f2a37;
    }
    .transport-panel {
      display: none;
    }
    .transport-panel--active {
      display: block;
    }
    .transport-app-downloads {
      margin-top: 10px;
      line-height: 1.55;
    }
    .transport-app-downloads a {
      display: inline-block;
      margin-top: 4px;
    }
    .bus-line {
      display: inline-block;
      margin-top: 5px;
      font-weight: 700;
    }
    .bus-line--verde {
      color: #166534;
    }
    .bus-line--azul {
      color: #1d4ed8;
    }
    .transport-bus-photo {
      margin: 8px 0 10px;
      max-width: 140px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(31, 42, 55, 0.12);
    }
    .transport-bus-photo img {
      width: 100%;
      max-width: 140px;
      height: auto;
      display: block;
      vertical-align: middle;
    }
    @media (max-width: 760px) {
      .top-row {
        justify-content: flex-start;
      }
      .welcome-layout {
        grid-template-columns: 1fr;
      }
      .welcome-image-slot {
        min-height: 150px;
      }
      .checkin-gallery {
        grid-template-columns: 1fr;
      }
      .extra-location {
        grid-template-columns: 1fr;
      }
      .rules-grid,
      .safety-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .transport-tabs .safety-grid {
        grid-template-columns: 1fr;
      }
      .rule-card.last {
        max-width: none;
      }
      .rule-card {
        min-height: 208px;
        border-radius: 22px;
      }
      .rule-title {
        font-size: clamp(1.18rem, 3.6vw, 1.45rem);
      }
      .rule-text {
        font-size: clamp(0.90rem, 2.8vw, 1rem);
      }
      .amenities-intro {
        font-size: clamp(1.2rem, 4.8vw, 1.5rem);
      }
      .amenities-list li {
        font-size: clamp(1rem, 3.3vw, 1.08rem);
      }
      .wifi-list {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 420px) {
      .rules-grid,
      .safety-grid { grid-template-columns: 1fr; }
    }
    .rest-list { display: grid; gap: 14px; }
    .rest-card { background: #efe3cf; border: 1px solid #b79f72; border-radius: 14px; padding: 14px 16px; }
    .rest-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .rest-name { font-size: 1.08rem; font-weight: 800; line-height: 1.2; text-decoration: none; color: #0f7f9d; }
    .rest-name:hover { text-decoration: underline; }
    .rest-price { font-weight: 800; font-size: 0.95rem; border-radius: 999px; padding: 2px 11px; flex-shrink: 0; }
    .rest-price.eco { background: #d4edda; color: #2a6a3a; border: 1px solid #8fca99; }
    .rest-price.mid { background: #fff3cd; color: #7a5c00; border: 1px solid #e6c462; }
    .rest-price.hi { background: #fce4d6; color: #8b2500; border: 1px solid #e8a07a; }
    .rest-cuisine { display: inline-block; font-size: 0.87rem; font-weight: 700; background: rgba(255,255,255,0.58); border: 1px solid rgba(31,42,55,0.18); border-radius: 999px; padding: 2px 10px; margin-bottom: 8px; }
    .rest-addr { margin: 0 0 10px; font-size: 0.91rem; color: #5f6c7b; }
    .rest-menu-label { margin: 0 0 6px; font-weight: 800; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.07em; color: #1f2a37; }
    .rest-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .rest-tags span { background: rgba(255,255,255,0.68); border: 1px solid rgba(31,42,55,0.15); border-radius: 999px; padding: 2px 9px; font-size: 0.82rem; font-weight: 600; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="top-row">
        <a class="back" href="./" data-i18n="back">← Voltar</a>
        <div class="lang-row">
          <button class="lang-btn active" data-lang="pt"><span class="lang-flag">🇵🇹</span><span class="lang-code">PT</span></button>
          <button class="lang-btn" data-lang="en"><span class="lang-flag">🇬🇧</span><span class="lang-code">EN</span></button>
          <button class="lang-btn" data-lang="fr"><span class="lang-flag">🇫🇷</span><span class="lang-code">FR</span></button>
          <button class="lang-btn" data-lang="es"><span class="lang-flag">🇪🇸</span><span class="lang-code">ES</span></button>
          <button class="lang-btn" data-lang="de"><span class="lang-flag">🇩🇪</span><span class="lang-code">DE</span></button>
        </div>
      </div>
      <h1 id="title">Detalhe</h1>
      <p class="subtitle" id="subtitle">Informação do tópico selecionado.</p>
    </section>

    <section class="card" id="content"></section>
  </main>

  <script>
    const text = {
      pt: {
        back: "← Voltar",
        fallbackTitle: "Informação",
        fallbackSubtitle: "Tópico não encontrado.",
        sections: {
          welcome: {
            title: "Bem-vindo",
            subtitle: "Resumo do alojamento White Sand Apartments.",
            html: "<div class='welcome-layout'><p class='welcome-block'>White Sand Apartamentos, totalmente remodelados, com uma decoração moderna, de tipologia T1, T2 e T0, localiza-se numa das zonas mais privilegiadas de Albufeira, perto de todos os serviços e apenas a 300 m da praia! Com todas as comodidades que estes oferecem queremos lhe proporcionar uma ótima experiência para tornar a sua estadia o mais cômoda possível e acima de tudo que descanse e desfrute de umas belas férias!</p><div class='welcome-image-slot'><img src='./welcome-all.png' alt='Apartamento White Sand'></div></div>"
          },
          check: {
            title: "Check-in",
            subtitle: "Horários e processo de entrada.",
            html: "<p class='line'><strong>Check-in:</strong> a partir das 16:00</p><p class='line'>As chaves serão colocadas num pequeno cofre à entrada do prédio. Receberá o código de acesso no dia da sua chegada.</p><div class='checkin-gallery'><img src='./checkin-2.jpg' alt='Entrada do prédio'><img src='./checkin-3.jpg' alt='Entrada e localização'><img src='./checkin-1.jpg' alt='Cofre de chaves'></div>"
          },
          location: {
            title: "Localização",
            subtitle: "Morada e mapa do apartamento.",
            html: "<p class='line'><strong>Morada:</strong> Rua do MFA, n.15 Apto (Letra do seu Apartamento), 8200-157 Albufeira</p><p class='line'><strong>Coordenadas:</strong> 37.0891053, -8.2507170</p><p class='line'><a class='link' target='_blank' rel='noreferrer' href='https://goo.gl/maps/sj565hq985biABaD6'>Abrir no Google Maps</a></p><div class='extra-location'><p class='extra-location-text'>Os apartamentos estão situados no centro histórico de Albufeira, a poucos minutos a pé da Praia dos Pescadores e de outras praias. A localização é excelente, com restaurantes, bares, supermercados e lojas mesmo ao redor, permitindo fazer tudo a pé. A poucos metros encontra também a Praça da Cidade Velha, ruas típicas algarvias, miradouros com vistas incríveis sobre o mar. Ideal para quem quer aproveitar o melhor da cidade, entre praia, animação e sem necessidade de carro.</p><div class='extra-location-images'><img src='./localizacao-1.jpg' alt='Praia em Albufeira'><img src='./localizacao-2.jpg' alt='Centro histórico de Albufeira'></div></div>"
          },
          info: {
            title: "Informação",
            subtitle: "Dados importantes para a estadia.",
            html: "<div class='info-sections'><div class='info-item'><p class='info-item-title'><span class='icon'>🅿️</span>Parque</p><p class='info-item-text'>Na mesma rua onde estamos e nas redondezas poderá estacionar gratuitamente (estacionamento de rua). Tem também um parque pago a 130 metros. Localização parque: <a class='link' target='_blank' rel='noreferrer' href='https://maps.app.goo.gl/gmK6iXghkyXu6mPLA'>Abrir localização</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🧹</span>Serviço de limpeza</p><p class='info-item-text'>Fornecemos roupa de cama e toalhas de banho para a sua estadia. Para estadias mais longas, ao 8º dia fornecemos gratuitamente troca de roupa e uma breve limpeza.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🗑️</span>O lixo - contentores</p><p class='info-item-text'>Existem numa rua mais abaixo contentores específicos para deixar o seu lixo. Localização: <a class='link' target='_blank' rel='noreferrer' href='https://maps.app.goo.gl/SYxqfTYpkznRy9Ky6'>Abrir localização</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🧾</span>TMT</p><p class='info-item-text'>Taxa turística municipal de Albufeira (2€ por pessoa/noite até máximo de 7 noites), conforme regulamento local. Se o valor do imposto não estiver incluído no valor total da sua reserva, terá de ser feito pagamento, mediante a informação que lhe for enviada.</p></div></div>"
          },
          rules: {
            title: "Regras da casa",
            subtitle: "Regras principais para uma estadia tranquila.",
            html: "<div class='rules-grid'><div class='rule-card'><p class='rule-num'>01</p><p class='rule-title'>Proibido fumar</p><p class='rule-text'>Por favor, não fume dentro do Apartamento. Utiliza o espaço exterior.</p></div><div class='rule-card'><p class='rule-num'>02</p><p class='rule-title'>Sem visitas</p><p class='rule-text'>Sem visitantes não registados. Informe o anfitrião se desejar adicionar convidados ao contrato de aluguer.</p></div><div class='rule-card'><p class='rule-num'>03</p><p class='rule-title'>Sem pets</p><p class='rule-text'>Não permitimos a presença de animais de estimação na propriedade em nenhum momento.</p></div><div class='rule-card'><p class='rule-num'>04</p><p class='rule-title'>Sem festas</p><p class='rule-text'>Não são permitidas festas ou eventos.</p></div><div class='rule-card'><p class='rule-num'>05</p><p class='rule-title'>Danos</p><p class='rule-text'>Por favor, informe imediatamente o anfitrião sobre qualquer dano ou mau funcionamento para que possamos reparar ou substituir o item danificado.</p></div><div class='rule-card'><p class='rule-num'>06</p><p class='rule-title'>Horas de silêncio</p><p class='rule-text'>Para o conforto e usufruto tanto de hóspedes como dos vizinhos, solicitamos que os níveis de ruído sejam reduzidos ao mínimo durante as horas de silêncio.</p></div></div>"
          },
          amenities: {
            title: "Comodidades",
            subtitle: "Equipamentos disponíveis no apartamento.",
            html: "<p class='amenities-intro'>O apartamento está equipado com todas as comodidades de que necessita para uma estadia confortável.</p><ul class='list amenities-list'><li>Wi-Fi</li><li>Televisão Inteligente (Smart TV)</li><li>Máquina de Café</li><li>Secador de Cabelo</li><li>Roupa de Cama</li><li>Toalhas de banho</li><li>Champô e Gel de Banho</li><li>Utensílios de Mesa e cozinha</li><li>Ar Condicionado</li><li>Máquina de Lavar Roupa</li></ul>"
          },

          safety: {
            title: "Segurança",
            subtitle: "Números de emergência e contactos úteis.",
            html: "<div class='safety-grid'><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Emergência</p><p class='safety-detail'>112</p><p class='safety-note'>Disponível 24h por dia, todos os dias.<br>O 112 é o número de telefone de emergência único europeu, disponível em toda a União Europeia.<br>As chamadas são gratuitas.</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>SNS24</p><p class='safety-detail'>808 24 24 24</p><p class='safety-note'>Disponível 24h por dia, todos os dias.<br>O 112 é o número de telefone de emergência único europeu, disponível em toda a União Europeia.<br>As chamadas são gratuitas.</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Hospital Lusíadas Albufeira</p><p class='safety-detail'>289 892 040</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Bombeiros</p><p class='safety-detail'>289 586 333</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Polícia</p><p class='safety-detail'>289 590 790</p></div></div>"

          visit: {
            title: "Visitação",
            subtitle: "9 pontos turísticos imperdíveis em Albufeira.",
            html: "<div class='info-sections'><div class='info-item'><p class='info-item-title'><span class='icon'>🏖️</span>Praia dos Pescadores</p><p class='info-item-text'>A praia mais icónica de Albufeira, a apenas 5 min a pé do apartamento. Rodeada pela arriba e pelo centro histórico, com águas azuis e tranquilas. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Praia+dos+Pescadores+Albufeira'>Ver no mapa</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏘️</span>Centro Histórico de Albufeira</p><p class='info-item-text'>Ruas de calçada portuguesa, casas caiadas de branco e praças animadas. Imperdível ao final do dia, com restaurantes típicos e vistas para o mar. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Centro+Historico+Albufeira'>Ver no mapa</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>⛵</span>Marina de Albufeira</p><p class='info-item-text'>Zona moderna com restaurantes, bares e ponto de partida das excursões de barco. A cerca de 3 km do apartamento. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Marina+de+Albufeira'>Ver no mapa</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🌅</span>Praia da Falésia</p><p class='info-item-text'>Uma das praias mais espetaculares do Algarve, com falésias alaranjadas que se estendem por mais de 5 km. A cerca de 10 km. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Praia+da+Falesia+Albufeira'>Ver no mapa</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🪨</span>Grutas de Benagil</p><p class='info-item-text'>Uma das grutas marinhas mais fotogénicas do mundo, com abertura natural no teto. Acesso de barco a partir da Marina de Albufeira — excursão indispensável. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Grutas+de+Benagil+Lagoa'>Ver no mapa</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏰</span>Castelo de Silves</p><p class='info-item-text'>Majestoso castelo mouro da época islâmica, a cerca de 30 km. Silves é uma das cidades históricas mais bonitas do Algarve. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Castelo+de+Silves'>Ver no mapa</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🐬</span>Zoomarine</p><p class='info-item-text'>Parque temático com shows de golfinhos, atrações aquáticas e espetáculos para toda a família. A apenas 5 km do apartamento. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Zoomarine+Albufeira'>Ver no mapa</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🎢</span>Slide &amp; Splash</p><p class='info-item-text'>Um dos melhores parques aquáticos da Europa, com escorregas para todas as idades. A cerca de 25 km, ideal para um dia em família. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Slide+Splash+Lagoa+Algarve'>Ver no mapa</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏄</span>Praia da Galé</p><p class='info-item-text'>Praia tranquila e familiar com águas cristalinas e arriba dourada. A cerca de 8 km, ideal para quem procura sossego. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Praia+da+Gale+Albufeira'>Ver no mapa</a></p></div></div>"
          },
          activities: {
            title: "Atividades",
            subtitle: "9 experiências imperdíveis para turistas em Albufeira.",
            html: "<div class='info-sections'><div class='info-item'><p class='info-item-title'><span class='icon'>🚤</span>Passeio de Barco às Grutas de Benagil</p><p class='info-item-text'>A excursão mais popular do Algarve. Parte da Marina de Albufeira para as famosas grutas marinhas, incluindo a icónica Gruta de Benagil com abertura natural no teto. Reserva com antecedência no verão.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🐬</span>Avistamento de Golfinhos</p><p class='info-item-text'>Saídas diárias a partir da Marina de Albufeira para observar golfinhos e outras espécies marinhas em liberdade no Atlântico. Experiência única e emocionante para toda a família.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏄</span>Surf, Bodyboard &amp; SUP</p><p class='info-item-text'>O Algarve tem ótimas condições para surf e bodyboard. Há escolas e aluguer de equipamento nas praias. O Stand-Up Paddle (SUP) é ideal para águas mais calmas e explorar as falésias de kayak.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🤿</span>Mergulho &amp; Snorkeling</p><p class='info-item-text'>Descobre o fundo do mar algarvio: grutas submersas, recifes e fauna marinha rica. Há centros de mergulho na Marina com aulas para iniciantes e mergulhos guiados.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🎣</span>Pesca Desportiva</p><p class='info-item-text'>Saídas de pesca a partir da Marina de Albufeira, com guia e equipamento incluído. Pesca à linha, pesca de fundo e pesca desportiva ao largo da costa algarvia.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🚶</span>Passeio pelo Centro Histórico</p><p class='info-item-text'>Explora as ruas de calçada, os miradouros com vistas para o mar, as igrejas e as praças típicas da Albufeira histórica. Imperdível ao pôr do sol, quando a luz dourada ilumina a cidade.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🚙</span>Jeep Safari &amp; Buggy Tour</p><p class='info-item-text'>Aventura off-road pelo interior algarvio: colinas, laranjais, aldeias tradicionais e paisagens deslumbrantes. Tours de meio-dia e dia completo saem de Albufeira todos os dias.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏖️</span>Dias de Praia</p><p class='info-item-text'>Com mais de 10 praias a menos de 15 km, há para todos os gostos: animadas com bar e atividades (Praia da Oura, Praia dos Pescadores) ou tranquilas e selvagens (Praia da Galé, Praia da Falésia).</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🚴</span>Ciclismo &amp; Caminhadas</p><p class='info-item-text'>A zona tem trilhos ao longo da costa e pelo interior. Aluguer de bicicletas disponível na cidade. A pé, o Percurso dos Sete Vales Suspensos (Lagoa) é um dos mais espetaculares do Algarve.</p></div></div>"

      en: {
        back: "← Back",
        fallbackTitle: "Information",
        fallbackSubtitle: "Topic not found.",
        sections: {
          welcome: { title: "Welcome", subtitle: "White Sand Apartments overview.", html: "<div class='welcome-layout'><p class='welcome-block'>White Sand Apartments, totally refurbished, with a modern decoration, of type T1, T2 and T0, located in one of the most privileged areas of Albufeira, close to all services and just 300 m from the beach! With all the amenities that these offer we want to provide you with a great experience to make your stay as comfortable as possible and above all that you rest and enjoy a beautiful vacation!</p><div class='welcome-image-slot'><img src='./welcome-all.png' alt='White Sand apartment'></div></div>" },
          check: { title: "Check-in", subtitle: "Arrival details.", html: "<p class='line'><strong>Check-in:</strong> from 16:00</p><p class='line'>The keys will be placed in a small lockbox at the building entrance, and you will receive the access code on your arrival day.</p><div class='checkin-gallery'><img src='./checkin-2.jpg' alt='Building entrance'><img src='./checkin-3.jpg' alt='Building location'><img src='./checkin-1.jpg' alt='Key lockbox'></div>" },
          location: { title: "Location", subtitle: "Address and map.", html: "<p class='line'><strong>Address:</strong> Rua do MFA, n.15 Apto (Your Apartment Letter), 8200-157 Albufeira</p><p class='line'><strong>Coordinates:</strong> 37.0891053, -8.2507170</p><p class='line'><a class='link' target='_blank' rel='noreferrer' href='https://goo.gl/maps/sj565hq985biABaD6'>Open in Google Maps</a></p><div class='extra-location'><p class='extra-location-text'>The apartments are located in the historic center of Albufeira, just a few minutes on foot from Praia dos Pescadores and other beaches. The location is excellent, with restaurants, bars, supermarkets, and shops all around, making it easy to do everything on foot. A few meters away you will also find the Old Town Square, typical Algarve streets, and viewpoints with incredible sea views. Ideal for those who want to enjoy the best of the city, combining beach and entertainment without needing a car.</p><div class='extra-location-images'><img src='./localizacao-1.jpg' alt='Beach in Albufeira'><img src='./localizacao-2.jpg' alt='Albufeira historic center'></div></div>" },
          info: { title: "Information", subtitle: "Important stay details.", html: "<div class='info-sections'><div class='info-item'><p class='info-item-title'><span class='icon'>🅿️</span>Parking</p><p class='info-item-text'>On our street and in the nearby area you can park for free (street parking). There is also a paid parking area 130 meters away. Parking location: <a class='link' target='_blank' rel='noreferrer' href='https://maps.app.goo.gl/gmK6iXghkyXu6mPLA'>Open location</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🧹</span>Cleaning service</p><p class='info-item-text'>We provide bed linen and bath towels for your stay. For longer stays, on the 8th day we provide a free linen change and a brief cleaning service.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🗑️</span>Waste bins</p><p class='info-item-text'>There are specific bins in a street below for you to dispose of your waste. Location: <a class='link' target='_blank' rel='noreferrer' href='https://maps.app.goo.gl/SYxqfTYpkznRy9Ky6'>Open location</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🧾</span>TMT</p><p class='info-item-text'>Municipal tourist tax in Albufeira (€2 per person/night up to a maximum of 7 nights), according to local regulations. If this tax is not included in your reservation total, payment will be required according to the information sent to you.</p></div></div>" },
          rules: { title: "House rules", subtitle: "Main rules for a peaceful stay.", html: "<div class='rules-grid'><div class='rule-card'><p class='rule-num'>01</p><p class='rule-title'>No smoking</p><p class='rule-text'>Please do not smoke or vape inside or around the apartment.</p></div><div class='rule-card'><p class='rule-num'>02</p><p class='rule-title'>No visitors</p><p class='rule-text'>No unregistered visitors. Please inform the host if you want to add extra guests to your booking.</p></div><div class='rule-card'><p class='rule-num'>03</p><p class='rule-title'>No pets</p><p class='rule-text'>Pets are not allowed on the property at any time.</p></div><div class='rule-card'><p class='rule-num'>04</p><p class='rule-title'>No parties</p><p class='rule-text'>Parties or events are not allowed.</p></div><div class='rule-card'><p class='rule-num'>05</p><p class='rule-title'>Damages</p><p class='rule-text'>Please report any damage or malfunction to the host immediately so we can repair or replace the affected item.</p></div><div class='rule-card'><p class='rule-num'>06</p><p class='rule-title'>Quiet hours</p><p class='rule-text'>For the comfort and enjoyment of both guests and neighbors, we kindly ask that noise levels be kept to a minimum during quiet hours.</p></div></div>" },
          amenities: { title: "Amenities", subtitle: "Apartment facilities available.", html: "<p class='amenities-intro'>The apartment is equipped with all the amenities you need for a comfortable stay.</p><ul class='list amenities-list'><li>Wi-Fi</li><li>Smart TV</li><li>Coffee Machine</li><li>Hair Dryer</li><li>Bed Linen</li><li>Bath Towels</li><li>Shampoo and Shower Gel</li><li>Tableware and Kitchen Utensils</li><li>Air Conditioning</li><li>Washing Machine</li></ul>" },
          wifi: { title: "Wi-Fi", subtitle: "Internet access details.", html: "<p class='wifi-note'>Network credentials are hidden until apartment-based access is activated.</p><div class='wifi-list'><div class='wifi-item'><p class='wifi-apt'>Apartment B</p><p class='wifi-meta'><strong>Network:</strong> Hidden</p><p class='wifi-meta'><strong>Password:</strong> Hidden</p><span class='wifi-lock'>🔒 Locked</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment C</p><p class='wifi-meta'><strong>Network:</strong> Hidden</p><p class='wifi-meta'><strong>Password:</strong> Hidden</p><span class='wifi-lock'>🔒 Locked</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment D</p><p class='wifi-meta'><strong>Network:</strong> Hidden</p><p class='wifi-meta'><strong>Password:</strong> Hidden</p><span class='wifi-lock'>🔒 Locked</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment E</p><p class='wifi-meta'><strong>Network:</strong> Hidden</p><p class='wifi-meta'><strong>Password:</strong> Hidden</p><span class='wifi-lock'>🔒 Locked</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment F</p><p class='wifi-meta'><strong>Network:</strong> Hidden</p><p class='wifi-meta'><strong>Password:</strong> Hidden</p><span class='wifi-lock'>🔒 Locked</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment G</p><p class='wifi-meta'><strong>Network:</strong> Hidden</p><p class='wifi-meta'><strong>Password:</strong> Hidden</p><span class='wifi-lock'>🔒 Locked</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment H</p><p class='wifi-meta'><strong>Network:</strong> Hidden</p><p class='wifi-meta'><strong>Password:</strong> Hidden</p><span class='wifi-lock'>🔒 Locked</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment I</p><p class='wifi-meta'><strong>Network:</strong> Hidden</p><p class='wifi-meta'><strong>Password:</strong> Hidden</p><span class='wifi-lock'>🔒 Locked</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment J</p><p class='wifi-meta'><strong>Network:</strong> Hidden</p><p class='wifi-meta'><strong>Password:</strong> Hidden</p><span class='wifi-lock'>🔒 Locked</span></div></div>" },
          safety: { title: "Safety", subtitle: "Emergency and useful contacts.", html: "<div class='safety-grid'><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Emergency</p><p class='safety-detail'>112</p><p class='safety-note'>Available 24 hours a day, every day.<br>112 is the single European emergency telephone number, available throughout the European Union.<br>Calls are free.</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Health line</p><p class='safety-detail'>808 24 24 24</p><p class='safety-note'>Available 24 hours a day, every day.<br>112 is the single European emergency telephone number, available throughout the European Union.<br>Calls are free.</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Lusíadas Hospital Albufeira</p><p class='safety-detail'>289 892 040</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Fire brigade</p><p class='safety-detail'>289 586 333</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Police</p><p class='safety-detail'>289 590 790</p></div></div>" },
          transport: { title: "Transport", subtitle: "How to arrive and move around." },
          visit: { title: "Sightseeing", subtitle: "9 must-see attractions in Albufeira.", html: "<div class='info-sections'><div class='info-item'><p class='info-item-title'><span class='icon'>🏖️</span>Praia dos Pescadores</p><p class='info-item-text'>Albufeira's most iconic beach, just a 5-min walk from the apartment. Nestled below the cliffs and the historic centre, with calm, crystal-blue waters. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Praia+dos+Pescadores+Albufeira'>View on map</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏘️</span>Albufeira Old Town</p><p class='info-item-text'>Cobblestone streets, whitewashed houses and lively squares. A must-see at sunset, with typical restaurants and sea views all around. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Centro+Historico+Albufeira'>View on map</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>⛵</span>Albufeira Marina</p><p class='info-item-text'>Modern waterfront area with restaurants, bars and the departure point for boat tours. About 3 km from the apartment. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Marina+de+Albufeira'>View on map</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🌅</span>Praia da Falésia</p><p class='info-item-text'>One of the Algarve's most spectacular beaches, with striking orange cliffs stretching over 5 km. About 10 km away. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Praia+da+Falesia+Albufeira'>View on map</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🪨</span>Benagil Caves</p><p class='info-item-text'>One of the world's most photogenic sea caves, with a natural skylight in the ceiling. Accessible by boat from Albufeira Marina — an unmissable excursion. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Grutas+de+Benagil+Lagoa'>View on map</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏰</span>Silves Castle</p><p class='info-item-text'>A majestic Moorish castle from the Islamic era, about 30 km away. Silves is one of the most beautiful historic towns in the Algarve. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Castelo+de+Silves'>View on map</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🐬</span>Zoomarine</p><p class='info-item-text'>Theme park with dolphin shows, water attractions and entertainment for the whole family. Just 5 km from the apartment. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Zoomarine+Albufeira'>View on map</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🎢</span>Slide &amp; Splash</p><p class='info-item-text'>One of Europe's best water parks, with slides for all ages. About 25 km away — perfect for a fun family day out. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Slide+Splash+Lagoa+Algarve'>View on map</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏄</span>Praia da Galé</p><p class='info-item-text'>A quiet, family-friendly beach with crystal-clear waters and golden cliffs. About 8 km away, ideal for a relaxed day at the sea. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Praia+da+Gale+Albufeira'>View on map</a></p></div></div>" },
          activities: { title: "Activities", subtitle: "9 must-do experiences for tourists in Albufeira.", html: "<div class='info-sections'><div class='info-item'><p class='info-item-title'><span class='icon'>🚤</span>Boat Trip to Benagil Caves</p><p class='info-item-text'>The most popular excursion in the Algarve. Departs from Albufeira Marina to the famous sea caves, including the iconic Benagil Cave with its natural skylight. Book in advance in summer.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🐬</span>Dolphin Watching</p><p class='info-item-text'>Daily tours departing from Albufeira Marina to spot dolphins and other marine wildlife in the Atlantic. A unique and exciting experience for the whole family.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏄</span>Surf, Bodyboard &amp; SUP</p><p class='info-item-text'>The Algarve offers great conditions for surfing and bodyboarding. Surf schools and equipment hire are available on the main beaches. Stand-Up Paddleboarding is perfect for calmer waters and cliff exploration.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🤿</span>Scuba Diving &amp; Snorkeling</p><p class='info-item-text'>Discover the Algarve's underwater world: submerged caves, reefs and rich marine life. Dive centres at the Marina offer beginner lessons and guided dives.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🎣</span>Sport Fishing</p><p class='info-item-text'>Fishing trips departing from Albufeira Marina with guide and equipment included. Line fishing, bottom fishing and deep-sea sport fishing along the Algarve coast.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🚶</span>Old Town Walk</p><p class='info-item-text'>Explore the cobblestone streets, sea-view viewpoints, churches and typical squares of historic Albufeira. A must at sunset, when the golden light illuminates the whole city.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🚙</span>Jeep Safari &amp; Buggy Tour</p><p class='info-item-text'>Off-road adventure through the Algarve countryside: orange groves, traditional villages and stunning landscapes. Half-day and full-day tours depart from Albufeira daily.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏖️</span>Beach Days</p><p class='info-item-text'>With over 10 beaches within 15 km, there is something for everyone: lively with beach bars and activities (Praia da Oura) or quiet and wild like Praia da Galé and Praia da Falésia.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🚴</span>Cycling &amp; Hiking</p><p class='info-item-text'>The Albufeira area has coastal and inland trails. Bike hire is available in town. On foot, the Seven Hanging Valleys Trail (Lagoa) is one of the most spectacular walks in the Algarve.</p></div></div>" },
          eat: { title: "Eat & Drink", subtitle: "Restaurants listed from cheapest to most expensive.", html: "<div class='rest-list'><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://maps.app.goo.gl/rA4cq7F3agYmyYcy6' target='_blank' rel='noreferrer'>Franguinho de Albufeira</a><span class='rest-price eco'>€</span></div><span class='rest-cuisine'>🍗 Charcoal chicken / Take-away</span><p class='rest-addr'>📍 Albufeira centre · <a class='link' href='https://maps.app.goo.gl/rA4cq7F3agYmyYcy6' target='_blank' rel='noreferrer'>View on map</a></p><p class='rest-menu-label'>Menu</p><div class='rest-tags'><span>Rotisserie chicken</span><span>French fries</span><span>Piri-piri</span><span>Salads</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://www.google.com/maps/search/?api=1&query=Copos+Petiscos+Albufeira' target='_blank' rel='noreferrer'>Copos &amp; Petiscos</a><span class='rest-price mid'>€€</span></div><span class='rest-cuisine'>🍷 Wine bar &amp; petiscos</span><p class='rest-addr'>📍 R. Alexandre Herculano, Albufeira · <a class='link' href='https://www.google.com/maps/search/?api=1&query=Copos+Petiscos+Albufeira' target='_blank' rel='noreferrer'>View on map</a></p><p class='rest-menu-label'>Menu</p><div class='rest-tags'><span>Petiscos</span><span>Charcuterie board</span><span>Cheeses</span><span>Selected wines</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://maps.app.goo.gl/w9gtzSM2WV5ixY5YA' target='_blank' rel='noreferrer'>Tasca do Viegas</a><span class='rest-price mid'>€€</span></div><span class='rest-cuisine'>🫙 Traditional Portuguese tavern</span><p class='rest-addr'>📍 Albufeira Old Town · <a class='link' href='https://maps.app.goo.gl/w9gtzSM2WV5ixY5YA' target='_blank' rel='noreferrer'>View on map</a></p><p class='rest-menu-label'>Menu</p><div class='rest-tags'><span>Petiscos</span><span>Steak sandwich</span><span>Bacalhau</span><span>Snails</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://www.google.com/maps/search/?api=1&query=Cepa+Velha+Albufeira' target='_blank' rel='noreferrer'>Cepa Velha</a><span class='rest-price mid'>€€</span></div><span class='rest-cuisine'>🍽️ Traditional Portuguese kitchen</span><p class='rest-addr'>📍 R. Vasco da Gama, Albufeira · <a class='link' href='https://www.google.com/maps/search/?api=1&query=Cepa+Velha+Albufeira' target='_blank' rel='noreferrer'>View on map</a></p><p class='rest-menu-label'>Menu</p><div class='rest-tags'><span>Cataplana</span><span>Bacalhau</span><span>Grilled fish &amp; meat</span><span>Sangria</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://maps.app.goo.gl/uXt8f8Lu8vPBQv7c6' target='_blank' rel='noreferrer'>Clay Oven</a><span class='rest-price mid'>€€</span></div><span class='rest-cuisine'>🍛 Indian cuisine</span><p class='rest-addr'>📍 Albufeira · <a class='link' href='https://maps.app.goo.gl/uXt8f8Lu8vPBQv7c6' target='_blank' rel='noreferrer'>View on map</a></p><p class='rest-menu-label'>Menu</p><div class='rest-tags'><span>Tikka Masala</span><span>Biryani</span><span>Naan</span><span>Curries</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://www.google.com/maps/search/?api=1&query=O+Lusitano+Albufeira' target='_blank' rel='noreferrer'>O Lusitano</a><span class='rest-price hi'>€€€</span></div><span class='rest-cuisine'>🍴 Modern Portuguese kitchen</span><p class='rest-addr'>📍 Urb. Quinta da Correeira, Albufeira · <a class='link' href='https://www.google.com/maps/search/?api=1&query=O+Lusitano+Albufeira' target='_blank' rel='noreferrer'>View on map</a></p><p class='rest-menu-label'>Menu</p><div class='rest-tags'><span>Monkfish cataplana</span><span>Duck magret</span><span>Portuguese steak</span><span>Bacalhau</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://maps.app.goo.gl/5GTwm6RyKvPDEC338' target='_blank' rel='noreferrer'>Taberna do Pescador</a><span class='rest-price hi'>€€€</span></div><span class='rest-cuisine'>🦞 Seafood &amp; Fresh fish</span><p class='rest-addr'>📍 Albufeira Old Town · <a class='link' href='https://maps.app.goo.gl/5GTwm6RyKvPDEC338' target='_blank' rel='noreferrer'>View on map</a></p><p class='rest-menu-label'>Menu</p><div class='rest-tags'><span>Clams</span><span>Goose barnacles</span><span>Cataplana</span><span>Fish of the day</span></div></div></div>" },
          bars: { title: "Bars & Clubs", subtitle: "Nightlife suggestions.", html: "<ul class='list'><li>Explore Oura and Old Town nightlife areas.</li><li>Ask us for updated bars and clubs recommendations.</li></ul>" },

      fr: {
        back: "← Retour",
        fallbackTitle: "Information",
        fallbackSubtitle: "Sujet introuvable.",
        sections: {
          welcome: { title: "Bienvenue", subtitle: "Resume de l'hebergement.", html: "<div class='welcome-layout'><p class='welcome-block'>Appartements White Sand, totalement rénovés, avec une décoration moderne, de type T1, T2 et T0, situés dans l'un des quartiers les plus privilégiés d'Albufeira, à proximité de tous les services et à seulement 300 m de la plage! Avec toutes les commodités que celles-ci offrent, nous voulons vous offrir une expérience formidable pour rendre votre séjour aussi confortable que possible et surtout que vous vous reposiez et passiez de belles vacances!</p><div class='welcome-image-slot'><img src='./welcome-all.png' alt='Appartement White Sand'></div></div>" },
          check: { title: "Check-in", subtitle: "Details d'arrivee.", html: "<p class='line'><strong>Check-in:</strong> a partir de 16:00</p><p class='line'>Les cles seront placees dans un petit coffre a l'entree de l'immeuble, et vous recevrez le code d'acces le jour de votre arrivee.</p><div class='checkin-gallery'><img src='./checkin-2.jpg' alt='Entree du batiment'><img src='./checkin-3.jpg' alt='Localisation de l entree'><img src='./checkin-1.jpg' alt='Boite a cles'></div>" },
          location: { title: "Localisation", subtitle: "Adresse et carte.", html: "<p class='line'><strong>Adresse:</strong> Rua do MFA, n.15 Apto (Lettre de votre appartement), 8200-157 Albufeira</p><p class='line'><strong>Coordonnees:</strong> 37.0891053, -8.2507170</p><p class='line'><a class='link' target='_blank' rel='noreferrer' href='https://goo.gl/maps/sj565hq985biABaD6'>Ouvrir sur Google Maps</a></p><div class='extra-location'><p class='extra-location-text'>Les appartements sont situes dans le centre historique d'Albufeira, a quelques minutes a pied de Praia dos Pescadores et d'autres plages. L'emplacement est excellent, avec des restaurants, bars, supermarches et boutiques tout autour, ce qui permet de tout faire a pied. A quelques metres, vous trouverez aussi la place de la vieille ville, des rues typiques de l'Algarve et des points de vue incroyables sur la mer. Ideal pour ceux qui veulent profiter du meilleur de la ville, entre plage et animation, sans avoir besoin de voiture.</p><div class='extra-location-images'><img src='./localizacao-1.jpg' alt='Plage a Albufeira'><img src='./localizacao-2.jpg' alt='Centre historique d Albufeira'></div></div>" },
          info: { title: "Information", subtitle: "Informations importantes du sejour.", html: "<div class='info-sections'><div class='info-item'><p class='info-item-title'><span class='icon'>🅿️</span>Parking</p><p class='info-item-text'>Dans notre rue et aux alentours, vous pouvez vous garer gratuitement (stationnement dans la rue). Il existe aussi un parking payant a 130 metres. Localisation du parking: <a class='link' target='_blank' rel='noreferrer' href='https://maps.app.goo.gl/gmK6iXghkyXu6mPLA'>Ouvrir la localisation</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🧹</span>Service de nettoyage</p><p class='info-item-text'>Nous fournissons les draps et les serviettes de bain pour votre sejour. Pour les sejours plus longs, au 8e jour nous offrons gratuitement un changement de linge et un bref nettoyage.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🗑️</span>Dechets - conteneurs</p><p class='info-item-text'>Dans une rue en dessous, vous trouverez des conteneurs specifiques pour deposer vos dechets. Localisation: <a class='link' target='_blank' rel='noreferrer' href='https://maps.app.goo.gl/SYxqfTYpkznRy9Ky6'>Ouvrir la localisation</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🧾</span>TMT</p><p class='info-item-text'>Taxe touristique municipale d'Albufeira (2€ par personne/nuit jusqu'a un maximum de 7 nuits), conformement au reglement local. Si cette taxe n'est pas incluse dans le montant total de votre reservation, le paiement devra etre effectue selon les informations qui vous seront envoyees.</p></div></div>" },
          rules: { title: "Regles de la maison", subtitle: "Regles principales pour un sejour paisible.", html: "<div class='rules-grid'><div class='rule-card'><p class='rule-num'>01</p><p class='rule-title'>Interdit de fumer</p><p class='rule-text'>Merci de ne pas fumer ni vapoter a l'interieur ou autour de l'appartement.</p></div><div class='rule-card'><p class='rule-num'>02</p><p class='rule-title'>Sans visites</p><p class='rule-text'>Aucun visiteur non enregistre. Informez l'hote si vous souhaitez ajouter des invites a la reservation.</p></div><div class='rule-card'><p class='rule-num'>03</p><p class='rule-title'>Sans animaux</p><p class='rule-text'>Les animaux de compagnie ne sont pas autorises dans la propriete.</p></div><div class='rule-card'><p class='rule-num'>04</p><p class='rule-title'>Sans fetes</p><p class='rule-text'>Les fetes ou evenements ne sont pas autorises.</p></div><div class='rule-card'><p class='rule-num'>05</p><p class='rule-title'>Dommages</p><p class='rule-text'>Veuillez signaler immediatement tout dommage ou dysfonctionnement a l'hote afin que nous puissions reparer ou remplacer l'article endommage.</p></div><div class='rule-card'><p class='rule-num'>06</p><p class='rule-title'>Heures de silence</p><p class='rule-text'>Pour le confort et le bien-etre des hotes et des voisins, nous vous demandons de reduire le bruit au minimum pendant les heures de silence.</p></div></div>" },
          amenities: { title: "Commodites", subtitle: "Equipements disponibles.", html: "<p class='amenities-intro'>L'appartement est equipe de toutes les commodites necessaires pour un sejour confortable.</p><ul class='list amenities-list'><li>Wi-Fi</li><li>Television intelligente (Smart TV)</li><li>Machine a cafe</li><li>Seche-cheveux</li><li>Linge de lit</li><li>Serviettes de bain</li><li>Shampooing et gel douche</li><li>Vaisselle et ustensiles de cuisine</li><li>Climatisation</li><li>Machine a laver</li></ul>" },
          wifi: { title: "Wi-Fi", subtitle: "Acces internet.", html: "<p class='wifi-note'>Les identifiants reseau sont masques jusqu'a l'activation de l'acces par appartement.</p><div class='wifi-list'><div class='wifi-item'><p class='wifi-apt'>Appartement B</p><p class='wifi-meta'><strong>Reseau:</strong> Masque</p><p class='wifi-meta'><strong>Mot de passe:</strong> Masque</p><span class='wifi-lock'>🔒 Verrouille</span></div><div class='wifi-item'><p class='wifi-apt'>Appartement C</p><p class='wifi-meta'><strong>Reseau:</strong> Masque</p><p class='wifi-meta'><strong>Mot de passe:</strong> Masque</p><span class='wifi-lock'>🔒 Verrouille</span></div><div class='wifi-item'><p class='wifi-apt'>Appartement D</p><p class='wifi-meta'><strong>Reseau:</strong> Masque</p><p class='wifi-meta'><strong>Mot de passe:</strong> Masque</p><span class='wifi-lock'>🔒 Verrouille</span></div><div class='wifi-item'><p class='wifi-apt'>Appartement E</p><p class='wifi-meta'><strong>Reseau:</strong> Masque</p><p class='wifi-meta'><strong>Mot de passe:</strong> Masque</p><span class='wifi-lock'>🔒 Verrouille</span></div><div class='wifi-item'><p class='wifi-apt'>Appartement F</p><p class='wifi-meta'><strong>Reseau:</strong> Masque</p><p class='wifi-meta'><strong>Mot de passe:</strong> Masque</p><span class='wifi-lock'>🔒 Verrouille</span></div><div class='wifi-item'><p class='wifi-apt'>Appartement G</p><p class='wifi-meta'><strong>Reseau:</strong> Masque</p><p class='wifi-meta'><strong>Mot de passe:</strong> Masque</p><span class='wifi-lock'>🔒 Verrouille</span></div><div class='wifi-item'><p class='wifi-apt'>Appartement H</p><p class='wifi-meta'><strong>Reseau:</strong> Masque</p><p class='wifi-meta'><strong>Mot de passe:</strong> Masque</p><span class='wifi-lock'>🔒 Verrouille</span></div><div class='wifi-item'><p class='wifi-apt'>Appartement I</p><p class='wifi-meta'><strong>Reseau:</strong> Masque</p><p class='wifi-meta'><strong>Mot de passe:</strong> Masque</p><span class='wifi-lock'>🔒 Verrouille</span></div><div class='wifi-item'><p class='wifi-apt'>Appartement J</p><p class='wifi-meta'><strong>Reseau:</strong> Masque</p><p class='wifi-meta'><strong>Mot de passe:</strong> Masque</p><span class='wifi-lock'>🔒 Verrouille</span></div></div>" },
          safety: { title: "Securite", subtitle: "Urgences et contacts utiles.", html: "<div class='safety-grid'><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Urgence</p><p class='safety-detail'>112</p><p class='safety-note'>Disponible 24h/24, tous les jours.<br>Le 112 est le numéro d'urgence européen unique, disponible dans toute l'Union européenne.<br>Les appels sont gratuits.</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Ligne sante</p><p class='safety-detail'>808 24 24 24</p><p class='safety-note'>Disponible 24h/24, tous les jours.<br>Le 112 est le numéro d'urgence européen unique, disponible dans toute l'Union européenne.<br>Les appels sont gratuits.</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Hopital Lusíadas Albufeira</p><p class='safety-detail'>289 892 040</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Pompiers</p><p class='safety-detail'>289 586 333</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Police</p><p class='safety-detail'>289 590 790</p></div></div>" },

          visit: { title: "Visite", subtitle: "9 incontournables a Albufeira.", html: "<div class='info-sections'><div class='info-item'><p class='info-item-title'><span class='icon'>🏖️</span>Praia dos Pescadores</p><p class='info-item-text'>La plage la plus emblematique d'Albufeira, a seulement 5 min a pied de l'appartement. Nichee sous les falaises et le centre historique, avec des eaux calmes et bleues. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Praia+dos+Pescadores+Albufeira'>Voir sur la carte</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏘️</span>Vieille ville d'Albufeira</p><p class='info-item-text'>Rues pavees, maisons blanches et places animees. A decouvrir au coucher du soleil, avec des restaurants typiques et des vues sur la mer. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Centro+Historico+Albufeira'>Voir sur la carte</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>⛵</span>Marina d'Albufeira</p><p class='info-item-text'>Zone moderne avec restaurants, bars et point de depart des excursions en bateau. A environ 3 km de l'appartement. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Marina+de+Albufeira'>Voir sur la carte</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🌅</span>Praia da Falésia</p><p class='info-item-text'>L'une des plages les plus spectaculaires de l'Algarve, avec des falaises orangees s'etendant sur plus de 5 km. A environ 10 km. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Praia+da+Falesia+Albufeira'>Voir sur la carte</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🪨</span>Grottes de Benagil</p><p class='info-item-text'>L'une des grottes marines les plus photographiees au monde, avec une ouverture naturelle dans le plafond. Acces en bateau depuis la Marina — excursion incontournable. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Grutas+de+Benagil+Lagoa'>Voir sur la carte</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏰</span>Chateau de Silves</p><p class='info-item-text'>Un majestueux chateau maure de l'epoque islamique, a environ 30 km. Silves est l'une des plus belles villes historiques de l'Algarve. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Castelo+de+Silves'>Voir sur la carte</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🐬</span>Zoomarine</p><p class='info-item-text'>Parc a theme avec spectacles de dauphins, attractions aquatiques et divertissements pour toute la famille. A seulement 5 km. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Zoomarine+Albufeira'>Voir sur la carte</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🎢</span>Slide &amp; Splash</p><p class='info-item-text'>L'un des meilleurs parcs aquatiques d'Europe, avec des toboggans pour tous les ages. A environ 25 km, ideal pour une journee en famille. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Slide+Splash+Lagoa+Algarve'>Voir sur la carte</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏄</span>Praia da Galé</p><p class='info-item-text'>Une plage tranquille et familiale avec des eaux cristallines et de belles falaises dorees. A environ 8 km, ideale pour se ressourcer au bord de la mer. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Praia+da+Gale+Albufeira'>Voir sur la carte</a></p></div></div>" },
          activities: { title: "Activites", subtitle: "9 experiences incontournables a Albufeira.", html: "<div class='info-sections'><div class='info-item'><p class='info-item-title'><span class='icon'>🚤</span>Excursion en Bateau aux Grottes de Benagil</p><p class='info-item-text'>L'excursion la plus populaire de l'Algarve. Depart depuis la Marina d'Albufeira vers les fameuses grottes marines, dont l'iconique Grotte de Benagil. Reservez a l'avance en ete.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🐬</span>Observation des Dauphins</p><p class='info-item-text'>Sorties quotidiennes depuis la Marina d'Albufeira pour observer les dauphins et autres especes marines dans l'Atlantique. Une experience unique et inoubliable pour toute la famille.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏄</span>Surf, Bodyboard &amp; SUP</p><p class='info-item-text'>L'Algarve offre d'excellentes conditions pour le surf et le bodyboard. Des ecoles et des locations sont disponibles sur les plages. Le paddle (SUP) est ideal pour les eaux calmes et les falaises.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🤿</span>Plongee &amp; Snorkeling</p><p class='info-item-text'>Decouvrez les fonds marins de l'Algarve: grottes sous-marines, recifs et riche faune marine. Des centres de plongee a la Marina proposent des cours pour debutants et des plongees guidees.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🎣</span>Peche Sportive</p><p class='info-item-text'>Sorties de peche depuis la Marina d'Albufeira avec guide et materiel inclus. Peche a la ligne, peche de fond et peche sportive au large de la cote algarvienne.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🚶</span>Balade dans la Vieille Ville</p><p class='info-item-text'>Explorez les ruelles pavees, les belvederes avec vue sur la mer, les eglises et les places typiques d'Albufeira. A ne pas manquer au coucher du soleil.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🚙</span>Safari en Jeep &amp; Tour en Buggy</p><p class='info-item-text'>Aventure tout-terrain dans les collines de l'Algarve: orangeraies, villages traditionnels et paysages magnifiques. Des circuits demi-journee et journee complete partent d'Albufeira tous les jours.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏖️</span>Journees de Plage</p><p class='info-item-text'>Avec plus de 10 plages a moins de 15 km, il y en a pour tous les gouts: animees avec bars et activites (Praia da Oura) ou tranquilles et sauvages comme Praia da Galé et Praia da Falésia.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🚴</span>Velo &amp; Randonnee</p><p class='info-item-text'>La region d'Albufeira dispose de sentiers cotiers et interieurs. Location de velos disponible en ville. A pied, le Percurso dos Sete Vales Suspensos est l'un des plus spectaculaires de l'Algarve.</p></div></div>" },
          eat: { title: "Manger & Boire", subtitle: "Restaurants triés du moins cher au plus cher.", html: "<div class='rest-list'><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://maps.app.goo.gl/rA4cq7F3agYmyYcy6' target='_blank' rel='noreferrer'>Franguinho de Albufeira</a><span class='rest-price eco'>€</span></div><span class='rest-cuisine'>🍗 Poulet grillé / À emporter</span><p class='rest-addr'>📍 Centre d'Albufeira · <a class='link' href='https://maps.app.goo.gl/rA4cq7F3agYmyYcy6' target='_blank' rel='noreferrer'>Voir sur la carte</a></p><p class='rest-menu-label'>Menu</p><div class='rest-tags'><span>Poulet rôti</span><span>Frites</span><span>Piri-piri</span><span>Salades</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://www.google.com/maps/search/?api=1&query=Copos+Petiscos+Albufeira' target='_blank' rel='noreferrer'>Copos &amp; Petiscos</a><span class='rest-price mid'>€€</span></div><span class='rest-cuisine'>🍷 Bar à vins &amp; petiscos</span><p class='rest-addr'>📍 R. Alexandre Herculano, Albufeira · <a class='link' href='https://www.google.com/maps/search/?api=1&query=Copos+Petiscos+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a></p><p class='rest-menu-label'>Menu</p><div class='rest-tags'><span>Petiscos</span><span>Plateau charcuterie</span><span>Fromages</span><span>Vins sélectionnés</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://maps.app.goo.gl/w9gtzSM2WV5ixY5YA' target='_blank' rel='noreferrer'>Tasca do Viegas</a><span class='rest-price mid'>€€</span></div><span class='rest-cuisine'>🫙 Taverne portugaise traditionnelle</span><p class='rest-addr'>📍 Vieille ville d'Albufeira · <a class='link' href='https://maps.app.goo.gl/w9gtzSM2WV5ixY5YA' target='_blank' rel='noreferrer'>Voir sur la carte</a></p><p class='rest-menu-label'>Menu</p><div class='rest-tags'><span>Petiscos</span><span>Sandwich au steak</span><span>Bacalhau</span><span>Escargots</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://www.google.com/maps/search/?api=1&query=Cepa+Velha+Albufeira' target='_blank' rel='noreferrer'>Cepa Velha</a><span class='rest-price mid'>€€</span></div><span class='rest-cuisine'>🍽️ Cuisine portugaise traditionnelle</span><p class='rest-addr'>📍 R. Vasco da Gama, Albufeira · <a class='link' href='https://www.google.com/maps/search/?api=1&query=Cepa+Velha+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a></p><p class='rest-menu-label'>Menu</p><div class='rest-tags'><span>Cataplana</span><span>Bacalhau</span><span>Grillades</span><span>Sangria</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://maps.app.goo.gl/uXt8f8Lu8vPBQv7c6' target='_blank' rel='noreferrer'>Clay Oven</a><span class='rest-price mid'>€€</span></div><span class='rest-cuisine'>🍛 Cuisine indienne</span><p class='rest-addr'>📍 Albufeira · <a class='link' href='https://maps.app.goo.gl/uXt8f8Lu8vPBQv7c6' target='_blank' rel='noreferrer'>Voir sur la carte</a></p><p class='rest-menu-label'>Menu</p><div class='rest-tags'><span>Tikka Masala</span><span>Biryani</span><span>Naan</span><span>Currys</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://www.google.com/maps/search/?api=1&query=O+Lusitano+Albufeira' target='_blank' rel='noreferrer'>O Lusitano</a><span class='rest-price hi'>€€€</span></div><span class='rest-cuisine'>🍴 Cuisine portugaise moderne</span><p class='rest-addr'>📍 Urb. Quinta da Correeira, Albufeira · <a class='link' href='https://www.google.com/maps/search/?api=1&query=O+Lusitano+Albufeira' target='_blank' rel='noreferrer'>Voir sur la carte</a></p><p class='rest-menu-label'>Menu</p><div class='rest-tags'><span>Cataplana de lotte</span><span>Magret de canard</span><span>Steak portugais</span><span>Bacalhau</span></div></div><div class='rest-card'><
