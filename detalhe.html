          visit: { title: "Orte zum Besuchen", subtitle: "11 Sehenswuerdigkeiten in Albufeira.", html: "<div class='place-grid'><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/6/6a/15-09-2017_Praia_dos_Pescadores%2C_Albufeira_%283%29.JPG)'></div><div class='place-body'><p class='place-name'>🏖️ Praia dos Pescadores</p><p class='place-desc'>Albufeiras bekanntester Strand, nur 5 Gehminuten entfernt. Ruhiges, klares Wasser unterhalb der Altstadt.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Praia+dos+Pescadores+Albufeira' target='_blank' rel='noreferrer'>Auf der Karte anzeigen</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/4/4b/Jardim_P%C3%BAblico_Albufeira_25_March_2015_%281%29.JPG)'></div><div class='place-body'><p class='place-name'>🏘️ Altstadt von Albufeira</p><p class='place-desc'>Kopfsteinpflasterstrassen, weiss gekalkte Haeuser und lebhafte Plaetze. Unbedingt bei Sonnenuntergang besuchen.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Centro+Historico+Albufeira' target='_blank' rel='noreferrer'>Auf der Karte anzeigen</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/a/a3/Marina_de_Albufeira_-_Portugal_%2853496631781%29.jpg)'></div><div class='place-body'><p class='place-name'>⛵ Marina von Albufeira</p><p class='place-desc'>Moderner Bereich mit Restaurants, Bars und Ausgangspunkt fuer Bootstouren. Etwa 3 km entfernt.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Marina+de+Albufeira' target='_blank' rel='noreferrer'>Auf der Karte anzeigen</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Falesia_Beach_seen_from_sea.JPG/330px-Falesia_Beach_seen_from_sea.JPG)'></div><div class='place-body'><p class='place-name'>🌅 Praia da Falésia</p><p class='place-desc'>Orangefarbene Klippen auf ueber 5 km. Einer der spektakulaersten Straende der Algarve, ca. 10 km entfernt.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Praia+da+Falesia+Albufeira' target='_blank' rel='noreferrer'>Auf der Karte anzeigen</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/a/ac/A_Catedral_de_Benagil.JPG)'></div><div class='place-body'><p class='place-name'>🪨 Benagil-Hoehlen</p><p class='place-desc'>Eine der meistfotografierten Meereshoehlen der Welt, mit natuerlicher Oeffnung im Dach. Per Boot von der Marina erreichbar.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Grutas+de+Benagil+Lagoa' target='_blank' rel='noreferrer'>Auf der Karte anzeigen</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/Castelo_de_Silves_-_Algarve%2C_Portugal_-_11.03.2023.jpg/330px-Castelo_de_Silves_-_Algarve%2C_Portugal_-_11.03.2023.jpg)'></div><div class='place-body'><p class='place-name'>🏰 Burg Silves</p><p class='place-desc'>Majestätische maurische Burg aus der islamischen Aera, ca. 30 km. Eine der schoensten historischen Staedte der Algarve.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Castelo+de+Silves' target='_blank' rel='noreferrer'>Auf der Karte anzeigen</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/c/c3/Zoomarine_Algarve_15.JPG)'></div><div class='place-body'><p class='place-name'>🐬 Zoomarine</p><p class='place-desc'>Freizeitpark mit Delfinshows, Wasserattraktionen und Unterhaltung fuer die ganze Familie. Nur 5 km entfernt.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Zoomarine+Albufeira' target='_blank' rel='noreferrer'>Auf der Karte anzeigen</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/2/29/Slide_%26_Splash_Algarve.jpg)'></div><div class='place-body'><p class='place-name'>🎢 Slide &amp; Splash</p><p class='place-desc'>Einer der besten Wasserparks Europas, mit Rutschen fuer jedes Alter. Ca. 25 km entfernt.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Slide+Splash+Lagoa+Algarve' target='_blank' rel='noreferrer'>Auf der Karte anzeigen</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/d/d0/119PT_13_November_2013_Praia_da_Gal%C3%A9.JPG)'></div><div class='place-body'><p class='place-name'>🏄 Praia da Galé</p><p class='place-desc'>Ruhiger, familienfreundlicher Strand mit kristallklarem Wasser und goldenen Klippen. Ideal zur Erholung, 8 km entfernt.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Praia+da+Gale+Albufeira' target='_blank' rel='noreferrer'>Auf der Karte anzeigen</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Cacela_Velha_Fortress2.jpg/330px-Cacela_Velha_Fortress2.jpg)'></div><div class='place-body'><p class='place-name'>🏰 Cacela Velha</p><p class='place-desc'>Erhaltenes Dorf mit Fort aus dem 18. Jhd. und Kirche von 1583. Atemberaubende Aussicht ueber die Ria Formosa. Ca. 50 km.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Cacela+Velha+Algarve' target='_blank' rel='noreferrer'>Auf der Karte anzeigen</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/e/e0/Olhao_Portugal_aerial_view.jpg)'></div><div class='place-body'><p class='place-name'>🏝️ Inseln der Ria Formosa</p><p class='place-desc'>Naturpark, der zu den 7 Naturwundern Portugals gewaehlt wurde. Einsame Inseln, Lagunen und Felsenpools. Faehre ab Faro/Olhao.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Parque+Natural+Ria+Formosa+Olhao' target='_blank' rel='noreferrer'>Auf der Karte anzeigen</a></div></div></div>" },
          activities: { title: "Aktivitaeten", subtitle: "11 unverzichtbare Erlebnisse in Albufeira.", html: "<div class='place-grid'><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/b/b0/02-05-2017_Algar_de_Benagil_%281%29.JPG)'></div><div class='place-body'><p class='place-name'>🚤 Bootsfahrt zu den Benagil-Höhlen</p><p class='place-desc'>Der beliebteste Ausflug der Algarve. Abfahrt vom Hafen Albufeira zu den berühmten Meereshöhlen, darunter die ikonische Benagil-Höhle mit Naturöffnung im Dach. Im Sommer vorher buchen.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Marina+Albufeira+Bootsfahrt' target='_blank' rel='noreferrer'>Auf der Karte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/1/13/DuskyDolphin.jpg)'></div><div class='place-body'><p class='place-name'>🐬 Delfinbeobachtung</p><p class='place-desc'>Tägliche Ausfahrten vom Hafen Albufeira zur Beobachtung von Delfinen im Atlantik. Ein einzigartiges und aufregendes Erlebnis für die ganze Familie.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Marina+de+Albufeira' target='_blank' rel='noreferrer'>Auf der Karte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/8/89/Surfing_on_Praia_da_Arrifana.jpg)'></div><div class='place-body'><p class='place-name'>🏄 Surfen, Bodyboard &amp; SUP</p><p class='place-desc'>Die Algarve bietet hervorragende Bedingungen für Surfen. Surfschulen und Ausrüstungsverleih an den Stränden. Stand-Up-Paddeln ist ideal für ruhigere Gewässer.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Surfschule+Albufeira' target='_blank' rel='noreferrer'>Auf der Karte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/e/e2/SHADES_OF_BLUE_%283522593783%29.jpg)'></div><div class='place-body'><p class='place-name'>🤿 Tauchen &amp; Schnorcheln</p><p class='place-desc'>Entdecke die Unterwasserwelt der Algarve: Unterwasserhöhlen, Riffe und Meereslebewesen. Tauchzentren im Hafen bieten Anfängerkurse und geführte Tauchgänge.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Tauchzentrum+Albufeira' target='_blank' rel='noreferrer'>Auf der Karte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/e/ea/Fishing_boat_at_sunrise%2C_Luz_%2851881716321%29.jpg)'></div><div class='place-body'><p class='place-name'>🎣 Sportfischen</p><p class='place-desc'>Angelausflüge vom Hafen Albufeira mit Führer und Ausrüstung. Angeln, Grundangeln und Hochseeangeln entlang der Algarve-Küste.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Sportfischen+Marina+Albufeira' target='_blank' rel='noreferrer'>Auf der Karte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/4/4b/Jardim_P%C3%BAblico_Albufeira_25_March_2015_%281%29.JPG)'></div><div class='place-body'><p class='place-name'>🚶 Spaziergang durch die Altstadt</p><p class='place-desc'>Erkunde die Kopfsteinpflasterstraßen, Aussichtspunkte mit Meerblick und typische Plätze des historischen Albufeira. Unvergesslich beim Sonnenuntergang.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Altstadt+Albufeira' target='_blank' rel='noreferrer'>Auf der Karte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/3/3f/Jeep_Safari_Algarve_-_panoramio.jpg)'></div><div class='place-body'><p class='place-name'>🚙 Jeep-Safari &amp; Buggy-Tour</p><p class='place-desc'>Geländeabenteuer durch das Algarve-Hinterland: Hügel, Orangenplantagen, traditionelle Dörfer und atemberaubende Landschaften. Tagestouren ab Albufeira.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Jeep+Safari+Albufeira' target='_blank' rel='noreferrer'>Auf der Karte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/6/6a/15-09-2017_Praia_dos_Pescadores%2C_Albufeira_%283%29.JPG)'></div><div class='place-body'><p class='place-name'>🏖️ Strandtage</p><p class='place-desc'>Mit über 10 Stränden innerhalb von 15 km ist für jeden etwas dabei: lebhafte Strände (Praia da Oura) oder ruhige Naturstrände (Praia da Galé, Praia da Falésia).</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Straende+Albufeira' target='_blank' rel='noreferrer'>Auf der Karte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/a/ad/Miradouro_do_Vale_Suspenso_-_viewpoint_of_the_Suspension_Valley_%2852859674883%29.jpg)'></div><div class='place-body'><p class='place-name'>🚴 Radfahren &amp; Wandern</p><p class='place-desc'>Küsten- und Inlandwanderwege in der Region. Fahrradverleih in der Stadt. Zu Fuß ist der Sieben-Täler-Weg (Lagoa) einer der spektakulärsten Wanderwege der Algarve.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Sieben+Haengetaeler+Lagoa+Algarve' target='_blank' rel='noreferrer'>Auf der Karte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/c/c2/Rua_C%C3%A2ndido_dos_Reis%2C_Albufeira.jpg)'></div><div class='place-body'><p class='place-name'>🍹 Nachtleben — Praia da Oura</p><p class='place-desc'>Bekannt als &quot;The Strip&quot; — Albufeiras wichtigstes Nachtleben-Viertel. Bars, Pubs und Clubs geöffnet bis in die frühen Morgenstunden. Etwa 3 km entfernt.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=The+Strip+Praia+da+Oura+Albufeira' target='_blank' rel='noreferrer'>Auf der Karte</a></div></div><div class='place-card'><div class='place-thumb' style='background-image:url(https://upload.wikimedia.org/wikipedia/commons/a/a3/Marina_de_Albufeira_-_Portugal_%2853496631781%29.jpg)'></div><div class='place-body'><p class='place-name'>🌙 Nachtleben — Praia dos Pescadores</p><p class='place-desc'>Das historische Zentrum nahe Praia dos Pescadores bietet authentischeres Nachtleben: Terrassen mit Meerblick und Live-Musik. 5 Gehminuten von der Unterkunft.</p><a class='link' href='https://www.google.com/maps/search/?api=1&amp;query=Praia+dos+Pescadores+Albufeira' target='_blank' rel='noreferrer'>Auf der Karte</a></div></div></div>" },

    function setupTransportTabs() {
      const root = document.querySelector(".transport-tabs");
      if (!root) return;
      const tabs = Array.from(root.querySelectorAll(".transport-tab"));
      const panels = Array.from(root.querySelectorAll(".transport-panel"));
      const activate = (i) => {
        tabs.forEach((btn, j) => {
          btn.classList.toggle("transport-tab--active", j === i);
          btn.setAttribute("aria-selected", j === i ? "true" : "false");
        });
        panels.forEach((p, j) => p.classList.toggle("transport-panel--active", j === i));
      };
      tabs.forEach((btn, i) => {
        btn.addEventListener("click", () => activate(i));
      });
    }

    function renderWifiSection(currentLang) {
      const t = wifiUi[currentLang] || wifiUi.pt;
      const cards = wifiApts.map((apt) =>
        `<div class='wifi-item'><p class='wifi-apt'>${t.apt} ${apt}</p><p class='wifi-meta'><strong>${t.network}</strong> ${t.hidden}</p><p class='wifi-meta'><strong>${t.password}</strong> ${t.hidden}</p><span class='wifi-lock'>${t.locked}</span><br><a class='wifi-btn' href='./wifi-acesso.html?apt=${apt}&lang=${currentLang}'>${t.button}</a></div>`
      ).join("");
      return `<p class='wifi-note'>${t.note}</p><div class='wifi-list'>${cards}</div>`;
    }

    function render() {
      const dict = text[lang];
      const item = dict.sections[sec];
      const title = document.getElementById("title");
      const subtitle = document.getElementById("subtitle");
      const content = document.getElementById("content");
      const back = document.querySelector(".back");

      back.textContent = dict.back;
      back.href = `./?lang=${lang}`;

      if (!item) {
        title.textContent = dict.fallbackTitle;
        subtitle.textContent = dict.fallbackSubtitle;
        content.innerHTML = "";
      } else {
        title.textContent = item.title;
        subtitle.textContent = item.subtitle;
        if (sec === "wifi") {
          content.innerHTML = renderWifiSection(lang);
        } else if (sec === "transport") {
          content.innerHTML = renderTransportSection(lang);
          setupTransportTabs();
        } else {
          content.innerHTML = item.html;
        }
      }

      document.documentElement.lang = lang === "pt" ? "pt-PT" : lang;
      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });
    }

    document.querySelectorAll(".lang-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        lang = btn.dataset.lang;
        const url = new URL(window.location.href);
        url.searchParams.set("lang", lang);
        window.history.replaceState({}, "", url);
        render();
      });
    });

    render();
  </script>
