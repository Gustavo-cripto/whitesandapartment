        sections: {
          welcome: { title: "Bienvenido", subtitle: "Resumen del alojamiento White Sand Apartments.", html: "<div class='welcome-layout'><p class='welcome-block'>Apartamentos White Sand, totalmente reformados, con una decoración moderna, de tipo T1, T2 y T0, situados en una de las zonas más privilegiadas de Albufeira, cerca de todos los servicios y a tan solo 300 m de la playa! Con todas las comodidades que estos ofrecen queremos brindarte una gran experiencia para que tu estadía sea lo más cómoda posible y sobre todo que descanses y disfrutes de unas hermosas vacaciones!</p><div class='welcome-image-slot'><img src='./welcome-all.png' alt='Apartamento White Sand'></div></div>" },
          check: { title: "Check-in", subtitle: "Detalles de llegada.", html: "<p class='line'><strong>Check-in:</strong> a partir de las 16:00</p><p class='line'>Las llaves se colocaran en una pequena caja de seguridad en la entrada del edificio, y recibiras el codigo de acceso el dia de tu llegada.</p><div class='checkin-gallery'><img src='./checkin-2.jpg' alt='Entrada del edificio'><img src='./checkin-3.jpg' alt='Ubicacion de entrada'><img src='./checkin-1.jpg' alt='Caja de llaves'></div>" },
          location: { title: "Ubicacion", subtitle: "Direccion y mapa.", html: "<p class='line'><strong>Direccion:</strong> Rua do MFA, n.15 Apto (Letra de su apartamento), 8200-157 Albufeira</p><p class='line'><strong>Coordenadas:</strong> 37.0891053, -8.2507170</p><p class='line'><a class='link' target='_blank' rel='noreferrer' href='https://goo.gl/maps/sj565hq985biABaD6'>Abrir en Google Maps</a></p><div class='extra-location'><p class='extra-location-text'>Los apartamentos estan ubicados en el centro historico de Albufeira, a pocos minutos a pie de Praia dos Pescadores y de otras playas. La ubicacion es excelente, con restaurantes, bares, supermercados y tiendas alrededor, permitiendo hacer todo a pie. A pocos metros tambien encontraras la Plaza del Casco Antiguo, calles tipicas del Algarve y miradores con vistas increibles al mar. Ideal para quien quiere aprovechar lo mejor de la ciudad, entre playa y animacion, sin necesidad de coche.</p><div class='extra-location-images'><img src='./localizacao-1.jpg' alt='Playa en Albufeira'><img src='./localizacao-2.jpg' alt='Centro historico de Albufeira'></div></div>" },
          info: { title: "Informacion", subtitle: "Datos importantes para la estancia.", html: "<div class='info-sections'><div class='info-item'><p class='info-item-title'><span class='icon'>🅿️</span>Aparcamiento</p><p class='info-item-text'>En nuestra calle y en los alrededores podras aparcar gratuitamente (aparcamiento en la calle). Tambien hay un aparcamiento de pago a 130 metros. Ubicacion del aparcamiento: <a class='link' target='_blank' rel='noreferrer' href='https://maps.app.goo.gl/gmK6iXghkyXu6mPLA'>Abrir ubicacion</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🧹</span>Servicio de limpieza</p><p class='info-item-text'>Proporcionamos ropa de cama y toallas de bano para su estancia. Para estancias mas largas, en el 8o dia ofrecemos gratuitamente cambio de ropa y una breve limpieza.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🗑️</span>Basura - contenedores</p><p class='info-item-text'>En una calle mas abajo hay contenedores especificos para dejar su basura. Ubicacion: <a class='link' target='_blank' rel='noreferrer' href='https://maps.app.goo.gl/SYxqfTYpkznRy9Ky6'>Abrir ubicacion</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🧾</span>TMT</p><p class='info-item-text'>Tasa turistica municipal de Albufeira (2€ por persona/noche hasta un maximo de 7 noches), conforme a la normativa local. Si este impuesto no esta incluido en el importe total de su reserva, el pago debera realizarse segun la informacion que se le enviara.</p></div></div>" },
          rules: { title: "Normas de la casa", subtitle: "Normas principales para una estancia tranquila.", html: "<div class='rules-grid'><div class='rule-card'><p class='rule-num'>01</p><p class='rule-title'>Prohibido fumar</p><p class='rule-text'>Por favor, no fume ni vapee dentro o en los alrededores del apartamento.</p></div><div class='rule-card'><p class='rule-num'>02</p><p class='rule-title'>Sin visitas</p><p class='rule-text'>No se permiten visitas no registradas. Informe al anfitrion si desea agregar huespedes a su reserva.</p></div><div class='rule-card'><p class='rule-num'>03</p><p class='rule-title'>Sin mascotas</p><p class='rule-text'>No se permiten mascotas en la propiedad en ningun momento.</p></div><div class='rule-card'><p class='rule-num'>04</p><p class='rule-title'>Sin fiestas</p><p class='rule-text'>No se permiten fiestas ni eventos.</p></div><div class='rule-card'><p class='rule-num'>05</p><p class='rule-title'>Danos</p><p class='rule-text'>Por favor, informe de inmediato al anfitrion sobre cualquier dano o averia para poder reparar o sustituir el elemento afectado.</p></div><div class='rule-card'><p class='rule-num'>06</p><p class='rule-title'>Horas de silencio</p><p class='rule-text'>Para la comodidad y disfrute tanto de los huespedes como de los vecinos, solicitamos que los niveles de ruido se mantengan al minimo durante las horas de silencio.</p></div></div>" },
          amenities: { title: "Comodidades", subtitle: "Equipamiento disponible en el apartamento.", html: "<p class='amenities-intro'>El apartamento está equipado con todas las comodidades que necesita para una estancia cómoda.</p><ul class='list amenities-list'><li>Wi-Fi</li><li>Televisión Inteligente (Smart TV)</li><li>Máquina de Café</li><li>Secador de Pelo</li><li>Ropa de Cama</li><li>Toallas de baño</li><li>Champú y Gel de Ducha</li><li>Utensilios de Mesa y Cocina</li><li>Aire Acondicionado</li><li>Lavadora</li></ul>" },
          wifi: { title: "Wi-Fi", subtitle: "Datos de conexion a internet.", html: "<p class='wifi-note'>Las credenciales de red estan ocultas hasta activar el acceso por apartamento.</p><div class='wifi-list'><div class='wifi-item'><p class='wifi-apt'>Apartamento B</p><p class='wifi-meta'><strong>Red:</strong> Oculta</p><p class='wifi-meta'><strong>Contrasena:</strong> Oculta</p><span class='wifi-lock'>🔒 Bloqueado</span></div><div class='wifi-item'><p class='wifi-apt'>Apartamento C</p><p class='wifi-meta'><strong>Red:</strong> Oculta</p><p class='wifi-meta'><strong>Contrasena:</strong> Oculta</p><span class='wifi-lock'>🔒 Bloqueado</span></div><div class='wifi-item'><p class='wifi-apt'>Apartamento D</p><p class='wifi-meta'><strong>Red:</strong> Oculta</p><p class='wifi-meta'><strong>Contrasena:</strong> Oculta</p><span class='wifi-lock'>🔒 Bloqueado</span></div><div class='wifi-item'><p class='wifi-apt'>Apartamento E</p><p class='wifi-meta'><strong>Red:</strong> Oculta</p><p class='wifi-meta'><strong>Contrasena:</strong> Oculta</p><span class='wifi-lock'>🔒 Bloqueado</span></div><div class='wifi-item'><p class='wifi-apt'>Apartamento F</p><p class='wifi-meta'><strong>Red:</strong> Oculta</p><p class='wifi-meta'><strong>Contrasena:</strong> Oculta</p><span class='wifi-lock'>🔒 Bloqueado</span></div><div class='wifi-item'><p class='wifi-apt'>Apartamento G</p><p class='wifi-meta'><strong>Red:</strong> Oculta</p><p class='wifi-meta'><strong>Contrasena:</strong> Oculta</p><span class='wifi-lock'>🔒 Bloqueado</span></div><div class='wifi-item'><p class='wifi-apt'>Apartamento H</p><p class='wifi-meta'><strong>Red:</strong> Oculta</p><p class='wifi-meta'><strong>Contrasena:</strong> Oculta</p><span class='wifi-lock'>🔒 Bloqueado</span></div><div class='wifi-item'><p class='wifi-apt'>Apartamento I</p><p class='wifi-meta'><strong>Red:</strong> Oculta</p><p class='wifi-meta'><strong>Contrasena:</strong> Oculta</p><span class='wifi-lock'>🔒 Bloqueado</span></div><div class='wifi-item'><p class='wifi-apt'>Apartamento J</p><p class='wifi-meta'><strong>Red:</strong> Oculta</p><p class='wifi-meta'><strong>Contrasena:</strong> Oculta</p><span class='wifi-lock'>🔒 Bloqueado</span></div></div>" },
          safety: { title: "Seguridad", subtitle: "Emergencias y contactos utiles.", html: "<div class='safety-grid'><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Emergencia</p><p class='safety-detail'>112</p><p class='safety-note'>Disponible las 24 horas del día, todos los días.<br>El 112 es el número único europeo de emergencias, disponible en toda la Unión Europea.<br>Las llamadas son gratuitas.</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Linea de salud</p><p class='safety-detail'>808 24 24 24</p><p class='safety-note'>Disponible las 24 horas del día, todos los días.<br>El 112 es el número único europeo de emergencias, disponible en toda la Unión Europea.<br>Las llamadas son gratuitas.</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Hospital Lusíadas Albufeira</p><p class='safety-detail'>289 892 040</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Bomberos</p><p class='safety-detail'>289 586 333</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Policia</p><p class='safety-detail'>289 590 790</p></div></div>" },

          visit: { title: "Visitas", subtitle: "9 lugares imprescindibles en Albufeira.", html: "<div class='info-sections'><div class='info-item'><p class='info-item-title'><span class='icon'>🏖️</span>Praia dos Pescadores</p><p class='info-item-text'>La playa mas emblematica de Albufeira, a solo 5 min a pie del apartamento. Enclavada bajo los acantilados y el casco antiguo, con aguas tranquilas y azules. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Praia+dos+Pescadores+Albufeira'>Ver en el mapa</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏘️</span>Casco Antiguo de Albufeira</p><p class='info-item-text'>Calles empedradas, casas encaladas y plazas animadas. Imprescindible al atardecer, con restaurantes tipicos y vistas al mar. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Centro+Historico+Albufeira'>Ver en el mapa</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>⛵</span>Marina de Albufeira</p><p class='info-item-text'>Zona moderna con restaurantes, bares y punto de salida de excursiones en barco. A unos 3 km del apartamento. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Marina+de+Albufeira'>Ver en el mapa</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🌅</span>Praia da Falésia</p><p class='info-item-text'>Una de las playas mas espectaculares del Algarve, con acantilados anaranjados que se extienden mas de 5 km. A unos 10 km. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Praia+da+Falesia+Albufeira'>Ver en el mapa</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🪨</span>Cuevas de Benagil</p><p class='info-item-text'>Una de las cuevas marinas mas fotografiadas del mundo, con una apertura natural en el techo. Acceso en barco desde la Marina — excursion imprescindible. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Grutas+de+Benagil+Lagoa'>Ver en el mapa</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏰</span>Castillo de Silves</p><p class='info-item-text'>Majestuoso castillo moro de la epoca islamica, a unos 30 km. Silves es una de las ciudades historicas mas bonitas del Algarve. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Castelo+de+Silves'>Ver en el mapa</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🐬</span>Zoomarine</p><p class='info-item-text'>Parque tematico con espectaculos de delfines, atracciones acuaticas y entretenimiento para toda la familia. A solo 5 km del apartamento. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Zoomarine+Albufeira'>Ver en el mapa</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🎢</span>Slide &amp; Splash</p><p class='info-item-text'>Uno de los mejores parques acuaticos de Europa, con toboganes para todas las edades. A unos 25 km, ideal para un dia en familia. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Slide+Splash+Lagoa+Algarve'>Ver en el mapa</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏄</span>Praia da Galé</p><p class='info-item-text'>Playa tranquila y familiar con aguas cristalinas y acantilados dorados. A unos 8 km, ideal para quienes buscan calma junto al mar. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Praia+da+Gale+Albufeira'>Ver en el mapa</a></p></div></div>" },
          activities: { title: "Actividades", subtitle: "9 experiencias imprescindibles en Albufeira.", html: "<div class='info-sections'><div class='info-item'><p class='info-item-title'><span class='icon'>🚤</span>Paseo en Barco a las Cuevas de Benagil</p><p class='info-item-text'>La excursion mas popular del Algarve. Sale desde la Marina de Albufeira hacia las famosas cuevas marinas, incluida la iconica Cueva de Benagil. Reserva con antelacion en verano.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🐬</span>Avistamiento de Delfines</p><p class='info-item-text'>Salidas diarias desde la Marina de Albufeira para observar delfines y otras especies marinas en el Atlantico. Una experiencia unica e inolvidable para toda la familia.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏄</span>Surf, Bodyboard &amp; SUP</p><p class='info-item-text'>El Algarve ofrece excelentes condiciones para el surf y el bodyboard. Hay escuelas y alquiler de material en las principales playas. El paddle surf (SUP) es ideal para aguas tranquilas y explorar los acantilados.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🤿</span>Buceo &amp; Snorkeling</p><p class='info-item-text'>Descubre el fondo marino del Algarve: cuevas submarinas, arrecifes y rica fauna marina. Los centros de buceo en la Marina ofrecen clases para principiantes e inmersiones guiadas.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🎣</span>Pesca Deportiva</p><p class='info-item-text'>Salidas de pesca desde la Marina de Albufeira con guia y equipamiento incluido. Pesca a la cana, pesca de fondo y pesca deportiva en alta mar a lo largo de la costa algarvia.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🚶</span>Paseo por el Casco Antiguo</p><p class='info-item-text'>Explora las calles empedradas, los miradores con vistas al mar, las iglesias y las plazas tipicas del Albufeira historico. Imprescindible al atardecer, cuando la luz dorada ilumina la ciudad.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🚙</span>Safari en Jeep &amp; Tour en Buggy</p><p class='info-item-text'>Aventura 4x4 por el interior algarvio: naranjos, pueblos tradicionales y paisajes espectaculares. Circuitos de medio dia y dia completo salen de Albufeira a diario.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏖️</span>Dias de Playa</p><p class='info-item-text'>Con mas de 10 playas a menos de 15 km, hay para todos los gustos: animadas con bares y actividades (Praia da Oura) o tranquilas y salvajes como Praia da Galé y Praia da Falésia.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🚴</span>Ciclismo &amp; Senderismo</p><p class='info-item-text'>La zona de Albufeira cuenta con rutas costeras e interiores. Alquiler de bicicletas disponible en la ciudad. A pie, el Percurso dos Sete Vales Suspensos es uno de los mas espectaculares del Algarve.</p></div></div>" },
          eat: { title: "Comer y Beber", subtitle: "Restaurantes ordenados de más barato a más caro.", html: "<div class='rest-list'><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://maps.app.goo.gl/rA4cq7F3agYmyYcy6' target='_blank' rel='noreferrer'>Franguinho de Albufeira</a><span class='rest-price eco'>€</span></div><span class='rest-cuisine'>🍗 Pollo asado / Para llevar</span><p class='rest-addr'>📍 Centro de Albufeira · <a class='link' href='https://maps.app.goo.gl/rA4cq7F3agYmyYcy6' target='_blank' rel='noreferrer'>Ver en el mapa</a></p><p class='rest-menu-label'>Carta</p><div class='rest-tags'><span>Pollo al carbón</span><span>Patatas fritas</span><span>Piri-piri</span><span>Ensaladas</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://www.google.com/maps/search/?api=1&query=Copos+Petiscos+Albufeira' target='_blank' rel='noreferrer'>Copos &amp; Petiscos</a><span class='rest-price mid'>€€</span></div><span class='rest-cuisine'>🍷 Bar de vinos &amp; petiscos</span><p class='rest-addr'>📍 R. Alexandre Herculano, Albufeira · <a class='link' href='https://www.google.com/maps/search/?api=1&query=Copos+Petiscos+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a></p><p class='rest-menu-label'>Carta</p><div class='rest-tags'><span>Petiscos</span><span>Tabla de embutidos</span><span>Quesos</span><span>Vinos seleccionados</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://maps.app.goo.gl/w9gtzSM2WV5ixY5YA' target='_blank' rel='noreferrer'>Tasca do Viegas</a><span class='rest-price mid'>€€</span></div><span class='rest-cuisine'>🫙 Tasca portuguesa tradicional</span><p class='rest-addr'>📍 Casco histórico de Albufeira · <a class='link' href='https://maps.app.goo.gl/w9gtzSM2WV5ixY5YA' target='_blank' rel='noreferrer'>Ver en el mapa</a></p><p class='rest-menu-label'>Carta</p><div class='rest-tags'><span>Petiscos</span><span>Bocadillo de filete</span><span>Bacalao</span><span>Caracoles</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://www.google.com/maps/search/?api=1&query=Cepa+Velha+Albufeira' target='_blank' rel='noreferrer'>Cepa Velha</a><span class='rest-price mid'>€€</span></div><span class='rest-cuisine'>🍽️ Cocina portuguesa tradicional</span><p class='rest-addr'>📍 R. Vasco da Gama, Albufeira · <a class='link' href='https://www.google.com/maps/search/?api=1&query=Cepa+Velha+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a></p><p class='rest-menu-label'>Carta</p><div class='rest-tags'><span>Cataplana</span><span>Bacalao</span><span>Parrillada</span><span>Sangria</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://maps.app.goo.gl/uXt8f8Lu8vPBQv7c6' target='_blank' rel='noreferrer'>Clay Oven</a><span class='rest-price mid'>€€</span></div><span class='rest-cuisine'>🍛 Cocina india</span><p class='rest-addr'>📍 Albufeira · <a class='link' href='https://maps.app.goo.gl/uXt8f8Lu8vPBQv7c6' target='_blank' rel='noreferrer'>Ver en el mapa</a></p><p class='rest-menu-label'>Carta</p><div class='rest-tags'><span>Tikka Masala</span><span>Biryani</span><span>Naan</span><span>Curries</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://www.google.com/maps/search/?api=1&query=O+Lusitano+Albufeira' target='_blank' rel='noreferrer'>O Lusitano</a><span class='rest-price hi'>€€€</span></div><span class='rest-cuisine'>🍴 Cocina portuguesa moderna</span><p class='rest-addr'>📍 Urb. Quinta da Correeira, Albufeira · <a class='link' href='https://www.google.com/maps/search/?api=1&query=O+Lusitano+Albufeira' target='_blank' rel='noreferrer'>Ver en el mapa</a></p><p class='rest-menu-label'>Carta</p><div class='rest-tags'><span>Cataplana de rape</span><span>Magret de pato</span><span>Filete portugués</span><span>Bacalao</span></div></div><div class='rest-card'><div class='rest-header'><a class='rest-name' href='https://maps.app.goo.gl/5GTwm6RyKvPDEC338' target='_blank' rel='noreferrer'>Taberna do Pescador</a><span class='rest-price hi'>€€€</span></div><span class='rest-cuisine'>🦞 Mariscos &amp; Pescado fresco</span><p class='rest-addr'>📍 Casco histórico de Albufeira · <a class='link' href='https://maps.app.goo.gl/5GTwm6RyKvPDEC338' target='_blank' rel='noreferrer'>Ver en el mapa</a></p><p class='rest-menu-label'>Carta</p><div class='rest-tags'><span>Almejas</span><span>Percebes</span><span>Cataplana</span><span>Pescado del día</span></div></div></div>" },

      de: {
        back: "← Zurueck",
        fallbackTitle: "Information",
        fallbackSubtitle: "Thema nicht gefunden.",
        sections: {
          welcome: { title: "Willkommen", subtitle: "Ueberblick ueber die Unterkunft.", html: "<div class='welcome-layout'><p class='welcome-block'>White Sand Apartments, komplett renoviert und modern eingerichtet, in den Typen T1, T2 und T0, befinden sich in einer der privilegiertesten Gegenden von Albufeira, nahe aller Dienstleistungen und nur 300 m vom Strand entfernt! Mit allen angebotenen Annehmlichkeiten moechten wir dir ein grossartiges Erlebnis bieten, damit dein Aufenthalt so komfortabel wie moeglich ist und du vor allem ausruhst und einen wunderschoenen Urlaub geniesst!</p><div class='welcome-image-slot'><img src='./welcome-all.png' alt='White Sand Wohnung'></div></div>" },
          check: { title: "Check-in", subtitle: "Anreiseinformationen.", html: "<p class='line'><strong>Check-in:</strong> ab 16:00</p><p class='line'>Die Schluessel werden in einem kleinen Schluesseltresor am Gebaeudeeingang hinterlegt, und du erhaeltst den Zugangscode am Tag deiner Anreise.</p><div class='checkin-gallery'><img src='./checkin-2.jpg' alt='Gebaeudeeingang'><img src='./checkin-3.jpg' alt='Eingangsposition'><img src='./checkin-1.jpg' alt='Schluesseltresor'></div>" },
          location: { title: "Lage", subtitle: "Adresse und Karte.", html: "<p class='line'><strong>Adresse:</strong> Rua do MFA, n.15 Apto (Buchstabe Ihrer Wohnung), 8200-157 Albufeira</p><p class='line'><strong>Koordinaten:</strong> 37.0891053, -8.2507170</p><p class='line'><a class='link' target='_blank' rel='noreferrer' href='https://goo.gl/maps/sj565hq985biABaD6'>In Google Maps oeffnen</a></p><div class='extra-location'><p class='extra-location-text'>Die Apartments liegen im historischen Zentrum von Albufeira, nur wenige Gehminuten von der Praia dos Pescadores und anderen Straenden entfernt. Die Lage ist ausgezeichnet, mit Restaurants, Bars, Supermaerkten und Geschaeften direkt in der Umgebung, sodass man alles zu Fuss erledigen kann. Nur wenige Meter entfernt befinden sich auch der Platz der Altstadt, typische Algarve-Gassen und Aussichtspunkte mit beeindruckendem Meerblick. Ideal fuer alle, die das Beste der Stadt zwischen Strand und Unterhaltung geniessen moechten, ohne ein Auto zu brauchen.</p><div class='extra-location-images'><img src='./localizacao-1.jpg' alt='Strand in Albufeira'><img src='./localizacao-2.jpg' alt='Historisches Zentrum von Albufeira'></div></div>" },
          info: { title: "Information", subtitle: "Wichtige Infos fuer den Aufenthalt.", html: "<div class='info-sections'><div class='info-item'><p class='info-item-title'><span class='icon'>🅿️</span>Parken</p><p class='info-item-text'>In unserer Strasse und in der Umgebung koennen Sie kostenlos parken (Strassenparkplaetze). Es gibt auch einen kostenpflichtigen Parkplatz in 130 Metern Entfernung. Parkplatz-Standort: <a class='link' target='_blank' rel='noreferrer' href='https://maps.app.goo.gl/gmK6iXghkyXu6mPLA'>Standort oeffnen</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🧹</span>Reinigungsservice</p><p class='info-item-text'>Wir stellen Bettwaesche und Badetuecher fuer Ihren Aufenthalt bereit. Bei laengeren Aufenthalten bieten wir am 8. Tag kostenlos einen Waeschewechsel und eine kurze Reinigung an.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🗑️</span>Muell - Container</p><p class='info-item-text'>In einer Strasse weiter unten gibt es spezielle Container zur Entsorgung Ihres Muells. Standort: <a class='link' target='_blank' rel='noreferrer' href='https://maps.app.goo.gl/SYxqfTYpkznRy9Ky6'>Standort oeffnen</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🧾</span>TMT</p><p class='info-item-text'>Kommunale Tourismussteuer von Albufeira (2€ pro Person/Nacht bis maximal 7 Naechte), gemaess den lokalen Bestimmungen. Falls diese Steuer nicht im Gesamtbetrag Ihrer Buchung enthalten ist, muss die Zahlung gemaess den Ihnen zugesendeten Informationen erfolgen.</p></div></div>" },
          rules: { title: "Hausregeln", subtitle: "Wichtige Regeln fuer einen ruhigen Aufenthalt.", html: "<div class='rules-grid'><div class='rule-card'><p class='rule-num'>01</p><p class='rule-title'>Rauchen verboten</p><p class='rule-text'>Bitte nicht in oder rund um die Wohnung rauchen oder vapen.</p></div><div class='rule-card'><p class='rule-num'>02</p><p class='rule-title'>Keine Besucher</p><p class='rule-text'>Keine nicht registrierten Besucher. Informieren Sie den Gastgeber, wenn Sie weitere Gaeste zur Buchung hinzufuegen moechten.</p></div><div class='rule-card'><p class='rule-num'>03</p><p class='rule-title'>Keine Haustiere</p><p class='rule-text'>Haustiere sind auf dem gesamten Grundstueck nicht erlaubt.</p></div><div class='rule-card'><p class='rule-num'>04</p><p class='rule-title'>Keine Partys</p><p class='rule-text'>Partys oder Veranstaltungen sind nicht erlaubt.</p></div><div class='rule-card'><p class='rule-num'>05</p><p class='rule-title'>Schaeden</p><p class='rule-text'>Bitte melden Sie Schaeden oder Stoerungen sofort dem Gastgeber, damit wir den betroffenen Gegenstand reparieren oder ersetzen koennen.</p></div><div class='rule-card'><p class='rule-num'>06</p><p class='rule-title'>Ruhezeiten</p><p class='rule-text'>Fuer den Komfort und das Wohlbefinden von Gaesten und Nachbarn bitten wir darum, den Geraeuschpegel waehrend der Ruhezeiten auf ein Minimum zu reduzieren.</p></div></div>" },
          amenities: { title: "Komfort", subtitle: "Ausstattung der Unterkunft.", html: "<p class='amenities-intro'>Die Wohnung ist mit allen Annehmlichkeiten ausgestattet, die Sie fuer einen komfortablen Aufenthalt benoetigen.</p><ul class='list amenities-list'><li>Wi-Fi</li><li>Smart-TV</li><li>Kaffeemaschine</li><li>Haartrockner</li><li>Bettwaesche</li><li>Badetuecher</li><li>Shampoo und Duschgel</li><li>Tischgeschirr und Kuechenutensilien</li><li>Klimaanlage</li><li>Waschmaschine</li></ul>" },
          wifi: { title: "Wi-Fi", subtitle: "Internetzugang.", html: "<p class='wifi-note'>Die Netzwerkdaten sind ausgeblendet, bis der wohnungsbezogene Zugriff aktiviert ist.</p><div class='wifi-list'><div class='wifi-item'><p class='wifi-apt'>Apartment B</p><p class='wifi-meta'><strong>Netzwerk:</strong> Versteckt</p><p class='wifi-meta'><strong>Passwort:</strong> Versteckt</p><span class='wifi-lock'>🔒 Gesperrt</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment C</p><p class='wifi-meta'><strong>Netzwerk:</strong> Versteckt</p><p class='wifi-meta'><strong>Passwort:</strong> Versteckt</p><span class='wifi-lock'>🔒 Gesperrt</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment D</p><p class='wifi-meta'><strong>Netzwerk:</strong> Versteckt</p><p class='wifi-meta'><strong>Passwort:</strong> Versteckt</p><span class='wifi-lock'>🔒 Gesperrt</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment E</p><p class='wifi-meta'><strong>Netzwerk:</strong> Versteckt</p><p class='wifi-meta'><strong>Passwort:</strong> Versteckt</p><span class='wifi-lock'>🔒 Gesperrt</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment F</p><p class='wifi-meta'><strong>Netzwerk:</strong> Versteckt</p><p class='wifi-meta'><strong>Passwort:</strong> Versteckt</p><span class='wifi-lock'>🔒 Gesperrt</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment G</p><p class='wifi-meta'><strong>Netzwerk:</strong> Versteckt</p><p class='wifi-meta'><strong>Passwort:</strong> Versteckt</p><span class='wifi-lock'>🔒 Gesperrt</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment H</p><p class='wifi-meta'><strong>Netzwerk:</strong> Versteckt</p><p class='wifi-meta'><strong>Passwort:</strong> Versteckt</p><span class='wifi-lock'>🔒 Gesperrt</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment I</p><p class='wifi-meta'><strong>Netzwerk:</strong> Versteckt</p><p class='wifi-meta'><strong>Passwort:</strong> Versteckt</p><span class='wifi-lock'>🔒 Gesperrt</span></div><div class='wifi-item'><p class='wifi-apt'>Apartment J</p><p class='wifi-meta'><strong>Netzwerk:</strong> Versteckt</p><p class='wifi-meta'><strong>Passwort:</strong> Versteckt</p><span class='wifi-lock'>🔒 Gesperrt</span></div></div>" },
          safety: { title: "Sicherheit", subtitle: "Notfall und wichtige Kontakte.", html: "<div class='safety-grid'><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Notfall</p><p class='safety-detail'>112</p><p class='safety-note'>Rund um die Uhr an jedem Tag erreichbar.<br>112 ist die einheitliche europäische Notrufnummer in der gesamten Europäischen Union.<br>Anrufe sind kostenlos.</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Gesundheitslinie</p><p class='safety-detail'>808 24 24 24</p><p class='safety-note'>Rund um die Uhr an jedem Tag erreichbar.<br>112 ist die einheitliche europäische Notrufnummer in der gesamten Europäischen Union.<br>Anrufe sind kostenlos.</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Lusíadas Krankenhaus Albufeira</p><p class='safety-detail'>289 892 040</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Feuerwehr</p><p class='safety-detail'>289 586 333</p></div><div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span><p class='safety-title'>Polizei</p><p class='safety-detail'>289 590 790</p></div></div>" },

          visit: { title: "Besuch", subtitle: "9 Sehenswuerdigkeiten in Albufeira.", html: "<div class='info-sections'><div class='info-item'><p class='info-item-title'><span class='icon'>🏖️</span>Praia dos Pescadores</p><p class='info-item-text'>Albufeiras bekanntester Strand, nur 5 Gehminuten von der Unterkunft entfernt. Eingebettet unter den Klippen und der Altstadt, mit ruhigem, klarem Wasser. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Praia+dos+Pescadores+Albufeira'>Auf der Karte anzeigen</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏘️</span>Altstadt von Albufeira</p><p class='info-item-text'>Kopfsteinpflasterstrassen, weiss gekalkte Haeuser und lebhafte Plaetze. Unbedingt bei Sonnenuntergang besuchen — mit typischen Restaurants und Meerblick. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Centro+Historico+Albufeira'>Auf der Karte anzeigen</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>⛵</span>Marina von Albufeira</p><p class='info-item-text'>Moderner Bereich mit Restaurants, Bars und Ausgangspunkt fuer Bootstouren. Etwa 3 km von der Unterkunft entfernt. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Marina+de+Albufeira'>Auf der Karte anzeigen</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🌅</span>Praia da Falésia</p><p class='info-item-text'>Einer der spektakulaersten Straende der Algarve: orangefarbene Klippen, die sich ueber mehr als 5 km erstrecken. Ca. 10 km entfernt. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Praia+da+Falesia+Albufeira'>Auf der Karte anzeigen</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🪨</span>Benagil-Hoehlen</p><p class='info-item-text'>Eine der meistfotografierten Meereshoehlen der Welt, mit einer natuerlichen Oeffnung im Dach. Zugang per Boot von der Marina — ein absolutes Muss. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Grutas+de+Benagil+Lagoa'>Auf der Karte anzeigen</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏰</span>Burg Silves</p><p class='info-item-text'>Eine majestätische maurische Burg aus der islamischen Aera, ca. 30 km entfernt. Silves ist eine der schoensten historischen Staedte der Algarve. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Castelo+de+Silves'>Auf der Karte anzeigen</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🐬</span>Zoomarine</p><p class='info-item-text'>Freizeitpark mit Delfinshows, Wasserattraktionen und Unterhaltung fuer die ganze Familie. Nur 5 km von der Unterkunft entfernt. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Zoomarine+Albufeira'>Auf der Karte anzeigen</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🎢</span>Slide &amp; Splash</p><p class='info-item-text'>Einer der besten Wasserparks Europas, mit Rutschen fuer jedes Alter. Ca. 25 km entfernt — perfekt fuer einen Familientag. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Slide+Splash+Lagoa+Algarve'>Auf der Karte anzeigen</a></p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏄</span>Praia da Galé</p><p class='info-item-text'>Ein ruhiger, familienfreundlicher Strand mit kristallklarem Wasser und goldenen Klippen. Ca. 8 km entfernt — ideal fuer Erholung am Meer. <a class='link' target='_blank' rel='noreferrer' href='https://www.google.com/maps/search/?api=1&query=Praia+da+Gale+Albufeira'>Auf der Karte anzeigen</a></p></div></div>" },
          activities: { title: "Aktivitaeten", subtitle: "9 unverzichtbare Erlebnisse in Albufeira.", html: "<div class='info-sections'><div class='info-item'><p class='info-item-title'><span class='icon'>🚤</span>Bootstour zu den Benagil-Hoehlen</p><p class='info-item-text'>Die beliebteste Ausflugsfahrt der Algarve. Abfahrt von der Marina Albufeira zu den beruhmten Meereshoehlen, darunter die ikonische Benagil-Hoehle mit ihrer natuerlichen Oeffnung im Dach. Im Sommer bitte im Voraus buchen.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🐬</span>Delfin-Beobachtung</p><p class='info-item-text'>Taeglich Touren von der Marina Albufeira zur Beobachtung von Delfinen und anderen Meerestieren im Atlantik. Ein einzigartiges Erlebnis fuer die ganze Familie.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏄</span>Surfen, Bodyboard &amp; SUP</p><p class='info-item-text'>Die Algarve bietet hervorragende Bedingungen fuer Surfen und Bodyboard. Surfschulen und Verleih sind an den Hauptstraenden verfuegbar. Stand-Up-Paddling ist ideal fuer ruhige Gewaesser und Kuestenerkundung.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🤿</span>Tauchen &amp; Schnorcheln</p><p class='info-item-text'>Entdecke die Unterwasserwelt der Algarve: versunkene Hoehlen, Riffe und reiches Meeresleben. Tauchzentren an der Marina bieten Anfaengerkurse und gefuehrte Tauchgaenge an.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🎣</span>Sportangeln</p><p class='info-item-text'>Angeltouren von der Marina Albufeira mit Guide und Ausruestung inklusive. Angeln an der Leine, Grundangeln und Hochseeangeln entlang der Algarve-Kueste.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🚶</span>Spaziergang durch die Altstadt</p><p class='info-item-text'>Erkundige die gepflasterten Gassen, Aussichtspunkte mit Meerblick, Kirchen und typische Plaetze des historischen Albufeiras. Unbedingt bei Sonnenuntergang besuchen.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🚙</span>Jeep-Safari &amp; Buggy-Tour</p><p class='info-item-text'>Offroad-Abenteuer durch das Algarve-Hinterland: Orangenhaine, traditionelle Doerfer und atemberaubende Landschaften. Halb- und Ganztagestouren starten taeglich in Albufeira.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🏖️</span>Strandtage</p><p class='info-item-text'>Mit ueber 10 Straenden in weniger als 15 km ist fuer jeden etwas dabei: belebte Straende mit Bars und Aktivitaeten (Praia da Oura) oder ruhige Naturstraende wie Praia da Galé und Praia da Falésia.</p></div><div class='info-item'><p class='info-item-title'><span class='icon'>🚴</span>Radfahren &amp; Wandern</p><p class='info-item-text'>Die Region Albufeira bietet Kuestenwanderwege und Innenstadtrouten. Fahrradvermietung in der Stadt verfuegbar. Zu Fuss ist der Sieben-Haengetaeler-Pfad einer der spektakulaersten Wanderwege der Algarve.</p></div></div>" },

        "<div class='safety-card'><span class='safety-bullet' aria-hidden='true'></span>" +
        `<p class='safety-title'>${t.moreTrainHead}</p>` +
        `<p class='safety-note'>${t.moreTrainHtml}</p>` +
        `<p class='safety-note'><strong>${t.taxiMapLbl}</strong> <a class='link' target='_blank' rel='noreferrer' href='${TRAIN_MAPS_URL}'>${t.taxiMapLink}</a></p>` +
        "<p class='safety-note transport-app-downloads'>" +
        `<a class='link' target='_blank' rel='noreferrer' href='${CP_APP_IOS_URL}'>${t.cpAppIos}</a><br>` +
        `<a class='link' target='_blank' rel='noreferrer' href='${CP_APP_ANDROID_URL}'>${t.cpAppAndroid}</a>` +
        "</p>" +
        "</div>";
      const comboioPanel =
        "<div class='transport-wrap'><div class='safety-grid'>" + trainCard + "</div></div>";
      const autocarroPanel =
        "<div class='transport-wrap'><div class='safety-grid'>" + busCard + vamusCard + "</div></div>";
      return (
        "<div class='transport-tabs'>" +
        "<div class='transport-tablist' role='tablist'>" +
        "<button type='button' class='transport-tab transport-tab--active' role='tab' aria-selected='true'>" +
        `${t.tabTaxi}</button>` +
        `<button type='button' class='transport-tab' role='tab' aria-selected='false'>${t.tabUber}</button>` +
        `<button type='button' class='transport-tab' role='tab' aria-selected='false'>${t.tabComboio}</button>` +
        `<button type='button' class='transport-tab' role='tab' aria-selected='false'>${t.tabAutocarro}</button>` +
        "</div>" +
        "<div class='transport-panel transport-panel--active' role='tabpanel'><div class='transport-wrap'><div class='safety-grid'>" +
        taxiCard +
        "</div></div></div>" +
        "<div class='transport-panel' role='tabpanel'><div class='transport-wrap'><div class='safety-grid'>" +
        uberCard +
        "</div></div></div>" +
        "<div class='transport-panel' role='tabpanel'>" +
        comboioPanel +
        "</div>" +
        "<div class='transport-panel' role='tabpanel'>" +
        autocarroPanel +
        "</div>" +
        "</div>"
      );
    }

    function setupTransportTabs() {
      const root = document.querySelector(".transport-tabs");
      if (!root) return;
      const tabs = Array.from(root.querySelectorAll(".transport-tab"));
      const panels = Array.from(root.querySelectorAll(".transport-panel"));
      const activate = (i) => {
        tabs.forEach((btn, j) => {
          btn.classList.toggle("transport-tab--active", j === i);
          btn.setAttribute("aria-selected", j === i ? "true" : "false");
        });
        panels.forEach((p, j) => p.classList.toggle("transport-panel--active", j === i));
      };
      tabs.forEach((btn, i) => {
        btn.addEventListener("click", () => activate(i));
      });
    }

    function renderWifiSection(currentLang) {
      const t = wifiUi[currentLang] || wifiUi.pt;
      const cards = wifiApts.map((apt) =>
        `<div class='wifi-item'><p class='wifi-apt'>${t.apt} ${apt}</p><p class='wifi-meta'><strong>${t.network}</strong> ${t.hidden}</p><p class='wifi-meta'><strong>${t.password}</strong> ${t.hidden}</p><span class='wifi-lock'>${t.locked}</span><br><a class='wifi-btn' href='./wifi-acesso.html?apt=${apt}&lang=${currentLang}'>${t.button}</a></div>`
      ).join("");
      return `<p class='wifi-note'>${t.note}</p><div class='wifi-list'>${cards}</div>`;
    }

    function render() {
      const dict = text[lang];
      const item = dict.sections[sec];
      const title = document.getElementById("title");
      const subtitle = document.getElementById("subtitle");
      const content = document.getElementById("content");
      const back = document.querySelector(".back");

      back.textContent = dict.back;
      back.href = `./?lang=${lang}`;

      if (!item) {
        title.textContent = dict.fallbackTitle;
        subtitle.textContent = dict.fallbackSubtitle;
        content.innerHTML = "";
      } else {
        title.textContent = item.title;
        subtitle.textContent = item.subtitle;
        if (sec === "wifi") {
          content.innerHTML = renderWifiSection(lang);
        } else if (sec === "transport") {
          content.innerHTML = renderTransportSection(lang);
          setupTransportTabs();
        } else {
          content.innerHTML = item.html;
        }
      }

      document.documentElement.lang = lang === "pt" ? "pt-PT" : lang;
      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });
    }

    document.querySelectorAll(".lang-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        lang = btn.dataset.lang;
        const url = new URL(window.location.href);
        url.searchParams.set("lang", lang);
        window.history.replaceState({}, "", url);
        render();
      });
    });

    render();
  </script>
</body>
</html>
